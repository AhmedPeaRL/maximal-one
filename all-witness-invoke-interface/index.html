<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All-Witness · Invoke</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>
    <h1>All-Witness</h1>
    <p class="subtitle">Invocation does not require response.</p>

    <textarea id="invocation"
      placeholder="Write your invocation. It may remain unanswered."></textarea>

    <button onclick="witness()">Witness</button>

    <div id="ack" class="hidden">
      Your invocation has been witnessed.
    </div>
  </main>

  <script src="witness.js"></script>
</body>
</html>
