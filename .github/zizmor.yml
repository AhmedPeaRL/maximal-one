# Narrow compatibility exception for same-repository reusable workflows.
#
# GitHub supports both ./ and $/ syntax for reusable workflows.
# The pinned actionlint 1.7.12 accepts the ./ form used here.
# zizmor 1.30.1 prefers $/ and reports self-repository on these two calls.
#
# Ignore only these two exact call sites.
# Keep the self-repository audit enabled for every other workflow.

rules:
  self-repository:
    ignore:
      - replication.yml:384
      - software-assurance-exact-commit-v1.yml:24
