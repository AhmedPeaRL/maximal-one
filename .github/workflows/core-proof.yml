name: Core Scientific Proof (Minimal)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false
  NODE_OPTIONS: "--no-deprecation"

jobs:
  core-proof:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Python path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Enforce deterministic env
        run: |
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
          echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
          echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Rate limit guard
        run: |
          echo "Checking execution frequency..."
          sleep 5

      - name: Install deps (STRICT)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt

      - name: Validate dataset content
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("real-data/sunspots_global.csv")

          if len(df) < 10:
              raise SystemExit("Dataset too small")

          if not any(c in df.columns for c in ["Sunspots", "value"]):
              raise SystemExit("No valid data column")
         
          print("✅ dataset valid")
          PY

          python - <<'PY'
          import pandas as pd
          import numpy as np

          np.random.seed(42)

          n = 200

          # White noise
          wn = np.random.randn(n)
          pd.DataFrame({"value": wn}).to_csv("real-data/white_noise.csv", index=False)

          # Random walk
          rw = np.cumsum(np.random.randn(n))
          pd.DataFrame({"value": rw}).to_csv("real-data/random_walk.csv", index=False)

          # Shuffled sunspots
          sun = pd.read_csv("real-data/sunspots_global.csv").iloc[:,0].values
          shuffled = np.random.permutation(sun)
          pd.DataFrame({"value": shuffled}).to_csv("real-data/shuffled_sunspots.csv", index=False)

          print("✅ control datasets generated")
          PY

      - name: Run canonical experiment ONLY
        run: |
          python scripts/generate_report.py --seed 42 --canonical

      - name: Run causal hint
        run: python analysis/causal_hint.py

      - name: Reproducibility stamp
        run: |
          python - <<'PY'
          from analysis.reproducibility_stamp import attach_stamp
          print("STAMP:", attach_stamp("artifacts/canonical_report.json"))
          PY

      - name: Predictive validation
        run: |
          python - <<'PY'
          import pandas as pd
          from analysis.predictive_validation import evaluate_prediction

          df = pd.read_csv("real-data/sunspots_global.csv")
          col = "Sunspots" if "Sunspots" in df.columns else "value"

          res = evaluate_prediction(df[col].values)

          if not res["valid"]:
              raise SystemExit("❌ Prediction failed")

          print("✅ Prediction:", res)
          PY

      - name: Cross-domain validation
        run: |
          python analysis/cross_domain_validator.py
          
      - name: Null Gap Test
        run: |
          python analysis/null_gap_test.py

      - name: Extract alpha (fixed)
        run: |
          python - <<'PY'
          import json
          import numpy as np

          r = json.load(open("artifacts/canonical_report.json"))
          claim = json.load(open("core-scientific/strict_claim.json"))

          sp = r["spectral_profile"]

          alpha = sp["estimated_alpha"]
          sigma = sp["bootstrap_std"]

          expected_min, expected_max = claim["expected_result"]["alpha_range"]
          max_sigma = claim["expected_result"]["max_sigma"]

          print("alpha:", alpha)
          print("sigma:", sigma)

          # STRICT VALIDATION
          if not np.isfinite(sigma):
              raise SystemExit("❌ sigma is NaN")
              
          if not (expected_min <= alpha <= expected_max):
              raise SystemExit("❌ alpha خارج النطاق المتوقع")

          if sigma > max_sigma:
              raise SystemExit("❌ sigma أعلى من الحد")

          print("✅ STRICT CLAIM HOLDS")
          PY

      - name: Physical interpretation
        run: |
          python analysis/physical_interpretation.py

      - name: Run multi-dataset proof
        run: |
          python scripts/run_multi_dataset.py

      - name: Invariant Stability Guard
        run: |
          python analysis/invariant_stability_guard.py

      - name: Band robustness test
        run: |
          python analysis/band_robustness_test.py

      - name: Independent validation
        run: |
          python - <<'PY'
          import pandas as pd
          from analysis.independent_validation import compare_methods

          df = pd.read_csv("real-data/sunspots_global.csv")
          col = "Sunspots" if "Sunspots" in df.columns else "value"

          compare_methods(df[col].values)
          PY

      - name: External Reproduction Guard
        run: python analysis/external_reproduction_guard.py

      - name: Adversarial stress test
        run: python analysis/adversarial_external_test.py

      - name: Export commit
        run: echo "GITHUB_SHA=${{ github.sha }}" >> $GITHUB_ENV

      - name: Hash report
        run: sha256sum artifacts/canonical_report.json
