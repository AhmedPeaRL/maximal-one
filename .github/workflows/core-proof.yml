name: Core Scientific Proof (Minimal)

on:
  push:
  workflow_dispatch:

jobs:
  core-proof:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set Python path
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Install deps (STRICT)
        run: |
          pip install --upgrade pip
          pip install git-filter-repo
          git filter-repo --strip-blobs-bigger-than 1M
          git filter-repo --invert-paths --path index.html
          pip install --require-hashes -r requirements-lock.txt

      - name: Validate dataset content
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("real-data/sunspots_global.csv")

          if len(df) < 10:
              raise SystemExit("Dataset too small")

          if not any(c in df.columns for c in ["Sunspots", "value"]):
              raise SystemExit("No valid data column")
         
          print("✅ dataset valid")
          PY

      - name: Run canonical experiment ONLY
        run: |
          python scripts/generate_report.py --seed 42 --canonical

      - name: Run multi-dataset proof
        run: |
          python scripts/run_multi_dataset.py

      - name: Extract alpha
        run: |
          python - <<'PY'
          import json

          r = json.load(open("artifacts/canonical_report.json"))

          if "spectral_profile" not in r:
              raise SystemExit("❌ invalid report structure")

          alpha = r["spectral_profile"]["estimated_alpha"]
          sigma = r["spectral_profile"]["bootstrap_std"]

          print("alpha:", alpha)
          print("sigma:", sigma)

          if sigma > 0.2:
              raise SystemExit("❌ sigma too high")

          if abs(alpha - r["spectral_profile"]["noise_alpha"]) < 0.2:
              raise SystemExit("❌ not distinguishable from noise")

          print("✅ CORE CLAIM HOLDS (non-trivial)")
          PY

      - name: Physical interpretation
        run: |
          python analysis/physical_interpretation.py

      - name: Hash report
        run: sha256sum artifacts/canonical_report.json
