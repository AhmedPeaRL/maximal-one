name: Repro Core Verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List repository structure
        run: |
          echo "Root:"
          ls -la
          echo "Repro core contents:"
          ls -la repro-core || echo "repro-core not found"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Run deterministic kernel
        run: |
          mkdir -p artifacts
          python repro-core/deterministic_kernel.py > artifacts/state.json
          python repro-core/environment_fingerprint.py > artifacts/environment.json

      - name: Verify canonical hash
        run: |
          cat artifacts/state.json | python repro-core/canonical_hash.py
          echo "Environment fingerprint:"
          cat artifacts/environment.json

      - name: Adversarial stability test
        run: |
          python repro-core/adversarial_test.py
