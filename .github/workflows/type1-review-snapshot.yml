name: Type-I Exact Review Snapshot and SHA-256

on:
  workflow_dispatch:
    inputs:
      review_commit:
        description: Exact 40-character review commit SHA
        required: true
        type: string
      inventory_artifact_id:
        description: Artifact ID from the fresh governance inventory run
        required: true
        type: string
      inventory_source_commit:
        description: Exact commit SHA used by the inventory workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify selected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"

      - name: Checkout exact review commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.review_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.review_commit }}
          INVENTORY_COMMIT: ${{ inputs.inventory_source_commit }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_COMMIT"
          test "$ACTUAL" = "$EVENT_COMMIT"
          test "$INVENTORY_COMMIT" = "$EXPECTED_COMMIT"
          echo "Verified exact review and inventory commit: $ACTUAL"

      - name: Verify governance inventory artifact provenance
        id: inventory
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.inventory_artifact_id }}
          EXPECTED_COMMIT: ${{ inputs.review_commit }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > inventory_artifact_metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("inventory_artifact_metadata.json").read_text())
          expected=os.environ["EXPECTED_COMMIT"]
          if data.get("expired") is not False:
              raise SystemExit("BLOCKED: inventory artifact is expired.")
          if not data.get("name","").startswith("type1-v3-v4-governance-inventory-"):
              raise SystemExit("BLOCKED: unexpected inventory artifact name.")
          run=data.get("workflow_run") or {}
          if run.get("head_sha") != expected:
              raise SystemExit("BLOCKED: inventory artifact commit mismatch.")
          if run.get("head_branch") != "review/type1-v4-remediation":
              raise SystemExit("BLOCKED: inventory artifact branch mismatch.")
          if not run.get("id"):
              raise SystemExit("BLOCKED: artifact has no source workflow run ID.")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"run_id={run['id']}\n")
              f.write(f"artifact_name={data['name']}\n")
          print("Artifact provenance verified:", data["id"], run["head_sha"])
          PY

      - name: Download the exact governance inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.inventory.outputs.artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.inventory.outputs.run_id }}
          path: inventory_download

      - name: Verify downloaded inventory and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s inventory_download/type1_governance_inventory/reference_inventory.json

          sha256sum inventory_download/type1_governance_inventory/reference_inventory.json \
            | tee inventory_download/type1_governance_inventory/INVENTORY_SHA256.txt

          cat inventory_download/type1_governance_inventory/INVENTORY_SHA256.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Test inventory-driven scope and fail-closed path validation
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_dynamic_snapshot_inventory

      - name: Generate inventory-driven snapshot
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.review_commit }}
          INVENTORY_ARTIFACT_ID: ${{ inputs.inventory_artifact_id }}
          INVENTORY_SOURCE_COMMIT: ${{ inputs.inventory_source_commit }}
        run: |
          set -euo pipefail
          INVENTORY_HASH="$(sha256sum inventory_download/type1_governance_inventory/reference_inventory.json | awk '{print $1}')"
          python -m scripts.create_type1_review_snapshot \
            --expected-commit "$EXPECTED_COMMIT" \
            --inventory-artifact-id "$INVENTORY_ARTIFACT_ID" \
            --inventory-source-commit "$INVENTORY_SOURCE_COMMIT" \
            --inventory-json inventory_download/type1_governance_inventory/reference_inventory.json \
            --inventory-sha256 "$INVENTORY_HASH"
            --ledger-json inventory_download/type1_occurrence_ledger/occurrence_level_manual_ledger.json

      - name: Upload snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type1-exact-review-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/type1_review_snapshot/
          if-no-files-found: warn
          retention-days: 90
