name: Type-I Exact Review Snapshot and SHA-256

on:
  workflow_dispatch:
    inputs:
      review_commit:
        description: Exact 40-character review commit SHA
        required: true
        type: string
      inventory_artifact_id:
        description: Artifact ID from the fresh governance inventory run
        required: true
        type: string
      inventory_source_commit:
        description: Exact commit SHA used by the inventory workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Verify selected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"

      - name: Checkout exact review commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact commit identity
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.review_commit }}
          INVENTORY_COMMIT: ${{ inputs.inventory_source_commit }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          ACTUAL="$(git rev-parse HEAD)"

          test "$ACTUAL" = "$EXPECTED_COMMIT"
          test "$ACTUAL" = "$EVENT_COMMIT"
          test "$INVENTORY_COMMIT" = "$EXPECTED_COMMIT"

          echo "Verified exact review commit: $ACTUAL"
          echo "Verified inventory source commit: $INVENTORY_COMMIT"

      - name: Verify governance inventory artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.inventory_artifact_id }}
          EXPECTED_COMMIT: ${{ inputs.review_commit }}
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" \
            > inventory_artifact_metadata.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(
              Path("inventory_artifact_metadata.json").read_text()
          )

          expected_commit = os.environ["EXPECTED_COMMIT"]
          expected_branch = "review/type1-v4-remediation"

          if data.get("expired") is not False:
              raise SystemExit("BLOCKED: inventory artifact is expired.")

          if not data.get("name", "").startswith(
              "type1-v3-v4-governance-inventory-"
          ):
              raise SystemExit(
                  "BLOCKED: unexpected inventory artifact name."
              )

          run = data.get("workflow_run") or {}

          if run.get("head_sha") != expected_commit:
              raise SystemExit(
                  "BLOCKED: inventory artifact commit does not match."
              )

          if run.get("head_branch") != expected_branch:
              raise SystemExit(
                  "BLOCKED: inventory artifact branch does not match."
              )

          print("Verified inventory artifact provenance.")
          print("Artifact:", data.get("id"))
          print("Source commit:", run.get("head_sha"))
          print("Source branch:", run.get("head_branch"))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Generate SHA-256 manifest
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.review_commit }}
          INVENTORY_ARTIFACT_ID: ${{ inputs.inventory_artifact_id }}
          INVENTORY_SOURCE_COMMIT: ${{ inputs.inventory_source_commit }}
        run: |
          set -euo pipefail
          python scripts/create_type1_review_snapshot.py \
            --expected-commit "$EXPECTED_COMMIT" \
            --inventory-artifact-id "$INVENTORY_ARTIFACT_ID" \
            --inventory-source-commit "$INVENTORY_SOURCE_COMMIT"

      - name: Upload snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type1-exact-review-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/type1_review_snapshot/
          if-no-files-found: error
          retention-days: 90
