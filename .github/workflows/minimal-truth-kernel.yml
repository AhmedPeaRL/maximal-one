name: Minimal Truth Kernel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/**"
      - "scripts/**"
      - "real-data/**"
      - "requirements-lock.txt"

jobs:
  kernel:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Rate limit guard
        run: |
          echo "Checking execution frequency..."
          sleep 5

      - name: Install deps (STRICT)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt

      - name: Generate extended dataset (MANDATORY)
        run: |
          python analysis/expand_dataset.py

          if [ ! -f real-data/sunspots_global_extended.csv ]; then
            echo "❌ extended dataset not generated"
            exit 1
          fi

          echo "✅ extended dataset exists"

      - name: Validate dataset
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("real-data/sunspots_global_extended.csv")

          assert len(df) > 50, "Dataset too small"
          assert any(c in df.columns for c in ["value","Sunspots"]), "Invalid dataset"

          print("Dataset OK")
          PY

      - name: Run canonical experiment
        run: |
          python scripts/generate_report.py --seed 42 --canonical

      - name: Extract alpha signal
        run: |
          python - <<'PY'
          import json, sys

          r = json.load(open("artifacts/canonical_report.json"))

          alpha = r["spectral_profile"]["estimated_alpha"]
          sigma = r["spectral_profile"]["bootstrap_std"]
          noise = r["spectral_profile"]["noise_alpha"]

          print("alpha:", alpha)
          print("sigma:", sigma)
          print("noise:", noise)

          if alpha / (sigma + 1e-12) < 2.5:
              sys.exit("FAIL: weak signal")

          if abs(alpha - noise) < 0.25:
              sys.exit("FAIL: indistinguishable from noise")

          print("PASS: non-trivial structure detected")
          PY

      - name: Hash result
        run: sha256sum artifacts/canonical_report.json
