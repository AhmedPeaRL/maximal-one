name: Emergent Periodicity Analysis

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install numpy scipy matplotlib

      - name: Run spectral analysis
        run: |
          python analysis/ci_spectral_check.py

      - name: Commit report if significant
        run: |
          if [ -f analysis/significant_report.json ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add analysis/significant_report.json
            git commit -m "Automated significant periodicity detection"
            git push
          fi
