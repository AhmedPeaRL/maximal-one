name: Emergent Periodicity Analysis

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

permissions: 
      contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run spectral analysis
        run: |
          python analysis/ci_spectral_check.py

      - name: Commit report if significant
        run: |
          if [ -f analysis/significant_report.json ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add analysis/significant_report.json
            git commit -m "Automated significant periodicity detection"
            git push
          fi
