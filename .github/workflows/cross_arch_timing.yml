name: Cross Architecture Timing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install numpy scipy

      - name: Run timing experiment
        run: |
          python experiments/timing_experiment.py

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.os }}
          path: timing_results.json
