name: Type-I V4 Worker Assignment Matrix Audit

on:
  workflow_dispatch:
  push:
    branches:
      - review/type1-v4-remediation
    paths:
      - "tests/test_type1_worker_assignment_matrix_invariance.py"
      - "analysis/calibrate_null_type1_scenario.py"
      - "analysis/type1_execution_artifacts.py"
      - "analysis/merge_type1_execution_shards.py"
      - "requirements-lock.txt"
      - ".github/workflows/type1-v4-assignment-matrix.yml"

permissions:
  contents: read

jobs:
  assignment-matrix-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require remediation branch and verify identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          echo "Verified commit: $actual"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Compile new test
        run: |
          set -euo pipefail
          python -m py_compile \
            tests/test_type1_worker_assignment_matrix_invariance.py

      - name: Run worker assignment matrix comparison
        id: comparison
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_type1_worker_assignment_matrix_invariance

      - name: Record run identity and test outcome
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.comparison.outcome }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/type1_worker_assignment_matrices
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()

          record = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit_sha": commit,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "test_step_outcome": os.environ.get(
                  "TEST_OUTCOME", "UNKNOWN"
              ),
              "formal_calibration_pass": False,
              "claim_support": False,
              "promotion_authority": False,
              "confirmatory_execution_authorized": False,
              "classification": "ENGINEERING_ONLY",
          }

          Path(
              "artifacts/type1_worker_assignment_matrices/"
              "workflow_identity.json"
          ).write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(record, indent=2))
          PY

      - name: Upload success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type1-v4-assignment-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/type1_worker_assignment_matrices/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail workflow if comparison failed
        if: always() && steps.comparison.outcome != 'success'
        run: |
          echo "::error::Worker assignment matrix comparison failed."
          exit 1
