name: Null Calibration Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  null-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Deterministic environment
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=90210" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run null calibration audit
        shell: bash
        run: |
          set -euo pipefail

          python analysis/null_calibration_audit.py

          test -s \
            artifacts/null_calibration_audit.json

      - name: Verify diagnostic-only calibration contract
        shell: bash
        run: |
          set -euo pipefail

          test -s artifacts/null_calibration_audit.json

          python - <<'PY'
          import json

          path = "artifacts/null_calibration_audit.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("scientific_role") != "diagnostic_only":
              raise SystemExit(
                  "❌ Null calibration audit must be diagnostic_only."
              )

          if data.get("claim_support") is not False:
              raise SystemExit(
                  "❌ Null calibration audit must never support claim promotion."
              )

          if data.get("seed") != 90210:
              raise SystemExit(
                  "❌ Unexpected calibration audit seed."
              )

          if data.get("outer_replicates_requested") != 50:
              raise SystemExit(
                  "❌ Calibration requires exactly 50 outer replicates."
              )

          if data.get("inner_surrogates_requested") != 200:
              raise SystemExit(
                  "❌ Calibration requires exactly 200 requested inner surrogates."
              )

          if data.get("minimum_valid_surrogates") != 200:
              raise SystemExit(
                  "❌ Calibration requires exactly 200 minimum valid surrogates."
              )

          expected_cases = {
              "ar1_phi_0_7",
              "ar2_phi_0_5_0_2",
          }

          results = data.get("results", [])

          actual_cases = {
              item.get("case")
              for item in results
          }

          if actual_cases != expected_cases:
              raise SystemExit(
                  "❌ Unexpected calibration cases: "
                  f"{actual_cases}"
              )

          review = data.get(
              "model_capacity_review",
              {}
          )

          if review.get("scientific_role") != "diagnostic_only":
              raise SystemExit(
                  "❌ Model-capacity review must be diagnostic_only."
              )

          if review.get("claim_support") is not False:
              raise SystemExit(
                  "❌ Model-capacity review must not support the claim."
              )

          threshold = review.get(
              "boundary_fraction_threshold"
          )

          if threshold != 0.50:
              raise SystemExit(
                  "❌ Unexpected model-capacity review threshold."
              )

          review_triggered = review.get(
              "review_triggered"
          )

          if review_triggered not in (
              True,
              False,
          ):
              raise SystemExit(
                  "❌ Model-capacity review must explicitly "
                  "declare review_triggered as true or false."
              )

          reasons = review.get(
              "review_reasons",
              []
          )

          if not isinstance(reasons, list):
              raise SystemExit(
                  "❌ review_reasons must be a list."
              )

          if review_triggered and not reasons:
              raise SystemExit(
                  "❌ Review is marked triggered but no "
                  "review reasons exist."
              )

          if not review_triggered and reasons:
              raise SystemExit(
                  "❌ Review is marked not triggered but "
                  "review reasons are present."
              )

          print(
              "Model-capacity review triggered:",
              review_triggered
          )

          print(
              "Boundary-saturation review reasons:",
              len(reasons)
          )

          if review_triggered:
              print(
                  "⚠️ Boundary-saturation review remains "
                  "required for the declared calibration cases."
              )
          else:
              print(
                  "✅ Boundary-saturation review is not "
                  "triggered for the declared calibration cases."
              )

          for item in results:
              if item.get(
                  "outer_replicates_requested"
              ) != 50:
                  raise SystemExit(
                      "❌ Calibration case must contain 50 outer replicates."
                  )

              if item.get(
                  "inner_surrogates_requested"
              ) != 200:
                  raise SystemExit(
                      "❌ Calibration case must contain 200 requested inner surrogates."
                  )

              if item.get(
                  "minimum_valid_surrogates"
              ) != 200:
                  raise SystemExit(
                      "❌ Calibration case must require 200 valid surrogates."
                  )

              if item.get(
                  "claim_support"
              ) is not False:
                  raise SystemExit(
                      "❌ Calibration case must not support claim promotion."
                  )

          print(
              "✅ Null calibration diagnostic contract verified."
          )

          print(
              "50 outer × 200 requested inner × "
              "200 minimum valid."
          )

          print(
              "Model-capacity review triggered:",
              review["review_triggered"]
          )

          print(
              "Review reasons:",
              len(reasons)
          )
          PY

      - name: Verify unresolved model-capacity gate
        shell: bash
        run: |
          set -euo pipefail

          python analysis/verify_null_calibration_status.py

      - name: Verify diagnostic-only artifact
        run: |
          test -f artifacts/null_calibration_audit.json

          python - <<'PY'
          import json

          path = "artifacts/null_calibration_audit.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("scientific_role") != "diagnostic_only":
              raise SystemExit(
                  "❌ Null calibration audit is not marked diagnostic_only"
              )

          if data.get("claim_support") is not False:
              raise SystemExit(
                  "❌ Null calibration audit must never support claim promotion"
              )

          for result in data.get("results", []):
              if result.get("claim_support") is not False:
                  raise SystemExit(
                      "❌ A null-calibration case is incorrectly claim-supporting"
                  )

          print(
              "✅ Null calibration artifact is explicitly diagnostic-only"
          )
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v6
        with:
          name: null-calibration-audit
          path: artifacts/null_calibration_audit.json
          if-no-files-found: error
