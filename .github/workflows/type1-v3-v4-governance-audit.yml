name: Type-I Target-Commit Governance Inventory

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Exact 40-character commit to inventory for the independent review
        required: true
        type: string
      main_commit:
        description: Exact 40-character main commit to inventory separately
        required: true
        type: string

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout workflow-definition revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate requested commits and establish immutable audit refs
        shell: bash
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$MAIN_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"

          git fetch --no-tags origin \
            +refs/heads/review/type1-v4-remediation:refs/remotes/origin/review/type1-v4-remediation \
            +refs/heads/main:refs/remotes/origin/main

          git cat-file -e "${TARGET_COMMIT}^{commit}"
          git cat-file -e "${MAIN_COMMIT}^{commit}"
          git merge-base --is-ancestor "$TARGET_COMMIT" refs/remotes/origin/review/type1-v4-remediation
          git merge-base --is-ancestor "$MAIN_COMMIT" refs/remotes/origin/main

          git update-ref refs/audit/target "$TARGET_COMMIT"
          git update-ref refs/audit/main "$MAIN_COMMIT"

          echo "target_commit=$TARGET_COMMIT"
          echo "main_commit=$MAIN_COMMIT"
          echo "workflow_definition_commit=$WORKFLOW_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Compile audit and ledger tools
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/audit_type1_governance_refs.py \
            scripts/generate_type1_occurrence_ledger.py \
            scripts/type1_occurrence_classifier.py

      - name: Generate inventories for the requested target and main commits
        shell: bash
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
        run: |
          set -euo pipefail
          python scripts/audit_type1_governance_refs.py refs/audit/target refs/audit/main
          test -s artifacts/type1_governance_inventory/reference_inventory.json

          python -m scripts.generate_type1_occurrence_ledger \
            --inventory artifacts/type1_governance_inventory/reference_inventory.json \
            --expected-commit "$TARGET_COMMIT" \
            --output-ledger artifacts/type1_occurrence_ledger/occurrence_level_manual_ledger.json \
            --output-reconciliation artifacts/type1_occurrence_ledger/reconciliation.json

          python -m scripts.generate_type1_occurrence_ledger \
            --inventory artifacts/type1_governance_inventory/reference_inventory.json \
            --expected-commit "$MAIN_COMMIT" \
            --output-ledger artifacts/type1_occurrence_ledger/main_occurrence_level_manual_ledger.json \
            --output-reconciliation artifacts/type1_occurrence_ledger/main_reconciliation.json

      - name: Verify inventory identities, ledger coverage, and unresolved defaults
        shell: bash
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          inv = json.loads(Path("artifacts/type1_governance_inventory/reference_inventory.json").read_text())
          refs = inv.get("refs", [])
          wanted = {os.environ["TARGET_COMMIT"].lower(), os.environ["MAIN_COMMIT"].lower()}
          found = [r for r in refs if r.get("commit_sha", "").lower() in wanted]
          if len(found) != 2 or {r["commit_sha"].lower() for r in found} != wanted:
              raise SystemExit("BLOCKED: inventory does not contain exactly the requested target and main commits")
          for filename, commit in [
              ("occurrence_level_manual_ledger.json", os.environ["TARGET_COMMIT"]),
              ("main_occurrence_level_manual_ledger.json", os.environ["MAIN_COMMIT"]),
          ]:
              p = Path("artifacts/type1_occurrence_ledger") / filename
              d = json.loads(p.read_text())
              if d.get("inventory_commit", "").lower() != commit.lower():
                  raise SystemExit(f"BLOCKED: {filename} commit mismatch")
              if d.get("occurrence_count") != len(d.get("records", [])):
                  raise SystemExit(f"BLOCKED: {filename} count mismatch")
              for row in d["records"]:
                  if row.get("manual_classification") != "UNKNOWN" or row.get("status") != "OPEN":
                      raise SystemExit(f"BLOCKED: generated ledger must preserve unresolved state: {filename}")
          print("TARGET_AND_MAIN_INVENTORY_IDENTITIES_VERIFIED")
          PY

      - name: Write inventory provenance and SHA-256 register
        shell: bash
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
          MAIN_COMMIT: ${{ inputs.main_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/type1_governance_inventory artifacts/type1_occurrence_ledger
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          import hashlib
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          p=Path("artifacts/type1_governance_inventory/reference_inventory.json")
          inv=json.loads(p.read_text())
          provenance={
            "schema":"HCM_TYPE1_TARGETED_INVENTORY_PROVENANCE_V1",
            "repository":os.environ["GITHUB_REPOSITORY"],
            "target_commit":os.environ["TARGET_COMMIT"].lower(),
            "inventory_source_commit":os.environ["TARGET_COMMIT"].lower(),
            "main_commit":os.environ["MAIN_COMMIT"].lower(),
            "workflow_definition_commit":os.environ["WORKFLOW_COMMIT"].lower(),
            "workflow_ref":os.environ["GITHUB_REF"],
            "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "workflow_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
            "inventory_sha256":sha(p),
            "inventory_refs":[{"ref_requested":r.get("ref_requested"),"commit_sha":r.get("commit_sha")} for r in inv["refs"]],
            "scanner_sha256":sha("scripts/audit_type1_governance_refs.py"),
            "ledger_generator_sha256":sha("scripts/generate_type1_occurrence_ledger.py")
          }
          Path("artifacts/type1_governance_inventory/provenance.json").write_text(json.dumps(provenance,indent=2,sort_keys=True)+"\n")
          root = Path("artifacts")
          files = [
              root / "type1_governance_inventory" / "provenance.json",
              root / "type1_governance_inventory" / "reference_inventory.json",
              root / "type1_occurrence_ledger" / "occurrence_level_manual_ledger.json",
              root / "type1_occurrence_ledger" / "reconciliation.json",
              root / "type1_occurrence_ledger" / "main_occurrence_level_manual_ledger.json",
              root / "type1_occurrence_ledger" / "main_reconciliation.json",
          ]
          missing = [str(p) for p in files if not p.is_file()]
          if missing:
              raise SystemExit(f"BLOCKED: checksum input missing: {missing}")
          lines = [
              f"{sha(p)}  {p.relative_to(root).as_posix()}\\n"
              for p in sorted(files)
          ]
          (root / "SHA256SUMS.txt").write_text("".join(lines))
          print(json.dumps(provenance,indent=2))
          PY

      - name: Upload target-commit inventory and both ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type1-v3-v4-governance-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/type1_governance_inventory/
            artifacts/type1_occurrence_ledger/
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
