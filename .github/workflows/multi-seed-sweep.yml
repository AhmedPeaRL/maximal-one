name: Multi Seed Sweep

on:
  push:
    paths:
      - "experiments/**"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # weekly

jobs:
  sweep:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11.8-slim

    steps:
      - uses: actions/checkout@v4

      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip==24.0
          pip install numpy==1.26.4 scipy==1.12.0 pandas==2.2.0 matplotlib==3.8.2

      - name: Run multi-seed sweep
        run: |
          cd experiments
          python multi_seed_sweep.py

      - name: Run power analysis
        run: |
          cd experiments
          python power_analysis.py > ../data/power_result.txt

      - name: Commit dataset if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/*.json data/power_result.txt || true
          git commit -m "Automated multi-seed sweep update" || true
          git push
