name: Multi Seed Sweep

on:
  push:
    paths:
      - "experiments/**"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy==1.12.0 pandas==2.2.0 matplotlib==3.8.2 pyarrow

      - name: Run multi-seed sweep
        run: |
          cd experiments
          python multi_seed_sweep.py

      - name: Run power analysis
        run: |
          cd experiments
          mkdir -p ../data
          python power_analysis.py > ../data/power_result.txt

      - name: Run FBM comparison
        run: |
          cd experiments
          mkdir -p ../data
          python fbm_comparison.py > ../data/fbm_comparison.txt

      - name: Run Bayesian model comparison
        run: |
          cd experiments
          mkdir -p ../data
          python model_comparison.py > ../data/model_comparison.txt

      - name: Run Hurst analysis
        run: |
          cd experiments
          mkdir -p ../data
          python hurst_dfa.py > ../data/hurst.txt

      - name: Run Null Ensemble Test
        run: |
          cd experiments
          mkdir -p ../data
          python null_ensemble.py > ../data/null_test.txt

      - name: Update Power Badge
        run: |
          cd experiments
          python update_badge.py

      - name: Commit dataset if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add data/*.csv data/*.json data/*.txt || true
          git commit -m "Automated multi-seed sweep update" || true
          git push
