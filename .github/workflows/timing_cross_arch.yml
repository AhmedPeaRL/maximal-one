name: Cross Architecture Timing Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  
jobs:
  timing-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run experiment
        run: |
          python experiments/timing_experiment.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.os }}
          path: timing_results.json
