name: Type-I Software Assurance V1 (Pinned Read-Only Scanners)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type1-software-assurance-v1
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact review branch commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require authorized review branch and exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f protocol/TYPE1_AD106_POPULATION_REGISTER_V2.json
          test -f review/TYPE1_HIGH_IMPACT_SOFTWARE_ASSURANCE_EVIDENCE_MATRIX_V1.csv

      - name: Download and verify pinned scanner release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools reports/downloads
          cd reports/downloads
          curl --fail --location --retry 3 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum -c -
          curl --fail --location --retry 3 --output zizmor.tar.gz \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo 'e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  zizmor.tar.gz' | sha256sum -c -
          curl --fail --location --retry 3 --output scorecard.tar.gz \
            https://github.com/ossf/scorecard/releases/download/v5.6.0/scorecard_5.6.0_linux_amd64.tar.gz
          echo '19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a  scorecard.tar.gz' | sha256sum -c -
          cd ../../tools
          tar -xzf ../reports/downloads/actionlint.tar.gz
          tar -xzf ../reports/downloads/zizmor.tar.gz
          tar -xzf ../reports/downloads/scorecard.tar.gz
          find . -maxdepth 3 -type f -printf '%p\n'
          test -x ./actionlint
          test -x ./zizmor
          test -x ./scorecard

      - name: Record scanner versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          ./tools/actionlint -version > reports/actionlint-version.txt 2>&1
          ./tools/zizmor --version > reports/zizmor-version.txt 2>&1
          ./tools/scorecard version > reports/scorecard-version.txt 2>&1 || ./tools/scorecard --version > reports/scorecard-version.txt 2>&1

      - name: Run actionlint against all workflow definitions
        shell: bash
        run: |
          set +e
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
            | xargs -0 ./tools/actionlint -no-color > reports/actionlint.txt 2>&1
          code=$?
          echo "$code" > reports/actionlint.exit_code
          exit 0

      - name: Run zizmor against repository workflows
        shell: bash
        run: |
          set +e
          ./tools/zizmor --offline --collect=workflows --format=json-v1 . > reports/zizmor.json 2> reports/zizmor.stderr.txt
          code=$?
          echo "$code" > reports/zizmor.exit_code
          exit 0

      - name: Run Scorecard on the checked-out review commit
        shell: bash
        run: |
          set +e
          ./tools/scorecard --local="$PWD" --format=json > reports/scorecard.json 2> reports/scorecard.stderr.txt
          code=$?
          echo "$code" > reports/scorecard.exit_code
          exit 0

      - name: Write immutable run and tool evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          pop = json.loads(Path("protocol/TYPE1_AD106_POPULATION_REGISTER_V2.json").read_text())
          files = [
            "reports/actionlint-version.txt", "reports/zizmor-version.txt", "reports/scorecard-version.txt",
            "reports/actionlint.txt", "reports/actionlint.exit_code", "reports/zizmor.json",
            "reports/zizmor.stderr.txt", "reports/zizmor.exit_code", "reports/scorecard.json",
            "reports/scorecard.stderr.txt", "reports/scorecard.exit_code",
            "reports/downloads/actionlint.tar.gz", "reports/downloads/zizmor.tar.gz", "reports/downloads/scorecard.tar.gz"
          ]
          hashes = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files if Path(p).is_file()}
          manifest = {
            "schema": "HCM_TYPE1_SOFTWARE_ASSURANCE_RUN_V1",
            "status": "SCANNERS_EXECUTED_RESULTS_REQUIRE_TRIAGE_AND_OCCURRENCE_LEVEL_REVIEW",
            "repository": os.environ["GITHUB_REPOSITORY"],
            "scan_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "target_commit": pop["target"]["commit"],
            "inventory_run_id": pop["inventory"]["workflow_run_id"],
            "inventory_artifact_id": pop["inventory"]["artifact_id"],
            "inventory_sha256": pop["inventory"]["reference_inventory_sha256"],
            "snapshot_run_id": pop["snapshot"]["workflow_run_id"],
            "snapshot_artifact_id": pop["snapshot"]["artifact_id"],
            "snapshot_manifest_sha256": pop["snapshot"]["manifest_sha256"],
            "workflow_run_id": os.environ["GITHUB_RUN_ID"],
            "workflow_definition_commit": os.environ["GITHUB_SHA"],
            "tool_versions": {
              "actionlint": Path("reports/actionlint-version.txt").read_text().strip(),
              "zizmor": Path("reports/zizmor-version.txt").read_text().strip(),
              "scorecard": Path("reports/scorecard-version.txt").read_text().strip()
            },
            "exit_codes": {
              "actionlint": int(Path("reports/actionlint.exit_code").read_text().strip()),
              "zizmor": int(Path("reports/zizmor.exit_code").read_text().strip()),
              "scorecard": int(Path("reports/scorecard.exit_code").read_text().strip())
            },
            "raw_output_sha256": hashes,
            "authority": "NONE",
            "protocol_freeze": "NOT_FROZEN",
            "formal_calibration_authorized": False,
            "confirmatory_execution_authorized": False,
            "claim_support": False,
            "promotion_authority": False,
            "interpretation_limit": "Scanner output is triage evidence only. It does not prove complete call-graph closure and cannot close an occurrence-specific finding without path-specific evidence and human review."
          }
          Path("reports/assurance-run-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY

      - name: Upload all scanner outputs and tool evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: type1-software-assurance-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
