name: Security Leak Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Smart Secret Scan
        run: |
          echo "🔍 Running smart secret scan..."

          # Ignore known safe paths
          EXCLUDES="--exclude-dir=.git --exclude-dir=node_modules"

          # Scan only real risky patterns (not generic words)
          if grep -r -E "(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})" . $EXCLUDES; then
            echo "❌ Real GitHub token detected!"
            exit 1
          fi

          if grep -r -E "(api_key\s*=\s*['\"][A-Za-z0-9]{16,})" . $EXCLUDES; then
            echo "❌ API key pattern detected!"
            exit 1
          fi

          if grep -r -E "(secret\s*=\s*['\"][^'\"]+['\"])" . $EXCLUDES; then
            echo "❌ Hardcoded secret detected!"
            exit 1
          fi

          echo "✅ Clean — no real secrets detected."

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-git
