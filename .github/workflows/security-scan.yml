name: Security Leak Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
       - uses: actions/checkout@v5

       - name: Scan for secrets
         run: |
           echo "Scanning for possible secrets..."

           if grep -r -E "(ghp_|github_pat_|token|api_key|secret)" .; then
             echo "⚠️ Potential secret detected!"
             exit 1
           fi

           echo "✅ No secrets detected."
