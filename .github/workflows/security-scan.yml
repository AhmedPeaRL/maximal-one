name: Security Leak Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Scan for real secrets (strict)
        run: |
          echo "🔍 Scanning for REAL secrets..."

          # Ignore irrelevant folders
          EXCLUDES="--exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github"

          # Strict patterns ONLY (real leaks)
          PATTERN="ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{80,}|AIza[0-9A-Za-z\\-_]{35}|sk-[A-Za-z0-9]{32,}"

          MATCHES=$(grep -r -E $PATTERN . $EXCLUDES || true)

          if [ ! -z "$MATCHES" ]; then
            echo "🚨 REAL SECRET DETECTED!"
            echo "$MATCHES"
            exit 1
          fi

          echo "✅ Clean — no real secrets detected."
