name: Theoretical Validity Gate

on:
  push:
    branches: [ main, attractor-evolution ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  
jobs:
  proof-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run Theoretical Proof Harness
        run: |
          python tests/run_proof_verification.py
