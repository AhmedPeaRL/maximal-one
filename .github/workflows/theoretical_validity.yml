name: Theoretical Validity Gate

on:
  push:
    branches: [ main, attractor-evolution ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  
jobs:
  proof-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run Theoretical Proof Harness
        run: |
          python tests/run_proof_verification.py
