name: Theoretical Validity Gate

on:
  push:
    branches: [ main, attractor-evolution ]
  pull_request:
    branches: [ main ]

jobs:
  proof-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Run Theoretical Proof Harness
        run: |
          python tests/run_proof_verification.py

      - name: SOS Stability Certificate
        run: python stability/sos_lyapunov_certificate.py
