name: Build and Push Container

on: [push, pull_request]

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Upgrade pip first
        run: python -m pip install --upgrade pip==24.0

      - name: Install pinned scientific stack
        run: |
          python -m pip install --upgrade pip==24.0
          pip install numpy==1.26.4 scipy==1.12.0 statsmodels==0.14.1 matplotlib==3.8.2 pandas sympy scs cvxpy

      - name: Compute lowercase image name
        id: vars
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=$OWNER_LC" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
      - name: Build image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMAGE_NAME:latest .
          
      - name: Push image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push $IMAGE_NAME:latest

  stability-check:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3
      - name: Run SDP robustness test
        run: python stability/sos_robustness_test.py
     
      - name: Spectral gap check
        run: python stability/spectral_gap_test.py
      
      - name: Eigenvalue drift
        run: python stability/eigen_drift_check.py
