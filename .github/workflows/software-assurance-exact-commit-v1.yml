name: Exact Commit Software Assurance

on:
  workflow_dispatch:
    inputs:
      scan_commit:
        description: "Exact 40-character commit SHA to scan"
        required: true
        type: string

      run_container_review:
        description: "Run the Review-only container build and Trivy scan."
        required: false
        default: false
        type: boolean

  workflow_call:
    inputs:
      scan_commit:
        description: "Exact 40-character commit SHA to scan"
        required: true
        type: string
    
      run_container_review:
        description: "Run the isolated review-branch container build, CLI smoke test, and Trivy image scan."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-vulnerability-inventory:
    name: OSV inventory for the exact target commit
    uses: ./.github/workflows/dependency-vulnerability-inventory.yml
    with:
      scan_commit: ${{ inputs.scan_commit }}
    permissions:
      contents: read

  container-cli-smoke-review:
    name: Container CLI build and image security (review only)
    if: ${{ inputs.run_container_review }}
    needs:
      - dependency-vulnerability-inventory
      - exact-commit-scan
    uses: ./.github/workflows/container-cli-smoke-review.yml
    with:
      review_only: true
    permissions:
      contents: read

  dependency-lock-verification:
    name: Verify exact Python dependency lock
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.scan_commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.scan_commit }}
        run: |
          set -euo pipefail

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"

      - name: Install and verify hash-locked dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m venv .verify-venv
          VERIFY_PY="$PWD/.verify-venv/bin/python"

          "$VERIFY_PY" -m pip --version

          "$VERIFY_PY" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements-lock.txt

          "$VERIFY_PY" -m pip check

          "$VERIFY_PY" - <<'PY'
          import certifi
          import cvxpy
          import httplib2
          import idna
          import jsonschema
          import matplotlib
          import mpmath
          import numpy
          import pandas
          import pyarrow
          import psutil
          import requests
          import scs
          import scipy
          import sklearn
          import statsmodels
          import sympy
          import urllib3
          from PIL import Image

          print("All required imports passed.")
          PY

          "$VERIFY_PY" -m compileall -q analysis scripts tests

          "$VERIFY_PY" -m unittest discover -s tests -v
      
  exact-commit-scan:
    name: Scan exact commit without promotion authority
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout workflow definition
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and materialize exact target
        id: target
        shell: bash
        env:
          SCAN_COMMIT: ${{ inputs.scan_commit }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail

          EXPECTED_REF="refs/heads/review/type1-v4-remediation"

          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "BLOCKED: exact software assurance is restricted to the review branch."
            exit 1
          fi

          case "$WORKFLOW_REF" in
            */.github/workflows/software-assurance-exact-commit-v1.yml@refs/heads/review/type1-v4-remediation)
              if [[ "$SCAN_COMMIT" != "$GITHUB_SHA" ]]; then
                echo "BLOCKED: manual scan_commit must equal the selected review branch HEAD."
                exit 1
              fi
              ;;

            */.github/workflows/replication.yml@refs/heads/review/type1-v4-remediation)
              git fetch --no-tags origin "$EXPECTED_REF"
              REMOTE_REVIEW_HEAD="$(git rev-parse FETCH_HEAD)"
              if [[ "$SCAN_COMMIT" != "$REMOTE_REVIEW_HEAD" ]]; then
                echo "BLOCKED: reusable scan_commit must equal the current remote review branch HEAD."
                exit 1
              fi
              ;;

            *)
              echo "BLOCKED: unrecognized caller workflow: $WORKFLOW_REF"
              exit 1
              ;;
          esac

          if [[ ! "$SCAN_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA"
            exit 1
          fi
          git fetch --no-tags origin "$SCAN_COMMIT"
          git cat-file -e "${SCAN_COMMIT}^{commit}"
          TARGET_DIR="$RUNNER_TEMP/exact-target"
          git worktree add --detach "$TARGET_DIR" "$SCAN_COMMIT"
          ACTUAL="$(git -C "$TARGET_DIR" rev-parse HEAD)"
          test "$ACTUAL" = "$SCAN_COMMIT"
          test -d "$TARGET_DIR/.github/workflows"
          echo "target_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"
          echo "scan_commit=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Install pinned scanner versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools downloads reports

          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o downloads/actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  downloads/actionlint.tar.gz" \
            | sha256sum -c -
          mkdir -p downloads/actionlint
          tar -xzf downloads/actionlint.tar.gz -C downloads/actionlint
          find downloads/actionlint -type f -name actionlint -exec cp {} tools/actionlint \;

          curl -fsSL \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            -o downloads/zizmor.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  downloads/zizmor.tar.gz" \
            | sha256sum -c -
          mkdir -p downloads/zizmor
          tar -xzf downloads/zizmor.tar.gz -C downloads/zizmor
          find downloads/zizmor -type f -name zizmor -exec cp {} tools/zizmor \;

          curl -fsSL \
            https://github.com/ossf/scorecard/releases/download/v5.6.0/scorecard_5.6.0_linux_amd64.tar.gz \
            -o downloads/scorecard.tar.gz
          echo "19bde07129450cb65a95c6e3b9f34e034341579e6f0e241546ec3ae6efb2dd9a  downloads/scorecard.tar.gz" \
            | sha256sum -c -
          mkdir -p downloads/scorecard
          tar -xzf downloads/scorecard.tar.gz -C downloads/scorecard
          find downloads/scorecard -type f -name scorecard -exec cp {} tools/scorecard \;

          chmod +x tools/actionlint tools/zizmor tools/scorecard
          tools/actionlint -version > reports/actionlint-version.txt
          tools/zizmor --version > reports/zizmor-version.txt
          tools/scorecard version > reports/scorecard-version.txt
      
      - name: Run actionlint on exact target workflows
        shell: bash
        env:
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          set +e

          (
            cd "$TARGET_DIR"

            find .github/workflows -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print0 \
              | xargs -0 -r "$GITHUB_WORKSPACE/tools/actionlint" \
                  -no-color \
                  -config-file "$TARGET_DIR/.github/actionlint.yaml"
          ) > reports/actionlint.txt 2>&1

          CODE=$?
          echo "$CODE" > reports/actionlint.exit_code
          echo "actionlint exit code: $CODE"

      - name: Run zizmor on exact target workflows
        shell: bash
        env:
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          set +e
          cd "$TARGET_DIR"
          "$GITHUB_WORKSPACE/tools/zizmor" \
            --offline \
            --collect=workflows \
            --format=json-v1 \
            . > "$GITHUB_WORKSPACE/reports/zizmor.json" \
              2> "$GITHUB_WORKSPACE/reports/zizmor.stderr.txt"
          CODE=$?
          echo "$CODE" > "$GITHUB_WORKSPACE/reports/zizmor.exit_code"
          echo "zizmor exit code: $CODE"

      - name: Run OpenSSF Scorecard on exact target worktree
        shell: bash
        env:
          TARGET_DIR: ${{ steps.target.outputs.target_dir }}
        run: |
          set +e
          "$GITHUB_WORKSPACE/tools/scorecard" \
            --local="$TARGET_DIR" \
            --show-details \
            --format=json \
            > reports/scorecard.json \
            2> reports/scorecard.stderr.txt
          CODE=$?
          echo "$CODE" > reports/scorecard.exit_code
          echo "scorecard exit code: $CODE"

      - name: Create exact-commit assurance manifest
        if: always()
        shell: bash
        env:
          SCAN_COMMIT: ${{ steps.target.outputs.scan_commit }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          report_dir = Path("reports")

          def sha(name):
              p = report_dir / name
              return hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None

          def code(name):
              p = report_dir / f"{name}.exit_code"
              return int(p.read_text().strip()) if p.exists() else None

          codes = {name: code(name) for name in ("actionlint", "zizmor", "scorecard")}
          all_zero = all(v == 0 for v in codes.values())
          manifest = {
              "schema": "HCM_EXACT_COMMIT_SOFTWARE_ASSURANCE_V1",
              "repository": "AhmedPeaRL/maximal-one",
              "scan_commit": os.environ.get("SCAN_COMMIT"),
              "workflow_definition_commit": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_ref": os.environ.get("GITHUB_REF"),
              "tool_versions": {
                  name: (report_dir / f"{name}-version.txt").read_text().strip()
                  if (report_dir / f"{name}-version.txt").exists() else None
                  for name in ("actionlint", "zizmor", "scorecard")
              },
              "exit_codes": codes,
              "report_sha256": {
                  "actionlint": sha("actionlint.txt"),
                  "zizmor": sha("zizmor.json"),
                  "scorecard": sha("scorecard.json")
              },
              "status": (
                  "ALL_SCANNER_EXIT_CODES_ZERO_REQUIRES_MANUAL_FINDING_REVIEW"
                  if all_zero else
                  "FINDINGS_OR_SCANNER_ERRORS_REQUIRE_TRIAGE"
              ),
              "protocol_freeze": "NOT_FROZEN",
              "formal_calibration_authorized": False,
              "confirmatory_execution_authorized": False,
              "claim_support": False,
              "promotion_authority": False,
              "authority": "NONE"
          }
          (report_dir / "assurance-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload scanner evidence even when findings exist
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: exact-commit-software-assurance-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Fail job if a scanner found issues or could not run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/assurance-manifest.json")
          if not p.exists():
              raise SystemExit("BLOCKED: assurance manifest was not created")
          d = json.loads(p.read_text())
          codes = d.get("exit_codes", {})
          if set(codes) != {"actionlint", "zizmor", "scorecard"}:
              raise SystemExit("BLOCKED: scanner exit-code set is incomplete")
          if any(value != 0 for value in codes.values()):
              raise SystemExit("SCANNER_FINDINGS_OR_ERRORS_RECORDED; triage required")
          print("All scanner exit codes are zero; manual finding review is still required.")
          PY
