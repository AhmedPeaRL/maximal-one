name: Cross Run Memory Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions: {}

concurrency:
  group: cross-run-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only deterministic verification
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      current_hash: ${{ steps.compute_hash.outputs.current_hash }}

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18.20.8

      - name: Install locked project dependencies
        run: npm ci

      - name: Recompute deterministic artifact
        run: npm run validate

      - name: Compute report hash
        id: compute_hash
        shell: bash
        run: |
          set -euo pipefail
          hash="$(sha256sum core-scientific/publication-gate/report.json | awk '{print $1}')"
          printf 'current_hash=%s\n' "$hash" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$hash" > current_hash.txt
          printf 'Computed report hash: %s\n' "$hash"

  record:
    name: Append history using a step-scoped GitHub API token
    if: github.ref == 'refs/heads/review/type1-v4-remediation'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Update review-branch history through Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_HASH: ${{ needs.verify.outputs.current_hash }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          [[ "$CURRENT_HASH" =~ ^[0-9a-f]{64}$ ]]

          api_path="repos/${REPOSITORY}/contents/.coherence-memory/history.log"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          history_file="${temp_dir}/history.log"
          current_sha=""

          if gh api --method GET "$api_path" \
            -f "ref=$BRANCH" \
            > "${temp_dir}/existing.json" \
            2> "${temp_dir}/get.err"; then

            current_sha="$(jq -er '.sha' "${temp_dir}/existing.json")"

            jq -er '.content' "${temp_dir}/existing.json" \
              | tr -d '\n' \
              | base64 --decode > "$history_file"

          else
            if grep -Eq 'HTTP 404|Not Found' "${temp_dir}/get.err"; then
              : > "$history_file"
            else
              cat "${temp_dir}/get.err" >&2
              exit 1
            fi
          fi

          if grep -Fqx -- "$CURRENT_HASH" "$history_file"; then
            echo "Hash already exists in this review branch; no write required."
            exit 0
          fi

          printf '%s\n' "$CURRENT_HASH" >> "$history_file"
          encoded="$(base64 -w0 "$history_file")"

          if [[ -n "$current_sha" ]]; then
            gh api --method PUT "$api_path" \
              --raw-field message="Cross-run memory update" \
              --raw-field content="$encoded" \
              --raw-field branch="$BRANCH" \
              --raw-field sha="$current_sha"
          else
            gh api --method PUT "$api_path" \
              --raw-field message="Cross-run memory update" \
              --raw-field content="$encoded" \
              --raw-field branch="$BRANCH"
          fi
