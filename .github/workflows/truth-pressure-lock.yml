name: Truth Pressure Lock

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Install dependencies
        run: npm install

      - name: Regenerate report
        run: node core-scientific/publication-gate/generate-report.cjs

      - name: Verify integrity
        run: |
          echo "Checking report integrity..."

          GENERATED_HASH=$(jq -r '.reportHash' core-scientific/publication-gate/report.json)
          RECOMPUTED_HASH=$(cat core-scientific/publication-gate/report.json | jq -S 'del(.reportHash)' | sha256sum | awk '{print $1}')

          if [ "$GENERATED_HASH" != "$RECOMPUTED_HASH" ]; then
            echo "Report hash mismatch."
            exit 1
          fi

          echo "Checking generator integrity..."

          STORED_GENERATOR_HASH=$(jq -r '.generatorHash' core-scientific/publication-gate/report.json)
          CURRENT_GENERATOR_HASH=$(cat core-scientific/publication-gate/generate-report.cjs | tr -d '\r' | sha256sum | awk '{print $1}')

          if [ "$STORED_GENERATOR_HASH" != "$CURRENT_GENERATOR_HASH" ]; then
            echo "Generator drift detected."
            exit 1
          fi

          echo "All integrity checks passed."
