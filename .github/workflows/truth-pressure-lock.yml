name: Truth Pressure Lock

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 18.20.8
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Regenerate report
        run: node core-scientific/publication-gate/generate-report.cjs

      - name: Verify integrity
        run: |
          node -e "
          const fs = require('fs');
          const crypto = require('crypto');
          
          const report = JSON.parse(
          fs.readFileSync('./core-scientific/publication-gate/report.json','utf8')
          );
          
          const { reportHash, generatorHash, ...base } = report;
          
          const recomputed = crypto
          .createHash('sha256')
          .update(JSON.stringify(base))
          .digest('hex');
          
          if (reportHash !== recomputed) {
          console.error('Report hash mismatch.');
          process.exit(1);
          }
          
          const currentGeneratorHash = crypto
          .createHash('sha256')
          .update(
            fs.readFileSync('./core-scientific/publication-gate/generate-report.cjs','utf8')
             .replace(/\r/g,'')
             )
             .digest('hex');
             
             if (generatorHash !== currentGeneratorHash) {
             console.error('Generator drift detected.');
             process.exit(1);
             }

            console.log('All integrity checks passed.');
            "
