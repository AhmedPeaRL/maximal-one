name: Truth Pressure Lock

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Install dependencies
        run: npm install

      - name: Regenerate report
        run: node core-scientific/publication-gate/generate-report.cjs

      - name: Verify integrity
        run: |
          node -e " const fs = require('fs'); const crypto = require('crypto');
          const report = JSON.parse( fs.readFileSync('./core-scientific/publication-gate/report.json','utf8') );
          const originalGeneratorHash = report.generatorHash; const originalReportHash = report.reportHash;
          // أعد بناء التقرير كما يفعل المولد تمامًا 
          const cloned = JSON.parse(JSON.stringify(report)); delete cloned.reportHash; delete cloned.generatorHash;
          const recomputedReportHash = crypto .createHash('sha256') .update(JSON.stringify(cloned)) .digest('hex');
         
          if (originalReportHash !== recomputedReportHash) { console.error('Report hash mismatch.'); process.exit(1); }
          
          const currentGeneratorHash = crypto .createHash('sha256') .update( fs.readFileSync('./core-scientific/publication-gate/generate-report.cjs','utf8') .replace(/\r/g,'') ) .digest('hex');
          
          if (originalGeneratorHash !== currentGeneratorHash) { console.error('Generator drift detected.'); process.exit(1); }
          
          console.log('All integrity checks passed.'); "
