      if: always()
      env:
         GH_TOKEN: ${{ secrets.GH_TOKEN }}
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        set -euo pipefail

        echo "=== VERIFY WORKSPACE ==="
        pwd
        ls -la

        echo "=== ENSURE GIT CONTEXT ==="

        if ! git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
          echo "⚠️ Not inside git repo — reconstructing"

          rm -rf .git

          git init
          git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

          git fetch origin main

          git checkout -b main origin/main || git checkout -b main

          git reset --hard origin/main || true
        fi

        echo "=== CONFIGURE GIT ==="
        
        git config --global credential.helper store
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git config pull.rebase true
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name "bot"
        git config user.email "bot@github.com"

        echo "=== PREP DATA (FIXED) ==="

        mkdir -p data

        # تأكد إن فيه artifacts
        FILES=$(ls artifacts/*.json 2>/dev/null || true)

        if [ -z "$FILES" ]; then
          echo "⚠️ No artifacts found — generating fallback"

          echo '{
            "timestamp": '$(date +%s)',
            "status": "no_artifact",
            "coherence": 0
          }' > data/fallback_$(date +%s).json

        else
          for f in $FILES; do
            BASENAME=$(basename "$f")
            cp "$f" "data/$(date +%s)_$BASENAME"
          done
        fi

        git add .

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Atomic state update" || echo "No changes"

        echo "=== SAFE PUSH (TOKEN-INJECTED) ==="

        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

        git add data/external/

        if git diff --cached --quiet; then
          echo "No new witness → skipping push"
          exit 0
        fi

        git commit -m "External witness ingestion" || {
           echo "Nothing to commit"
           exit 0
        }
        
        python analysis/push_guard.py

        SUCCESS=false
          
        for i in 1 2 3 4 5
        do
          git pull --rebase origin main || true
            
          if git push origin HEAD:main; then
            echo "Push succeeded"
            SUCCESS=true
            break
          fi

          echo "Retry $i..."
          sleep 2
            
        done
          
        if [ "$SUCCESS" = false ]; then
          echo "Push skipped or failed gracefully (non-critical)"
          exit 0
        fi
        
