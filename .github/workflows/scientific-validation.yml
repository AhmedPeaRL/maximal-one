name: Deterministic Scientific Mesh

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:

  compute:
    name: Compute Deterministic Hash
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
        byzantine: [false]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Run validation
        run: |
          npm run validate
          npm run verify
          npm run stability

      - name: Byzantine simulation (optional corruption)
        if: matrix.byzantine == 'true'
        run: |
          echo "corruption" >> core-scientific/publication-gate/report.json

      - name: Compute SHA256
        id: compute_hash
        run: |
          node -e "const fs=require('fs'); const crypto=require('crypto'); const data=fs.readFileSync('core-scientific/publication-gate/report.json'); const hash=crypto.createHash('sha256').update(data).digest('hex'); console.log(hash); fs.writeFileSync('hash.txt',hash);"

      - name: Upload hash
        uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.node-version }}
          path: hash.txt

  vote:
    name: Multi-Runner Hash Voting
    needs: compute
    runs-on: ubuntu-24.04

    steps:
      - name: Download hashes
        uses: actions/download-artifact@v4
        with:
          path: hashes

      - name: Majority vote
        id: vote_step
        run: |
          HASHES=$(cat hashes/**/hash.txt)
          echo "$HASHES"
          UNIQUE=$(echo "$HASHES" | sort | uniq | wc -l)

          if [ "$UNIQUE" -ne 1 ]; then
            echo "Divergence detected"
            exit 1
          fi

          CONS=$(echo "$HASHES" | head -n 1)
          echo "consensus=$CONS" >> $GITHUB_OUTPUT
          echo $CONS > consensus.txt

      - name: Upload consensus
        uses: actions/upload-artifact@v4
        with:
          name: consensus
          path: consensus.txt

  notarize:
    name: Cross-Repo Notarization
    needs: vote
    runs-on: ubuntu-24.04

    steps:
      - name: Download consensus
        uses: actions/download-artifact@v4
        with:
          name: consensus

      - name: Create notarization record
        run: |
          CONS=$(cat consensus.txt)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"notarizedHash\":\"$CONS\",\"timestamp\":\"$TS\"}" > notarization.json

      - name: Upload notarization
        uses: actions/upload-artifact@v4
        with:
          name: notarization
          path: notarization.json

  attractor:
    name: Attractor Field Scoring
    needs: notarize
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install
        run: npm install

      - name: Compute attractor score
        run: npm run attractor

  evolve:
    name: Evolution Gate
    needs: attractor
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install
        run: npm install

      - name: Run evolution
        run: npm run evolve
