name: SOS Robustness Gate

concurrency:
  group: scientific-validation-main
  cancel-in-progress: false

on:
  push:
  pull_request:
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
  
permissions:
  contents: write
  

env:
  PYTHONHASHSEED: "0"
  NODE_ENV: "production"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:

  compute:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.20.8, 20.20.0, 24.11.1]

    steps:

      - name: Print trigger source
        run: echo "Triggered by ${{ github.event_name }}"
        
      - uses: actions/checkout@v4

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Missing package-lock.json — reproducibility broken."
            exit 1
          fi

      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit
             
      - name: Run deterministic Node suite
        run: |
         npm run validate
         npm run verify
         npm run stability
         npm run attractor

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: node-hash-${{ matrix.node-version }}
          path: node_report.hash

  build-report:
    runs-on: ubuntu-24.04
    needs: compute
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b

    steps:
      - uses: actions/checkout@v4
      - name: Upgrade pip first
        run: python -m pip install --upgrade pip==24.0

      - name: Install pinned scientific stack
        run: |
         python -m pip install --upgrade pip==24.0
         pip install \
           numpy==1.26.4 \
           scipy==1.12.0 \
           statsmodels==0.14.1 \
           matplotlib==3.8.2 \
           pandas==2.2.0 \
           sympy==1.12 \
           scs==3.2.4 \
           cvxpy==1.4.2 \
           scikit-learn==1.4.2 \
           pyarrow==15.0.2 \
           requests==2.31.0
           
      - name: Freeze environment
        run: pip freeze > pip-freeze.txt

      - name: Generate deterministic report
        run: |
          python scripts/generate_report.py --seed 42 --canonical
          python analysis/experiment_history.py

      - name: Inject environment fingerprint
        run: |
          python - <<'PY'
          import json, hashlib, platform

          path = "artifacts/canonical_report.json"

          with open(path) as f:
              report = json.load(f)

          freeze = open("pip-freeze.txt").read()

          report["_environment"] = {
              "python": platform.python_version(),
              "pip_freeze_sha256": hashlib.sha256(freeze.encode()).hexdigest()
          }

          with open(path,"w") as f:
              json.dump(report,f,sort_keys=True,separators=(',',':'))
          PY

      - name: Final cryptographic hash
        run: sha256sum artifacts/canonical_report.json | cut -d " " -f1 > report.hash

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: canonical-report
          path: artifacts/canonical_report.json

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: report-hash
          path: report.hash

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: pip-freeze
          path: pip-freeze.txt

  gate:
    runs-on: ubuntu-24.04
    needs: build-report
    outputs:
      passed: ${{ steps.final_gate.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: canonical-report
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: report-hash
          path: artifacts

      - name: Verify hash integrity
        run: |
          CALC=$(sha256sum artifacts/canonical_report.json | cut -d " " -f1)
          STORED=$(cat artifacts/report.hash)

          if [ "$CALC" != "$STORED" ]; then
            echo "Report integrity violation."
            exit 1
          fi

      - name: Dump canonical report
        run: |
         echo "===== REPORT CONTENT ====="
         cat artifacts/canonical_report.json
    
      - name: Schema sanity check
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('artifacts/canonical_report.json','utf8'));

          if (!r.spectral_profile || 
             typeof r.spectral_profile.estimated_alpha !== 'number' ||
             typeof r.spectral_profile.bootstrap_std !== 'number') {
            console.error("Schema violation.");
            process.exit(1);
          }
          NODE

      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 18.20.8

      - run: npm ci --ignore-scripts --no-audit
      
      - name: Adaptive Attractor Gate
        run: |
         RESULT=$(node core-scientific/attractor-field/adaptive-threshold.cjs)
         echo "$RESULT"

         PASS=$(echo "$RESULT" | node -e "
          const fs = require('fs');
          const input = fs.readFileSync(0,'utf8');
          const d = JSON.parse(input);
          console.log(d.passed ? 'true' : 'false');
         ")

         if [ "$PASS" != "true" ]; then
           echo "Attractor strictness failed"
           exit 1
         fi

  consensus:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b
    needs: gate

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-hash-18.20.8
          path: node18

      - uses: actions/download-artifact@v4
        with:
          name: node-hash-20.20.0
          path: node20

      - uses: actions/download-artifact@v4
        with:
          name: node-hash-24.11.1
          path: node24

      - name: Cross-version consensus
        run: |
          H1=$(cat node18/node_report.hash)
          H2=$(cat node20/node_report.hash)
          H3=$(cat node24/node_report.hash)

          echo "Node 18 hash: $H1"
          echo "Node 20 hash: $H2"
          echo "Node 24 hash: $H3"

          if [ "$H1" != "$H2" ] || [ "$H1" != "$H3" ]; then
            echo "Cross-version divergence detected."
            exit 1
          fi

          echo "Deterministic consensus verified."

  verify:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b
    needs: consensus

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark repository as safe
        run: |
         git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned scientific stack
        run: |
         python -m pip install --upgrade pip==24.0
         pip install \
           numpy==1.26.4 \
           scipy==1.12.0 \
           statsmodels==0.14.1 \
           matplotlib==3.8.2 \
           pandas==2.2.0 \
           sympy==1.12 \
           scs==3.2.4 \
           cvxpy==1.4.2 \
           scikit-learn==1.4.2 \
           pyarrow==15.0.2 \
           requests==2.31.0

      - name: Fetch global chaos datasets
        run: |
          python analysis/global_chaos_fetcher.py
          python analysis/extended_chaos_fetcher.py
          python analysis/dataset_preprocessor.py real-data/sunspots_global.csv

      - name: Generate chaotic dataset if missing
        run: python analysis/generate_real_dataset.py

      - name: Download real chaotic datasets
        run: |
          python analysis/chaos_data_crawler.py

      - name: Expand global datasets
        run: python analysis/global_dataset_expander.py

      - name: Fetch EEG dataset
        run: python analysis/eeg_fetcher.py

      - name: Extract invariants
        run: python analysis/invariant_extractor.py

      - name: Invariant Scanner
        run: python analysis/invariant_scanner.py

      - name: Update invariant history
        run: python analysis/invariant_history.py

      - name: Detect invariant patterns
        run: python analysis/invariant_detector.py

      - name: Universal invariant scan
        run: python analysis/universal_invariant_scanner.py

      - name: Invariant field analysis
        run: python analysis/invariant_field_analyzer.py

      - name: Global dataset registry
        run: python analysis/global_dataset_registry.py

      - name: Dataset integrity manifest
        run: python analysis/dataset_guard.py

      - name: Check downloaded datasets
        run: |
          echo "==== REAL DATA ===="
          ls -R real-data || true
          
      - name: Freeze environment snapshot
        run: |
          mkdir -p artifacts
          pip freeze > artifacts/pip-freeze.txt
          
      - name: Run deterministic kernel
        run: |
          mkdir -p artifacts
          python repro-core/deterministic_kernel.py > artifacts/state.json
          python repro-core/environment_fingerprint.py > artifacts/environment.json

      - name: Generate run summary
        run: python analysis/run_summary.py

      - name: Dump state content
        run: |
          echo "==== STATE CONTENT ===="
          cat artifacts/state.json

      - name: Canonical hash
        run: |
          cat artifacts/state.json | python repro-core/canonical_hash.py

      - name: Hash boundary gate
        run: |
          python repro-core/hash_gate.py

      - name: Adversarial stability test
        run: |
          python repro-core/adversarial_test.py

      - name: Boundedness check
        run: |
          python repro-core/boundedness_check.py

      - name: precision robustness
        run: |
          python analysis/precision_stability.py
          
      - name: Run spectral verification
        run: |
          mkdir -p artifacts
          python -m analysis.numerical_spectral_verification
          
      - name: Null Spectral Monte Carlo
        run: |
          mkdir -p artifacts
          python -m analysis.null_spectral_montecarlo

      - name: Autonomous Chaos Harvester
        run: |
          python analysis/autonomous_chaos_harvester.py

      - name: Autonomous Dataset Hunter
        run: python analysis/autonomous_dataset_hunter.py

      - name: Prepare real datasets
        run: |
          python analysis/real_dataset_engine.py

      - name: Debug datasets before discovery
        run: |
          echo "==== DATASET LIST ===="
          ls -lh real-data || true

      - name: Dataset health check
        run: python analysis/dataset_health_check.py

      - name: Automatic Discovery Engine
        run: |
          python analysis/discovery_engine.py

      - name: Chaos discovery engine
        run: |
          python analysis/chaos_discovery_engine.py

      - name: Recurrence Quantification
        run: |
          python analysis/recurrence_quantification.py

      - name: Build Chaos Atlas
        run: |
          python analysis/chaos_atlas_index.py

      - name: Takens phase-space reconstruction
        run: |
          mkdir -p artifacts

          if [ -f real-data/sunspots_global_prepared.csv ]; then
            echo "Running Takens reconstruction..."
            python analysis/takens_reconstruction.py real-data/sunspots_global_prepared.csv
          else
            echo "Dataset missing — Takens skipped"
          fi

      - name: Phase Space Invariant Extraction
        run: |
          mkdir -p artifacts

          if [ -f real-data/sunspots_global_prepared.csv ]; then
            echo "Extracting phase-space invariants..."
            python analysis/invariant_phase_space.py real-data/sunspots_global_prepared.csv
          else
            echo "Dataset missing — invariant extraction skipped"
          fi

      - name: Lyapunov exponent estimation
        run: |
          mkdir -p artifacts

          if [ -f real-data/sunspots_global_prepared.csv ]; then
            echo "Estimating Lyapunov exponent..."
            python analysis/lyapunov_estimator.py real-data/sunspots_global_prepared.csv
          else
            echo "Dataset missing — Lyapunov skipped"
          fi

      - name: Real Chaotic Benchmark
        run: |
          mkdir -p artifacts

          if [ -f real-data/sunspots_global_prepared.csv ]; then
            echo "Running sunspots benchmark..."
            python -m analysis.real_chaotic_benchmark real-data/sunspots_global_prepared.csv > artifacts/chaotic_benchmark.json
          else
            echo "Sunspots dataset missing — skipping benchmark"
            echo '{"hcm_superior": false, "skipped": true}' > artifacts/chaotic_benchmark.json
            fi
     
      - name: Predictive deviation test
        run: |
          mkdir -p artifacts

          if [ -f real-data/sunspots_global_prepared.csv ]; then
            echo "Running predictive deviation test..."
            python analysis/real_world_predictive_test.py real-data/sunspots_global_prepared.csv
          else
            echo "Sunspots dataset missing — skipping predictive test"
            echo '{"predictive_test":"skipped"}' > artifacts/predictive_test.json
          fi
          
      - name: Predictive Gain Gate
        run: |
          python analysis/predictive_gain_gate.py

      - name: Real Lorenz Benchmark
        run: |
          mkdir -p artifacts
          python analysis/real_lorenz_benchmark.py > artifacts/lorenz.json
          echo "=== Lorenz96 result ==="
          cat artifacts/lorenz.json

      - name: Lorenz-96 Benchmark
        run: |
          mkdir -p artifacts
          python -m analysis.lorenz96_benchmark > artifacts/lorenz96.json
          cat artifacts/lorenz96.json

      - name: Generate chaotic dataset
        run: python analysis/generate_lorenz_dataset.py

      - name: Run multi-seed experiment
        run: |
          mkdir -p artifacts
          python experiments/multi_seed_sweep.py

      - name: Global Scientific Verdict
        run: python analysis/global_scientific_verdict.py

      - name: Long run replication
        run: |
          mkdir -p artifacts
          python experiments/long_run_sweep.py

      - name: Verify statistical significance
        run: |
         python analysis/lorenz_gate.py > artifacts/lorenz_gate.json
         cat artifacts/lorenz_gate.json

      - name: Practical significance gate
        run: python analysis/effect_size_gate.py

      - name: Meta Predictor Scoring
        run: python analysis/meta_predictor_score.py

      - name: External replication gate
        run: | 
          mkdir -p artifacts
          python analysis/external_replication_gate.py

      - name: Chaotic Superiority Gate
        run: |
          mkdir -p artifacts

          if [ ! -f artifacts/chaotic_benchmark.json ]; then
            echo "No benchmark result — skipping superiority gate"
            exit 0
          fi

          RESULT=$(cat artifacts/chaotic_benchmark.json)
          echo "$RESULT"

          PASS=$(echo "$RESULT" | python -c "
          import sys, json
          d=json.load(sys.stdin)
          print('true' if d.get('hcm_superior', False) else 'false')
          ")

          SKIPPED=$(echo "$RESULT" | python -c "
          import sys, json
          d=json.load(sys.stdin)
          print('true' if d.get('skipped', False) else 'false')
          ")

          if [ "$SKIPPED" = "true" ]; then
            echo "Dataset missing — superiority gate skipped"
            exit 0
            fi
            
          if [ "$PASS" != "true" ]; then
            echo "Chaotic predictive superiority not achieved."
            echo "status=failed" >> artifacts/gate_status.txt
          else
            echo "status=passed" >> artifacts/gate_status.txt
          fi

      - name: Adversarial robustness test
        run: |
          python analysis/adversarial_noise_test.py

      - name: Bootstrap alpha stability
        run: |
          mkdir -p artifacts
          python -m analysis.bootstrap_alpha

      - name: Observable invariance
        run: python analysis/observable_invariant_test.py

      - name: Topology preservation
        run: python analysis/topology_preservation_test.py

      - name: Real world leaderboard
        run: python analysis/real_world_leaderboard.py

      - name: Phase transition scan
        run: |
          mkdir -p artifacts
          python analysis/phase_transition_scan.py

      - name: High resolution phase scan
        run: |
          python analysis/high_resolution_phase_scan.py

      - name: Nonlinear phase transition scan
        run: |
          mkdir -p artifacts
          python analysis/nonlinear_phase_scan.py

      - name: Upload spectral artifacts
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: nonlinear-phase-transition
          path: artifacts/nonlinear_phase_transition.png

      - name: Persist artifacts into repository
        if: always() && github.actor != 'github-actions[bot]'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          mkdir -p data

          find artifacts -type f -name "*.json" -exec cp {} data/ \;
          find artifacts -type f -name "*.txt" -exec cp {} data/ \;

          git add data/

          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi

          git fetch origin
          git reset --soft origin/main

          git commit -m "Automated scientific results update"

          git push origin HEAD:main
          
  stability-check:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b
    needs: verify
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deterministic scientific stack
        run: |
          python -m pip install --upgrade pip==24.0
          pip install numpy==1.26.4 sympy==1.12

      - name: Freeze environment
        run: pip freeze

      - name: Debug repository structure
        run: |
          echo "==== ROOT ===="
          ls -R

      - name: Run SDP robustness test
        run: python stability/sos_robustness_test.py

      - name: Spectral gap check
        run: python stability/spectral_gap_test.py

      - name: Eigenvalue drift
        run: python stability/eigen_drift_check.py

  sweep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    needs: stability-check

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip==24.0
          pip install numpy==1.26.4 scipy==1.12.0 pandas==2.2.0 matplotlib==3.8.2 pyarrow==15.0.2

      - name: Run multi-seed sweep
        run: |
          cd experiments
          python multi_seed_sweep.py

      - name: Run power analysis
        run: |
          cd experiments
          mkdir -p ../data
          python power_analysis.py > ../data/power_result.txt

      - name: Run FBM comparison
        run: |
          cd experiments
          mkdir -p ../data
          python fbm_comparison.py > ../data/fbm_comparison.txt

      - name: Run Bayesian model comparison
        run: |
          cd experiments
          mkdir -p ../data
          python model_comparison.py > ../data/model_comparison.txt

      - name: Run Hurst analysis
        run: |
          cd experiments
          mkdir -p ../data
          python hurst_dfa.py > ../data/hurst.txt

      - name: Run Null Ensemble Test
        run: |
          cd experiments
          mkdir -p ../data
          python null_ensemble.py > ../data/null_test.txt

      - name: Update Power Badge
        run: |
          cd experiments
          python update_badge.py

      - name: Compute Effect Size
        run: |
          cd experiments
          mkdir -p ../data
          python effect_size.py > ../data/effect_size.txt

      - name: Run Lyapunov Analysis
        run: |
          cd experiments
          mkdir -p ../data
          python lyapunov_estimation.py > ../data/lyapunov.txt

      - name: Strict Lyapunov Scan
        run: |
          python analysis/lyapunov_strict_scan.py

      - name: Commit dataset if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin
          git reset --soft origin/main

          git add data/* || true

          if git diff --cached --quiet; then
            echo "No dataset changes."
            exit 0
          fi

          sleep 3

          git commit -m "Automated multi-seed sweep update"
          git push origin HEAD:main
