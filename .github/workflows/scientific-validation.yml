          echo "✅ Artifact closure sealed"
          echo "✅ Release manifest sealed"
          echo "✅ Reproducibility stamp sealed"
          echo "✅ Temporal sovereignty sealed"
          echo "✅ Final state lock sealed"
          echo "✅ FINAL PROVENANCE CLOSURE COMPLETE"

      - name: Upload final provenance closure
        uses: actions/upload-artifact@v6
        with:
          name: final-provenance-closure
          path: |
            artifacts/canonical_report.json
            artifacts/report.hash
            artifacts/report_hash_manifest.json
            artifacts/external_replay_verification.json
            artifacts/adversarial_control.json
            artifacts/reproducibility_manifest.json
            artifacts/witness_lock.json
            artifacts/artifact_closure.json
            artifacts/release_manifest.json
            artifacts/reproducibility_stamp.json
            artifacts/temporal_sovereignty.json
            artifacts/final_state_lock.json
            artifacts/full_replay_consistency.json
            artifacts/internal_replay_verification.json
            artifacts/alpha_history.json
            artifacts/cross_dataset_scan.json
            artifacts/dataset_provenance.json
            artifacts/environment_fingerprint.json
            artifacts/external_witness.json
            artifacts/provenance_chain.json
            artifacts/canonical_report.lock

      - name: Upload canonical report
        uses: actions/upload-artifact@v6
        with:
          name: canonical-report
