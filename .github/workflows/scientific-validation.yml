            console.error(
              "❌ Unified claim is not declared as a diagnostic mirror"
            );
            process.exit(1);
          }

          if (
            !unified.verdict_logic ||
            unified.verdict_logic.authoritative !== false ||
            unified.verdict_logic.strict_claim_controls_verdict !== true ||
            unified.verdict_logic.acceptance_decision_must_not_be_derived_here !== true
          ) {
            console.error(
              "❌ Unified claim is allowed to act as an authority"
            );
            process.exit(1);
          }

          const forbiddenAdaptiveKeys = [
            "adaptive_alpha",
            "adaptive_sigma",
            "alpha_modes",
            "sigma_mode"
          ];

          for (const key of forbiddenAdaptiveKeys) {
            if (Object.prototype.hasOwnProperty.call(unified, key)) {
              console.error(
                `❌ Forbidden adaptive field in scientific proof mirror: ${key}`
              );
              process.exit(1);
            }
          }

          if (!strict.expected_result) {
            console.error(
              "❌ strict_claim.json expected_result is missing"
            );
