          import pandas as pd
          import numpy as np

          from analysis.numerical_spectral_verification import estimate_alpha

          def run_real_test(path):
              df = pd.read_csv(path)

              if not any(c in df.columns for c in ["Sunspots", "value"]):
                  raise ValueError("Dataset must contain 'value' or 'Sunspots'")

              if "value" in df.columns:
                  series = df["value"].values
              elif "Sunspots" in df.columns:
                  series = df["Sunspots"].values
              else:
                  raise ValueError("No valid column found (value / Sunspots)")
             
              if len(series) < 256:
                  series = np.pad(series, (0, 256-len(series)), mode='wrap')

              alpha = estimate_alpha(series)

              print("Real data alpha:", alpha)

          if __name__ == "__main__":
              run_real_test("real-data/sunspots_global_extended.csv")

          import pandas as pd
          import numpy as np

          np.random.seed(42)

          n = 200

          # White noise
          wn = np.random.randn(n)
          pd.DataFrame({"value": wn}).to_csv("real-data/white_noise.csv", index=False)

          # Random walk
          rw = np.cumsum(np.random.randn(n))
          pd.DataFrame({"value": rw}).to_csv("real-data/random_walk.csv", index=False)

          # Shuffled sunspots
          sun = pd.read_csv("real-data/sunspots_global_extended.csv").iloc[:,0].values
          shuffled = np.random.permutation(sun)
