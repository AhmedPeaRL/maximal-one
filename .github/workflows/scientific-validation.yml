name: Scientific Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
    
      - name: Install dependencies
        run: npm install

      - name: Run Publication Gate
        run: npm run validate

      - name: Upload scientific report
        uses: actions/upload-artifact@v4
        with:
         name: scientific-report
         path: core-scientific/publication-gate/report.json

      - name: Verify Artifact Integrity
        run: |
          sha256sum core-scientific/publication-gate/report.json

      - name: Verify report integrity
        run: npm run verify

      - name: Independent Public Audit
        run: npm run audit
