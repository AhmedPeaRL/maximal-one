  consensus:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b
    needs: gate

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce deterministic env
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "PYTHONHASHSEED=42" >> $GITHUB_ENV
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
          echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
          echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Debug repo structure
        run: |
          echo "==== CURRENT PATH ===="
          pwd
          echo "==== FILE TREE ===="
          ls -R
          
      - uses: actions/download-artifact@v6
        with:
          name: node-hash-18.20.8
          path: node18

      - uses: actions/download-artifact@v6
        with:
          name: node-hash-20.20.0
          path: node20

      - uses: actions/download-artifact@v6
        with:
          name: node-hash-24.11.1
          path: node24

      - name: Cross-version consensus (truth-aware)
        run: |
          H1=$(cat node18/node_report.hash)
          H2=$(cat node20/node_report.hash)
          H3=$(cat node24/node_report.hash)

          echo "Node 18 hash: $H1"
          echo "Node 20 hash: $H2"
          echo "Node 24 hash: $H3"

          mkdir -p artifacts

          echo "{\"node18\":\"$H1\",\"node20\":\"$H2\",\"node24\":\"$H3\"}" > artifacts/runtime_divergence_raw.json

          # TRUE CONSENSUS CHECK
          if [ "$H1" = "$H2" ] && [ "$H2" = "$H3" ]; then
            echo "CONSENSUS=true" >> $GITHUB_ENV
            echo "✅ Perfect deterministic consensus"
          else
            echo "CONSENSUS=false" >> $GITHUB_ENV
            echo "⚠️ Divergence detected — recorded as signal, not failure"
          fi

      - name: Consensus interpretation layer
        run: |
          if [ "$CONSENSUS" = "true" ]; then
            echo "System is strictly deterministic across runtimes."
          else
            echo "System exhibits controlled divergence."
            echo "Recording divergence fingerprint..."

            python - <<'PY'
          import json, hashlib

          with open("artifacts/runtime_divergence_raw.json") as f:
              d = json.load(f)

          fingerprint = hashlib.sha256(json.dumps(d, sort_keys=True).encode()).hexdigest()

          with open("artifacts/runtime_divergence.json","w") as f:
              json.dump({
                  "divergence": d,
                  "fingerprint": fingerprint,
                  "status": "controlled"
              }, f, indent=2)

          print("Divergence fingerprint:", fingerprint)
          PY
          fi
          
      - name: Ensure observer exists
        run: |
          if [ ! -f "analysis/cross_runtime_observer.py" ]; then
            echo "❌ Observer missing — system blind"
            exit 1
          fi

      - name: Analyze runtime divergence
        run: |
          echo "=== RUNNING cross_runtime_observer ==="
          python analysis/cross_runtime_observer.py

  verify-core:
    runs-on: ubuntu-24.04
    container:
      image: python:3.11.8-slim
    permissions:
      contents: write
    needs: consensus
    timeout-minutes: 20
    
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:

    # =========================
    # 0) CONTAINER BOOTSTRAP
    # =========================

    - name: HARD TIMEOUT GUARD
      shell: bash
      run: |
        set -euo pipefail
        echo "Starting guarded execution..."
        timeout 900 bash -c "echo guarded"

    - name: Install Git before checkout
      shell: bash
      run: |
        set -euo pipefail

        apt-get update
        apt-get install -y --no-install-recommends \
          git \
          ca-certificates

