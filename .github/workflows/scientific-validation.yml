    - name: Ensure workspace permissions
      shell: bash
      run: |
        set -euo pipefail
        chown -R root:root "$GITHUB_WORKSPACE" || true

    # =========================
    # CHECKOUT MUST HAPPEN
    # AFTER GIT INSTALLATION
    # =========================

    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Verify checkout produced Git worktree
      shell: bash
