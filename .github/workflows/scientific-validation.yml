    - name: Persist authoritative verification artifacts
      if: >
          success() &&
          github.event_name != 'pull_request'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
          set -euo pipefail

          echo "=== VERIFY WORKSPACE ==="

          test -d .git

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git config --global \
            --add safe.directory "$GITHUB_WORKSPACE"

          SOURCE_SHA="$GITHUB_SHA"

          echo "Scientific source commit:"
          echo "$SOURCE_SHA"

          echo "=== STAGE COMPUTED ARTIFACTS OUTSIDE GIT HISTORY ==="

          STAGING_DIR="$(mktemp -d)"

          ALLOWLIST=(
            "artifacts/canonical_report.json"
            "artifacts/report.hash"
            "artifacts/external_replay_verification.json"
            "artifacts/adversarial_control.json"
            "artifacts/dataset_provenance.json"
          )

          FOUND_ARTIFACT=false

          for source in "${ALLOWLIST[@]}"; do
            if [ -f "$source" ]; then
              mkdir -p \
                "$STAGING_DIR/$(dirname "$source")"

              cp \
                "$source" \
                "$STAGING_DIR/$source"

              echo "Staged: $source"
              FOUND_ARTIFACT=true
            else
              echo "Not present: $source"
            fi
          done

          if [ "$FOUND_ARTIFACT" = false ]; then
            echo "❌ No authoritative verification artifacts found."
            exit 1
          fi

          REPORT_HASH=""

          if [ -f "$STAGING_DIR/artifacts/report.hash" ]; then
            REPORT_HASH="$(
              cat "$STAGING_DIR/artifacts/report.hash"
            )"
          fi

          export SOURCE_SHA
          export REPORT_HASH

          echo "=== AUTHORITATIVE PERSISTENCE LOOP ==="

          SUCCESS=false

          for attempt in 1 2 3 4 5
          do
            echo "----------------------------------------"
            echo "Persistence attempt: $attempt"
            echo "----------------------------------------"

            echo "Fetching current main..."

            git fetch origin main

            REMOTE_SHA="$(git rev-parse origin/main)"

            export REMOTE_SHA
            export REPORT_HASH

            echo "Source SHA:"
            echo "$SOURCE_SHA"

            echo "Current remote main:"
            echo "$REMOTE_SHA"

            if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ] &&
               [ "$attempt" = "1" ]; then
              echo "❌ Local HEAD is not the workflow source commit."
              echo "Scientific persistence aborted."
              exit 1
            fi

            echo "Resetting local persistence base to current remote."

            git reset --hard "$REMOTE_SHA"

            echo "=== RESTORE AUTHORITATIVE ARTIFACTS ==="

            mkdir -p data/verification

            echo "=== PERSIST FINAL PROVENANCE CLOSURE ==="

            mkdir -p \
              data/verification/final_provenance_closure

            cp -a \
              artifacts/final_provenance_closure/. \
              data/verification/final_provenance_closure/

            echo "Final provenance closure persisted."

            for source in "${ALLOWLIST[@]}"; do
              if [ -f "$STAGING_DIR/$source" ]; then
                cp \
                  "$STAGING_DIR/$source" \
                  "data/verification/$(basename "$source")"

                echo "Persisting: $source"
              fi
            done

            echo "=== WRITE PERSISTENCE PROVENANCE ==="

            python - <<'PY'
          import json
          import os
          import time

          path = "data/verification/persistence_provenance.json"

          source_sha = os.environ["SOURCE_SHA"]
          remote_sha = os.environ["REMOTE_SHA"]
          report_hash = os.environ.get("REPORT_HASH", "")

          provenance = {
              "schema": "hcm.authoritative_persistence_provenance.v1",
              "source_commit": source_sha,
              "persistence_parent": remote_sha,
              "report_hash": report_hash,
              "generated_at_unix": time.time(),
              "history_policy": {
                  "rebase_used": False,
                  "force_push_used": False,
                  "remote_history_overwritten": False
              },
              "epistemic_policy": {
                  "persistence_does_not_promote_scientific_claim": True,
                  "artifact_source_commit_is_explicit": True
              }
          }

          with open(
              path,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  provenance,
                  f,
                  indent=2,
                  sort_keys=True
              )
          PY

            git add data/verification/final_provenance_closure
            git add data/verification

            if git diff --cached --quiet; then
              echo "No authoritative persistence changes."
              SUCCESS=true
              break
            fi

            echo "=== COMMIT ==="

            git commit \
              -m "Persist scientific verification artifacts [skip ci]"

            echo "=== LEASED FAST-FORWARD PUSH ==="

            if git push \
              --force-with-lease="refs/heads/main:$REMOTE_SHA" \
              origin \
              HEAD:main
            then
              echo "✅ Authoritative persistence completed."
              SUCCESS=true
              break
            fi

            echo "⚠️ Remote main advanced during persistence."
            echo "No rebase will be performed."
            echo "Refreshing remote and retrying."

            sleep 2
          done

          if [ "$SUCCESS" != true ]; then
            echo "❌ Authoritative persistence could not obtain a stable main tip."
            echo "No force push or silent rebase was performed."
            exit 1
          fi
        
