name: Validate Scientific Integrity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  multi-node-validate:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        region: [eastus, westus, northcentralus]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run validate

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.region }}
          path: core-scientific/publication-gate/report.json

  quorum-check:
    needs: multi-node-validate
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Evaluate Quorum
        run: |
          HASHES=()

          for file in reports/*/report.json; do
            HASH=$(jq -r '.deterministicArtifactHash' "$file")
            HASHES+=("$HASH")
          done

          echo "Collected hashes:"
          printf "%s\n" "${HASHES[@]}"

          declare -A counts

          for h in "${HASHES[@]}"; do
            counts[$h]=$((counts[$h]+1))
          done

          consensus=false
          consensus_hash=""

          for key in "${!counts[@]}"; do
            if [ "${counts[$key]}" -ge 2 ]; then
              consensus=true
              consensus_hash=$key
            fi
          done

          if [ "$consensus" = false ]; then
            echo "No quorum reached."
            exit 1
          fi

          echo "CONSENSUS_HASH=$consensus_hash" >> $GITHUB_ENV

  evolution:
    needs: quorum-check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Restore consensus report
        run: |
          mkdir -p core-scientific/publication-gate
          cp reports/*/report.json core-scientific/publication-gate/report.json

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run evolve
      - name: Restore consensus report
        run: |
          mkdir -p core-scientific/publication-gate
          cp reports/*/report.json core-scientific/publication-gate/report.json

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run evolve
