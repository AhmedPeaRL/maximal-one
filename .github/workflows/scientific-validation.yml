name: SOS Robustness Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
on:
  push:
    branches: [ "main", "attractor-evolution", "evolution" ]
  workflow_dispatch:
  repository_dispatch:
    types: [external_witness, external_dispatch, external_reproduction]
  pull_request:
    branches: [ "main" ]
  
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  actions: read
  pull-requests: read
  security-events: write
  
env:
  PYTHONHASHSEED: "42"
  NODE_ENV: "production"
  NODE_OPTIONS: "--no-deprecation"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  WITNESS_SECRET: ${{ secrets.WITNESS_SECRET }}
  GH_REPO: ${{ secrets.GH_REPO }}
  EXTERNAL_SOURCE_URL: ${{ secrets.EXTERNAL_SOURCE_URL }}
  CANONICAL_TIMESTAMP: "2026-01-01T00:00:00+00:00"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: false

jobs:
  core-proof:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript, python
                   
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Enforce deterministic env
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "PYTHONHASHSEED=42" >> $GITHUB_ENV
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
          echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
          echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Rate limit guard
        run: |
          echo "Checking execution frequency..."
          sleep 5

      - name: Install deps (STRICT)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt

      - name: Generate extended dataset (MANDATORY)
        continue-on-error: true
        run: |
