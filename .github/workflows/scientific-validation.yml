                  return {k: sanitize(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [sanitize(v) for v in obj]
              else:
                  return obj

          clean_report = sanitize(report)

          with open(path, "w") as f:
              json.dump(clean_report, f, sort_keys=True, separators=(',',':'))
          PY

      - name: Freeze canonical report (FINAL)
        run: |
          python - <<'PY'
          import json

          path = "artifacts/canonical_report.json"

          with open(path) as f:
              data = json.load(f)

          # 🔒 منع أي تعديل بعد اللحظة دي
          data["_sealed"] = True

          import math

          def sanitize(obj):
              if isinstance(obj, float):
                  if math.isnan(obj) or math.isinf(obj):
                      return None
                  return obj
              elif isinstance(obj, dict):
                  return {k: sanitize(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [sanitize(v) for v in obj]
              else:
                  return obj

          data = sanitize(data)

          with open(path, "w") as f:
              json.dump(data, f, sort_keys=True, separators=(',',':'))

          print("Report sealed.")
          PY

      - name: Final cryptographic hash
        shell: bash
        run: |
          set -euo pipefail

          test -f artifacts/canonical_report.json

          sha256sum artifacts/canonical_report.json \
            | cut -d " " -f1 \
            > artifacts/report.hash

          echo "Canonical report hash:"
          cat artifacts/report.hash

          test -s artifacts/report.hash

      - name: Final Provenance Closure
