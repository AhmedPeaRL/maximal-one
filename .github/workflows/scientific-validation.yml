          python - <<'PY'
          import numpy as np
          import pandas as pd
          from analysis.numerical_spectral_verification import (
              estimate_alpha
          )
          from analysis.independent_validation import (
              periodogram_alpha_estimation
          )

          def generate_adversarial_signal(
              n=1000,
              rng=None
          ):
              if rng is None:
                  rng = np.random.default_rng(42)

              wn = rng.standard_normal(n)

              high_freq = np.sin(
                  np.linspace(
                      0,
                      80 * np.pi,
                      n
                  )
              )

              burst = np.zeros(n)

              idx = rng.integers(
                  0,
                  n,
                  25
              )

              burst[idx] = rng.normal(
                  0,
                  8,
                  len(idx)
              )

              return (
                  wn
                  + 0.4 * high_freq
                  + burst
              )

          def is_structured(
              alpha1,
              alpha2,
              separation=None
          ):
              if not (
                  np.isfinite(alpha1)
                  and np.isfinite(alpha2)
              ):
                  return False

              delta = abs(alpha1 - alpha2)
              if delta > 0.5:
                  return False
                  
              alpha = (
                  alpha1 + alpha2
              ) / 2.0
              if not (
                  0.6 <= alpha <= 2.2
              ):
                  return False

              if separation is not None:
                  if separation.get("z_score", 0) < 1.0:
                      return False

              return True

          def persistence_score(series):
              series = np.asarray(
                  series,
                  dtype=np.float64
              )
              if len(series) < 256:
                  return 0.0

              raw_std = np.std(series)
              diff_std = np.std(
                  np.diff(series)
              ) + 1e-12
              ratio = raw_std / diff_std
              ac1 = np.corrcoef(
                  series[:-1],
                  series[1:]
              )[0,1]
              score = (
                  0.6 * np.tanh(ac1)
                  +
                  0.4 * np.tanh(ratio/10)
              )

              return float(score)

          def run_test():
              # === REAL DATA ===
              real_df = pd.read_csv("real-data/sunspots_global_extended.csv")
              col = "Sunspots" if "Sunspots" in real_df.columns else "value"
              real_series = real_df[col].values
              r_welch = estimate_alpha(real_series)
              r_fft = periodogram_alpha_estimation(real_series)
              
              print(f"=== REAL DATA ===\nFFT: {r_fft}\nWelch: {r_welch}")
              
              real_alpha = (
                  r_fft + r_welch
              ) / 2.0

              REAL_ALPHA_MIN = 0.05
              REAL_ALPHA_MAX = 3.0
              MAX_METHOD_DELTA = 0.30

              method_delta = abs(
                  r_fft - r_welch
              )

              if not (
                  np.isfinite(real_alpha)
                  and
                  REAL_ALPHA_MIN <= r_fft <= REAL_ALPHA_MAX
                  and
                  REAL_ALPHA_MIN <= r_welch <= REAL_ALPHA_MAX
                  and
                  method_delta <= MAX_METHOD_DELTA
              ):
                  raise SystemExit(
                      "❌ Real data baseline failed: "
                      f"FFT={r_fft}, "
                      f"Welch={r_welch}, "
                      f"delta={method_delta}"
                  )

              print(
                  "✅ Real data baseline passed: "
                  f"FFT={r_fft}, "
                  f"Welch={r_welch}, "
                  f"delta={method_delta}"
              )

              from analysis.strong_null_model import (
                  generate_strong_null
              )
              from analysis.separation_test import (
                  separation_score
              )
              # === ADVERSARIAL ===
              rng = np.random.default_rng(42)
              adv = generate_adversarial_signal(
                  len(real_series),
                  rng
              )
              null_rng = np.random.default_rng(42042)
              nulls = [
                  generate_strong_null(
                      len(adv),
                      null_rng
                  )
                  for _ in range(100)
              ]
              sep = separation_score(
                  adv,
                  nulls
              )
              a_fft, a_welch = estimate_alpha(adv),periodogram_alpha_estimation(adv)
              print(f"\n=== ADVERSARIAL DATA ===\nFFT: {a_fft}\nWelch: {a_welch}")
              
              p_score = persistence_score(adv)
              is_adv_structured = (
                  is_structured(
                      a_fft,
                      a_welch,
                      sep
                  )
                  and
                  p_score > 0.55
              )
              if is_adv_structured:
                  # لو لسه بيخدعنا، نستخدم اختبار القوة الطيفية (Spectral Power)
                  psd_adv = np.abs(np.fft.rfft(adv))**2
                  if np.max(psd_adv) / np.mean(psd_adv) < 10: # الداتا العشوائية طاقتها متوزعة مش مركزة
                      print("✅ Adversarial rejected by Power Distribution")
                      return
                  raise SystemExit("❌ Adversarial mimics structure — REJECTED")
              print("✅ Adversarial correctly rejected")

          if __name__ == "__main__":
              run_test()
          PY

