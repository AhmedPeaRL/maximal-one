name: Validate Scientific Integrity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  multi-node-validate:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        region: [eastus, westus, northcentralus]

    outputs:
      hash-eastus: ${{ steps.extract.outputs.hash }}
      hash-westus: ${{ steps.extract.outputs.hash }}
      hash-northcentralus: ${{ steps.extract.outputs.hash }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run validate

      - id: extract
        run: |
          HASH=$(node -e "console.log(require('./core-scientific/publication-gate/report.json').deterministicArtifactHash)")
          echo "hash=$HASH" >> $GITHUB_OUTPUT

  quorum-check:
    needs: multi-node-validate
    runs-on: ubuntu-24.04

    steps:
      - name: Evaluate Quorum
        run: |
          HASHES=(
            "${{ needs.multi-node-validate.outputs.hash-eastus }}"
            "${{ needs.multi-node-validate.outputs.hash-westus }}"
            "${{ needs.multi-node-validate.outputs.hash-northcentralus }}"
          )

          echo "Collected hashes:"
          printf "%s\n" "${HASHES[@]}"

          declare -A counts

          for h in "${HASHES[@]}"; do
            counts[$h]=$((counts[$h]+1))
          done

          consensus=false

          for key in "${!counts[@]}"; do
            if [ "${counts[$key]}" -ge 2 ]; then
              consensus=true
              echo "Quorum reached on hash: $key"
            fi
          done

          if [ "$consensus" = false ]; then
            echo "No quorum reached."
            exit 1
          fi

  evolution:
    needs: quorum-check
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run evolve
