      run: python analysis/external_irreversible_witness.py

    - name: External Irreducible Verifier (OUTSIDE SYSTEM)
      run: python analysis/external_irreducible_verifier.py

    - name: Adaptive weighting
      run: python analysis/adaptive_weights.py

    - name: Ensure git exists
      run: |
        if ! command -v git &> /dev/null; then
          echo "Installing git..."
          apt-get update && apt-get install -y git
        fi

    - name: Reality Closure Loop
      run: python analysis/reality_closure_loop.py

    - name: Reality Pressure Export (RPEL)
      run: python analysis/reality_pressure_export.py

    - name: External Reproduction (non-blocking)
      run: python analysis/external_reproduction.py || echo "External reproduction degraded"

    - name: Persist results (authoritative git layer)
      if: always()
      env:
         GH_TOKEN: ${{ secrets.GH_TOKEN }}
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        set -euo pipefail

        echo "=== VERIFY WORKSPACE ==="
        pwd
        ls -la

        echo "=== ENSURE GIT CONTEXT ==="

        if ! git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
          echo "⚠️ Not inside git repo — reconstructing"

          rm -rf .git

          git init
          git remote add origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git

          git fetch origin main

          git checkout -b main origin/main || git checkout -b main

          git reset --hard origin/main || true
        fi

        echo "=== CONFIGURE GIT ==="
        
        git config --global credential.helper store
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git config pull.rebase true
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name "bot"
        git config user.email "bot@github.com"

        echo "=== PREP DATA (FIXED) ==="

        mkdir -p data

        # تأكد إن فيه artifacts
        FILES=$(ls artifacts/*.json 2>/dev/null || true)

        if [ -z "$FILES" ]; then
          echo "⚠️ No artifacts found — generating fallback"

          echo '{
            "timestamp": '$(date +%s)',
            "status": "no_artifact",
            "coherence": 0
          }' > data/fallback_$(date +%s).json

        else
          for f in $FILES; do
            BASENAME=$(basename "$f")
            cp "$f" "data/$(date +%s)_$BASENAME"
          done
        fi

        git add .

        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Atomic state update" || echo "No changes"

        echo "=== SAFE PUSH (TOKEN-INJECTED) ==="

        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

        git add data/external/

        if git diff --cached --quiet; then
          echo "No new witness → skipping push"
          exit 0
        fi

        git commit -m "External witness ingestion" || {
           echo "Nothing to commit"
           exit 0
        }
        
        python analysis/push_guard.py

        SUCCESS=false
          
        for i in 1 2 3 4 5
        do
          git pull --rebase origin main || true
            
          if git push origin HEAD:main; then
            echo "Push succeeded"
            SUCCESS=true
            break
          fi

          echo "Retry $i..."
          sleep 2
            
        done
          
        if [ "$SUCCESS" = false ]; then
          echo "Push skipped or failed gracefully (non-critical)"
          exit 0
        fi
        
  stability-check:
    runs-on: ubuntu-24.04
    container:
      image: python@sha256:90f8795536170fd08236d2ceb74fe7065dbf74f738d8b84bfbf263656654dc9b
    needs: verify-core
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce deterministic env
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "PYTHONHASHSEED=42" >> $GITHUB_ENV
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
          echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
          echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Install system build tools
        run: |
          apt-get update
          apt-get install -y build-essential g++

      - name: Install locked dependencies (strict + fallback awareness)
        run: |
          pip install --require-hashes -r requirements-lock.txt || {
            echo "⚠️ Hash mismatch detected — recording divergence"
            pip install -r requirements-lock.txt
          }

      - name: Freeze environment
        run: pip freeze

      - name: Debug repository structure
        run: |
          echo "==== ROOT ===="
          ls -R

      - name: Run SDP robustness test
        run: python stability/sos_robustness_test.py

      - name: Spectral gap check
        run: python stability/spectral_gap_test.py

      - name: Eigenvalue drift
        run: python stability/eigen_drift_check.py
  
