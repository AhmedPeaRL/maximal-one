          set -e

          echo "Resetting origin safely..."

          git remote remove origin || true

          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git fetch origin main || true

          git checkout main || git checkout -b main

          git branch --set-upstream-to=origin/main main || true

          echo "✅ origin fully restored and linked"

      - name: Commit dataset if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git fetch origin main || true
          git reset --soft origin/main || true

          git add -A data

          if git diff --cached --quiet; then
            echo "No dataset changes."
            exit 0
          fi

          sleep 3

          git commit -m "Automated multi-seed sweep update"
          git push origin HEAD:main
