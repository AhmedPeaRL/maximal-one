name: Scientific Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write

jobs:

  compute:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - name: Run Node validation suite
        run: |
          npm run validate
          npm run verify
          npm run stability
          npm run attractor

      - name: Compute Canonical SHA256
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          function canonicalize(obj){
            if(Array.isArray(obj)) return obj.map(canonicalize);
            if(obj && typeof obj === 'object'){
              return Object.keys(obj).sort().reduce((a,k)=>{
                a[k] = canonicalize(obj[k]);
                return a;
              },{});
            }
            return obj;
          }

          const raw = JSON.parse(
            fs.readFileSync('core-scientific/publication-gate/report.json','utf8')
          );

          const canon = canonicalize(raw);

          const hash = crypto.createHash('sha256')
            .update(JSON.stringify(canon))
            .digest('hex');

          fs.writeFileSync('hash.txt', hash);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: node-hash-${{ matrix.node-version }}
          path: hash.txt

  build-report:
    runs-on: ubuntu-24.04
    needs: compute

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Install deterministic Python env
        run: |
          python -m pip install pip==24.0
          pip install --require-hashes -r requirements.txt

      - name: Freeze exact environment
        run: pip freeze > pip-freeze.txt

      - name: Generate deterministic report
        run: |
          PYTHONHASHSEED=0 python scripts/generate_report.py --seed 42

      - name: Inject environment fingerprint into report
        run: |
          python - <<'PY'
          import json, hashlib, platform

          report_path = "artifacts/canonical_report.json"
          with open(report_path) as f:
              report = json.load(f)

          with open("pip-freeze.txt") as f:
              freeze = f.read()

          report["_environment"] = {
              "python_version": platform.python_version(),
              "pip_freeze_sha256": hashlib.sha256(freeze.encode()).hexdigest()
          }

          with open(report_path,"w") as f:
              json.dump(report,f,indent=2,sort_keys=True)
          PY

      - name: Hash final report
        run: |
          sha256sum artifacts/canonical_report.json | cut -d " " -f1 > report.hash

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-report
          path: artifacts/canonical_report.json

      - uses: actions/upload-artifact@v4
        with:
          name: report-hash
          path: report.hash

      - uses: actions/upload-artifact@v4
        with:
          name: pip-freeze
          path: pip-freeze.txt

  gate:
    runs-on: ubuntu-24.04
    needs: build-report
    outputs:
      passed: ${{ steps.gate_step.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: canonical-report

      - uses: actions/download-artifact@v4
        with:
          name: report-hash

      - name: Verify report hash
        run: |
          CALC=$(sha256sum canonical_report.json | cut -d " " -f1)
          STORED=$(cat report.hash)

          if [ "$CALC" != "$STORED" ]; then
            echo "Hash mismatch"
            exit 1
          fi

      - name: Run adaptive attractor
        id: gate_step
        run: |
          RESULT=$(node core-scientific/attractor-field/adaptive-threshold.cjs | tail -n 1)

          PASSED=$(node -e "
            const d = JSON.parse(process.argv[1]);
            console.log(d.passed === true ? 'true' : 'false');
          " "$RESULT")

          if [ "$PASSED" != "true" ]; then
            exit 1
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT

  evolve:
    runs-on: ubuntu-24.04
    needs: gate
    if: needs.gate.outputs.passed == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci
      - run: npm run evolve

      - name: Commit evolution
        run: |
          git config user.name "HCM Evolution Bot"
          git config user.email "evolution@mesh.local"
          git add core-scientific
          if git diff --cached --quiet; then
            echo "No evolution delta."
          else
            git commit -m "Deterministic evolution state update"
            git push
          fi

  consensus:
    runs-on: ubuntu-24.04
    needs: evolve

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-hash-18
          path: node18

      - uses: actions/download-artifact@v4
        with:
          name: node-hash-20
          path: node20

      - name: Compare Node hashes
        run: |
          H1=$(cat node18/hash.txt)
          H2=$(cat node20/hash.txt)

          if [ "$H1" != "$H2" ]; then
            echo "Cross-version divergence detected"
            exit 1
          fi

          echo "Cross-version consensus verified."
