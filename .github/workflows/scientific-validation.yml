          python - <<'PY'
          import numpy as np
          import pandas as pd

          FREQ_MIN = 0.01
          FREQ_MAX = 0.05
          PEAK_RATIO_THRESHOLD = 20.0
          MAX_BAND_PEAK_FRACTION = 0.50

          def normalized_psd(series):
              x = np.asarray(series, dtype=np.float64)

              if x.ndim != 1 or len(x) < 500:
                  raise ValueError(
                      f"invalid periodicity input length={len(x)}"
                  )

              if not np.all(np.isfinite(x)):
                  raise ValueError(
                      "periodicity input contains non-finite values"
                  )

              x = x - np.mean(x)

              std = np.std(x)

              if std < 1e-12:
                  raise ValueError(
                      "periodicity input is degenerate"
                  )

              x = x / std

              fft = np.fft.rfft(x)
              power = np.abs(fft) ** 2
              freqs = np.fft.rfftfreq(len(x))

              finite = (
                  np.isfinite(freqs)
                  &
                  np.isfinite(power)
              )

              freqs = freqs[finite]
              power = power[finite]

              return freqs, power

          def periodicity_diagnostics(series):
              freqs, power = normalized_psd(series)

              positive = freqs > 0

              if not np.any(positive):
                  raise ValueError(
                      "no positive-frequency bins available"
                  )

              positive_power = power[positive]

              peak_index = int(
                  np.argmax(positive_power)
              )

              peak_power = float(
                  positive_power[peak_index]
              )

              mean_power = float(
                  np.mean(positive_power)
              )

              peak_ratio = (
                  peak_power
                  /
                  (mean_power + 1e-12)
              )

              band = (
                  (freqs > FREQ_MIN)
                  &
                  (freqs < FREQ_MAX)
              )

              band_power = power[band]

              if len(band_power) == 0:
                  band_peak_fraction = 0.0
              else:
                  total_band_power = float(
                      np.sum(band_power)
                  )

                  band_peak_power = float(
                      np.max(band_power)
                  )

                  band_peak_fraction = (
                      band_peak_power
                      /
                      (total_band_power + 1e-12)
                  )

              return {
                  "peak_ratio": float(peak_ratio),
                  "band_peak_fraction": float(
                      band_peak_fraction
                  ),
              }

          def run():
              df = pd.read_csv(
                  "real-data/sunspots_global_extended.csv"
              )

              candidates = [
                  "Sunspots",
                  "sunspots",
                  "value",
              ]

              column = next(
                  (
                      c
                      for c in candidates
                      if c in df.columns
                  ),
                  None,
              )

              if column is None:
                  raise SystemExit(
                      "No recognised sunspot signal column"
                  )

              series = df[column].to_numpy(
                  dtype=np.float64
              )

              diagnostics = periodicity_diagnostics(
                  series
              )

              peak_ratio = diagnostics[
                  "peak_ratio"
              ]

              band_peak_fraction = diagnostics[
                  "band_peak_fraction"
              ]

              print(
                  "Spectral peak ratio:",
                  peak_ratio,
              )

              print(
                  "Band peak fraction:",
                  band_peak_fraction,
              )

              if peak_ratio > PEAK_RATIO_THRESHOLD:
                  print(
                      "⚠️ Strong spectral concentration detected."
                  )

              if (
                  band_peak_fraction
                  >
                  MAX_BAND_PEAK_FRACTION
              ):
                  raise SystemExit(
                      "❌ Excessive single-bin concentration "
                      "inside canonical band; periodicity "
                      "cannot be declared non-artificial."
                  )

              print(
                  "✅ No excessive single-bin "
                  "spectral concentration detected."
              )

          if __name__ == "__main__":
              run()

          class LinearSystem:
              def __init__(self, A, B, M):
                  self.A = np.array(A, dtype=float)
                  self.B = np.array(B, dtype=float)
                  self.M = float(M)

          class TheoreticalVerifier:
              def __init__(self, system: LinearSystem):
                  self.system = system

              def verify(self):
                  A = self.system.A
                  B = self.system.B
                  M = self.system.M

                  spectral_radius_squared = np.linalg.norm(A)**2

                  if spectral_radius_squared >= 1:
                      return {
                          "stable": False,
                          "reason": "Spectral radius squared >= 1"
                      }

                  ultimate_bound = (np.linalg.norm(B)**2 * M**2) / (1 - spectral_radius_squared)

                  return {
                      "stable": True,
                      "spectral_radius_squared": float(spectral_radius_squared),
                      "ultimate_bound": float(ultimate_bound)
                  }
                  
          import subprocess
          import sys

          scripts = [
              "stability/linear_family_certification.py",
              "stability/nonlinear_lasalle_gate.py",
              "stability/symbolic_proof_generator.py",
              "integrity/cryptographic_stamp.py"
          ]

          for script in scripts:
              result = subprocess.run([sys.executable, script])
              if result.returncode != 0:
                  raise RuntimeError(f"Pipeline failed at {script}")

          print("Full reproducible research pipeline passed.")
              
          import pandas as pd
          from analysis.predictive_validation import evaluate_prediction

          df = pd.read_csv("real-data/sunspots_global_extended.csv")
