name: Deterministic Scientific Mesh

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:

  compute:
    name: Compute Deterministic Hash
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
        byzantine: [false]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      - name: Run validation
        run: |
          npm run validate
          npm run verify
          npm run stability
          npm run attractor

      - name: Byzantine simulation (optional corruption)
        if: matrix.byzantine == 'true'
        run: |
          echo "corruption" >> core-scientific/publication-gate/report.json

      - name: Compute SHA256
        run: |
          node -e "const fs=require('fs'); const crypto=require('crypto'); const data=fs.readFileSync('core-scientific/publication-gate/report.json'); const hash=crypto.createHash('sha256').update(data).digest('hex'); console.log(hash); fs.writeFileSync('hash.txt',hash);"

      - name: Ensure report exists
        run: |
          if [ ! -f core-scientific/publication-gate/report.json ]; then
          echo "report.json missing before upload"
          exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.node-version }}
          path: hash.txt
          overwrite: true

      - uses: actions/upload-artifact@v4
        with:
          name: scientific-report-${{ matrix.node-version }}
          path: core-scientific/publication-gate/report.json
          overwrite: true

  vote:
    name: Multi-Runner Hash Voting
    needs: compute
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes

      - name: Majority vote
        id: vote_step
        run: |
          HASHES=$(cat hashes/**/hash.txt)
          UNIQUE=$(echo "$HASHES" | sort | uniq | wc -l)

          if [ "$UNIQUE" -ne 1 ]; then
            echo "Divergence detected"
            exit 1
          fi

          CONS=$(echo "$HASHES" | head -n 1)
          echo "consensus=$CONS" >> $GITHUB_OUTPUT
          echo $CONS > consensus.txt

      - uses: actions/upload-artifact@v4
        with:
          name: consensus
          path: consensus.txt
          overwrite: true

  notarize:
    name: Cross-Repo Notarization
    needs: vote
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: consensus

      - name: Create notarization record
        run: |
          CONS=$(cat consensus.txt)
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"notarizedHash\":\"$CONS\",\"timestamp\":\"$TS\"}" > notarization.json

      - uses: actions/upload-artifact@v4
        with:
          name: notarization
          path: notarization.json
          overwrite: true

  attractor:
    name: Attractor Field Gate
    needs: notarize
    runs-on: ubuntu-24.04

    outputs:
      passed: ${{ steps.adaptive.outputs.passed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: scientific-report-18
          path: core-scientific/publication-gate

      - name: Ensure report exists
        run: |
          if [ ! -f core-scientific/publication-gate/report.json ]; then
            echo "report.json missing before attractor scoring"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Compute attractor score
        id: score
        run: |
          SCORE=$(node ./core-scientific/metrics/attractor-score.js | awk '{print $3}')
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "Attractor score is $SCORE"

      - name: Adaptive threshold evaluation
        id: adaptive
        run: |
          SCORE=${{ steps.score.outputs.score }}
          RESULT=$(node ./core-scientific/metrics/adaptive-threshold.js $SCORE)

          echo "$RESULT"

          PASSED=$(echo "$RESULT" | jq -r '.passed')
          echo "passed=$PASSED" >> $GITHUB_OUTPUT

          if [ "$PASSED" != "true" ]; then
            echo "Adaptive gate rejected evolution."
            exit 1
          fi

      - name: Commit evolution to branch
        run: |
          git config user.name "HCM Mesh Bot"
          git config user.email "mesh@system.local"

          BRANCH="evolution-$(date +%s)"

          git checkout -b $BRANCH

          git add core-scientific/metrics/attractor-history.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Autonomous attractor evolution update"
          git push origin $BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(git symbolic-ref --short HEAD)

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Autonomous Evolution Update" \
            --body "This PR was automatically generated by the Attractor Field Gate."

      - uses: actions/upload-artifact@v4
        with:
          name: attractor-history
          path: core-scientific/metrics/attractor-history.json
          overwrite: true

  evolve:
    name: Evolution Gate
    needs: attractor
    if: ${{ needs.attractor.outputs.passed == 'true' }}
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: scientific-report-18
          path: core-scientific/publication-gate

      - name: Ensure report exists
        run: |
          if [ ! -f core-scientific/publication-gate/report.json ]; then
            echo "Missing report.json after artifact download."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run evolve

      - name: Commit evolution state
        run: |
          git config user.name "HCM Evolution Bot"
          git config user.email "evolution@mesh.local"

          git add core-scientific

          if git diff --cached --quiet; then
            echo "No evolution delta."
          else
            git commit -m "Autonomous evolution state update"
            git push
          fi
