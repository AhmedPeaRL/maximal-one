          ) is not True:
              raise SystemExit(
                  "❌ Manifest independent rerun is not verified"
              )

          if manifest.get(
              "fingerprint_match"
          ) is not True:
              raise SystemExit(
                  "❌ Manifest fingerprint match is not verified"
              )

          print(
              "========================================"
          )
          print(
              "INDEPENDENT REPRODUCTION EVIDENCE: PASS"
          )
