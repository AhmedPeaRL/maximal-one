              "utf8"
            )
          );

          const strict = JSON.parse(
            fs.readFileSync(
              "core-scientific/strict_claim.json",
              "utf8"
            )
          );

          const mode = JSON.parse(
            fs.readFileSync(
              "core-scientific/runtime_mode.json",
              "utf8"
            )
          );

          if (mode.mode !== "scientific_proof") {
            console.error(
              "❌ Scientific proof workflow requires runtime mode: scientific_proof"
            );
            process.exit(1);
          }

          const proofMode =
            mode.modes &&
            mode.modes.scientific_proof;

          if (!proofMode) {
            console.error(
              "❌ scientific_proof mode definition is missing"
            );
            process.exit(1);
          }

          if (proofMode.allow_adaptive !== false) {
            console.error(
              "❌ Adaptive validation is enabled in scientific_proof mode"
            );
            process.exit(1);
          }

          if (proofMode.strict_claim !== true) {
            console.error(
              "❌ scientific_proof mode does not require strict_claim"
            );
            process.exit(1);
          }

          if (
            unified.authoritative_claim_contract !==
            "core-scientific/strict_claim.json"
          ) {
            console.error(
              "❌ Unified claim does not point to strict_claim.json"
            );
