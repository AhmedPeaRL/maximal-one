          import numpy as np
          import pandas as pd
          from analysis.numerical_spectral_verification import (
              estimate_alpha
          )
          from analysis.independent_validation import (
              core_alpha_estimation
          )

          def generate_adversarial_signal(n=1000):
              wn = np.random.standard_normal(n)
              high_freq = np.sin(
                  np.linspace(
                      0,
                      80*np.pi,
                      n
                  )
              )
              burst = np.zeros(n)
              idx = np.random.randint(
                  0,
                  n,
                  25
              )
              burst[idx] = np.random.normal(
                  0,
                  8,
                  len(idx)
              )

              return (
                  wn
                  + 0.4*high_freq
                  + burst
              )

          def is_structured(
              alpha1,
              alpha2,
              separation=None
          ):
              if not (
                  np.isfinite(alpha1)
                  and np.isfinite(alpha2)
              ):
                  return False

              delta = abs(alpha1 - alpha2)
              if delta > 0.5:
                  return False
                  
              alpha = (
                  alpha1 + alpha2
              ) / 2.0
              if not (
                  0.6 <= alpha <= 2.2
              ):
                  return False

              if separation is not None:
                  if separation.get("z_score", 0) < 1.0:
                      return False

              return True

          def persistence_score(series):
              series = np.asarray(
                  series,
                  dtype=np.float64
              )
              if len(series) < 256:
                  return 0.0

              raw_std = np.std(series)
              diff_std = np.std(
                  np.diff(series)
              ) + 1e-12
              ratio = raw_std / diff_std
              ac1 = np.corrcoef(
                  series[:-1],
                  series[1:]
              )[0,1]
              score = (
                  0.6 * np.tanh(ac1)
                  +
                  0.4 * np.tanh(ratio/10)
              )

              return float(score)

          def run_test():
