name: Scientific Validation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONHASHSEED: "0"
  NODE_ENV: "production"

jobs:

  compute:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.20.8, 20.20.0, 24.11.1]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Missing package-lock.json — reproducibility broken."
            exit 1
          fi

      - name: Deterministic install
        run: npm ci --ignore-scripts --no-audit
             
      - name: Run deterministic Node suite
        run: |
         npm run validate
         npm run verify
         npm run stability
         npm run attractor

      - name: Canonicalize and hash report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          function canonical(obj){
            if(Array.isArray(obj)) return obj.map(canonical);
            if(obj && typeof obj === 'object'){
              return Object.keys(obj).sort().reduce((a,k)=>{
                a[k]=canonical(obj[k]);
                return a;
              },{});
            }
            return obj;
          }

          const raw = JSON.parse(
            fs.readFileSync('core-scientific/publication-gate/report.json','utf8')
          );

          const canon = canonical(raw);
          const serialized = JSON.stringify(canon);

          const hash = crypto.createHash('sha256')
            .update(serialized)
            .digest('hex');

          fs.writeFileSync('node_report.hash', hash);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: node-hash-${{ matrix.node-version }}
          path: node_report.hash

  build-report:
    runs-on: ubuntu-24.04
    needs: compute
    container:
      image: python:3.11.8-slim

    steps:
      - uses: actions/checkout@v4

      - name: Pin pip version
        run:  |
          python -m pip install pip==24.0
          pip install numpy==2.4.2
          
      - name: Deterministic dependency install
        run:  pip install --upgrade pip -r requirements.txt

      - name: Freeze environment
        run: pip freeze > pip-freeze.txt

      - name: Generate deterministic report
        run: python scripts/generate_report.py --seed 42 --canonical

      - name: Inject environment fingerprint
        run: |
          python - <<'PY'
          import json, hashlib, platform

          path = "artifacts/canonical_report.json"

          with open(path) as f:
              report = json.load(f)

          freeze = open("pip-freeze.txt").read()

          report["_environment"] = {
              "python": platform.python_version(),
              "pip_freeze_sha256": hashlib.sha256(freeze.encode()).hexdigest()
          }

          with open(path,"w") as f:
              json.dump(report,f,sort_keys=True,separators=(',',':'))
          PY

      - name: Final cryptographic hash
        run: sha256sum artifacts/canonical_report.json | cut -d " " -f1 > report.hash

      - uses: actions/upload-artifact@v4
        with:
          name: canonical-report
          path: artifacts/canonical_report.json

      - uses: actions/upload-artifact@v4
        with:
          name: report-hash
          path: report.hash

      - uses: actions/upload-artifact@v4
        with:
          name: pip-freeze
          path: pip-freeze.txt

  gate:
    runs-on: ubuntu-24.04
    needs: build-report
    outputs:
      passed: ${{ steps.final_gate.outputs.passed }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: canonical-report

      - uses: actions/download-artifact@v4
        with:
          name: report-hash

      - name: Verify hash integrity
        run: |
          CALC=$(sha256sum canonical_report.json | cut -d " " -f1)
          STORED=$(cat report.hash)

          if [ "$CALC" != "$STORED" ]; then
            echo "Report integrity violation."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - run: npm ci --ignore-scripts --no-audit

      - name: Adaptive Attractor Gate
        id: final_gate
        run: |
          RESULT=$(node core-scientific/attractor-field/adaptive-threshold.cjs | tail -n 1)

          PASSED=$(node -e "
            const d = JSON.parse(process.argv[1]);
            console.log(d.passed === true ? 'true' : 'false');
          " "$RESULT")

          if [ "$PASSED" != "true" ]; then
            exit 1
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT

  consensus:
    runs-on: ubuntu-24.04
    needs: gate

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-hash-18.20.8
          path: node18

      - uses: actions/download-artifact@v4
        with:
          name: node-hash-20.20.0
          path: node20

      - name: Cross-version consensus
        run: |
          H1=$(cat node18/node_report.hash)
          H2=$(cat node20/node_report.hash)

          if [ "$H1" != "$H2" ]; then
            echo "Cross-version divergence detected."
            exit 1
          fi

          echo "Deterministic consensus verified."
