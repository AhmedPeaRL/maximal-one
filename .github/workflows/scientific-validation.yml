  ingest-witness:
    runs-on: ubuntu-24.04
    needs: core-proof
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce deterministic env
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "PYTHONHASHSEED=42" >> $GITHUB_ENV
          echo "OMP_NUM_THREADS=1" >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1" >> $GITHUB_ENV
          echo "OPENBLAS_NUM_THREADS=1" >> $GITHUB_ENV
          echo "NUMEXPR_NUM_THREADS=1" >> $GITHUB_ENV

      - name: Install deps (STRICT)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements-lock.txt

      - name: Secret scan (refined)
        run: |
          echo "Running refined secret scan..."

          # Exclude known safe patterns (env usage)
          if grep -r -E "Bearer [A-Za-z0-9_\-]{40,}" . \
               --exclude-dir=node_modules \
               --exclude-dir=.git \
               --exclude="*.example" \
               --exclude="*.md" \
               --exclude="*.txt"; then        
            echo "⚠️ Potential REAL secret leak detected"
            exit 1
          fi

          echo "✅ No hardcoded secrets detected"

      - name: Mask secrets
        run: |
          echo "::add-mask::${{ secrets.GH_TOKEN }}"
          echo "::add-mask::${{ secrets.WITNESS_SECRET }}"

      - name: Block real GitHub tokens only
        run: |
          echo "Scanning for REAL GitHub tokens..."

          MATCHES=$(grep -r -E "(REMOVED[A-Za-z0-9]{20,}|REMOVED[A-Za-z0-9_]{20,})" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude="*.example" \
            --exclude="*.md" \
            --exclude="*.txt" || true)

          if [ -n "$MATCHES" ]; then
            echo "❌ REAL GitHub token detected:"
            echo "$MATCHES"
            exit 1
          fi

          echo "✅ No real tokens detected"

      - name: Store external witness
        run: |
          mkdir -p data/external

          RAW='${{ toJson(github.event.client_payload) }}'

          if [ "$RAW" = "null" ] || [ -z "$RAW" ]; then
            echo '{"_empty": true, "timestamp": "'$(date -Iseconds)'"}' > data/external/witness_$(date +%s).json
          else
            echo "$RAW" > data/external/witness_$(date +%s).json
          fi

      - name: Validate witness payload
        run: |
          RAW='${{ toJson(github.event.client_payload) }}'

          # Normalize payload
          if [ "$RAW" = "null" ] || [ -z "$RAW" ]; then
            echo '{"_empty": true}' > payload.json
          else
            echo "$RAW" > payload.json
          fi

          node - <<'NODE'
          const fs = require('fs');

          let data;
          try {
            data = JSON.parse(fs.readFileSync('payload.json','utf8'));
          } catch (e) {
            console.error("Malformed JSON");
            process.exit(1);
          }

          // Reject null explicitly
          if (data === null) {
            console.error("Null payload rejected");
            process.exit(1);
          }

          // Allow empty but mark it
          if (data._empty === true) {
            console.log("Empty witness accepted.");
            process.exit(0);
          }

          // Reject empty object (silent noise)
          if (typeof data === 'object' && Object.keys(data).length === 0) {
            console.error("Empty object payload rejected");
            process.exit(1);
          }

          // Size guard
          const size = JSON.stringify(data).length;
          if (size > 5000) {
            console.error("Payload too large");
            process.exit(1);
          }

          console.log("Payload validated.");
          NODE

      - name: Semantic validation layer
        run: node analysis/witness_semantic_guard.cjs

      - name: External Hostile Injection Test
        run: |
          echo "Running hostile injection simulation..."

          node - <<'NODE'
          const payloads = [
            {},
            { junk: "random_noise" },
            { nested: { invalid: null } },
            { oversized: "x".repeat(6000) }
          ];

          for (const p of payloads) {
            const raw = JSON.stringify(p);

            if (!raw || raw === "{}") {
              console.log("Rejected empty payload ✔");
              continue;
            }

            if (raw.length > 5000) {
              console.log("Rejected oversized payload ✔");
              continue;
            }

            console.log("Payload accepted (controlled):", raw.length);
          }
          NODE

      - name: Verify witness signature (conditional)
        env:
          WITNESS_SECRET: ${{ secrets.WITNESS_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "External witness detected → verifying signature..."
            node analysis/verify_witness_signature.cjs || echo "⚠️ Signature missing — recorded as unverified witness"
          else
            echo "Internal trigger → skipping signature verification"
          fi

      - name: Attach witness hash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const raw = fs.readFileSync('payload.json','utf8');

          const hash = crypto.createHash('sha256').update(raw).digest('hex');

          fs.writeFileSync('payload.hash', hash);

          console.log("Witness hash:", hash);
          NODE

      - name: Ensure remote origin (FIXED PROPERLY)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e

          echo "Resetting origin safely..."

          git remote remove origin || true

          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git fetch origin main || true

          git checkout main || git checkout -b main

          git branch --set-upstream-to=origin/main main || true

          echo "✅ origin fully restored and linked"
          
      - name: Safe authenticated push (FIXED)
        env:
           GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -e
          
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          git add data/external/
          
          if git diff --cached --quiet; then
            echo "No new witness → skipping push"
            exit 0
          fi
          
          git commit -m "External witness ingestion" || {
             echo "Nothing to commit"
             exit 0
          }

          python analysis/push_guard.py
          
          SUCCESS=false
          
          for i in 1 2 3 4 5
          do
            git pull --rebase origin main || true
            
            if git push origin HEAD:main; then
              echo "Push succeeded"
              SUCCESS=true
              break
            fi

            echo "Retry $i..."
            sleep 2
            
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "Push skipped or failed gracefully (non-critical)"
            exit 0
          fi

      - name: Append to witness chain
        run: |
          python analysis/witness_chain.py "$(cat payload.json)"

