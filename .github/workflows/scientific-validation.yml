name: Deterministic Scientific Mesh

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:

  compute:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [18, 20]

    outputs:
      artifact_hash: ${{ steps.hash.outputs.hash }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm install
      - run: npm run validate
      - run: npm run verify
      - run: npm run stability

      - name: Compute deterministic hash
        id: hash
        run: |
          HASH=$(sha256sum core-scientific/publication-gate/report.json | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo $HASH > hash.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.node }}
          path: hash.txt

  vote:
    needs: compute
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes

      - name: Majority vote
        run: |
          HASHES=$(cat hashes/**/hash.txt)
          UNIQUE=$(echo "$HASHES" | sort | uniq | wc -l)
          if [ "$UNIQUE" -ne 1 ]; then
            echo "Hash divergence detected"
            exit 1
          fi
          echo "Consensus achieved: $HASHES"

      - name: Store consensus
        run: |
          echo "$HASHES" > consensus.txt

      - uses: actions/upload-artifact@v4
        with:
          name: consensus
          path: consensus.txt

  notarize:
    needs: vote
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: consensus

      - name: Cross-repo notarization
        run: |
          CONS=$(cat consensus.txt)
          echo "{\"notarizedHash\":\"$CONS\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > notarization.json

      - uses: actions/upload-artifact@v4
        with:
          name: notarization
          path: notarization.json

  evolve:
    needs: notarize
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: npm install
      - run: npm run evolve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Prepare publication gate directory
        run: |
          mkdir -p core-scientific/publication-gate
        
      - name: Merge reports deterministically (flattened)
        run: |
          echo "Collecting report.json files..."
          REPORT_FILES=$(find reports -type f -name "report.json" | sort)

          if [ -z "$REPORT_FILES" ]; then
            echo "No report.json files found."
            exit 1
          fi

          echo "Merging reports with flattening..."

          jq -s '
            map(
              if type=="array" then .[] else . end
            )
            | sort_by(.region)
          ' $REPORT_FILES > core-scientific/publication-gate/aggregated-report.json
          
      - name: Compute deterministic hash
        run: |
          HASH=$(sha256sum core-scientific/publication-gate/aggregated-report.json | awk '{print $1}')
          echo $HASH > core-scientific/publication-gate/aggregated-report.sha256

          echo "Deterministic hash: $HASH"
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run evolve
