name: Immutable Release Lock

on:
  workflow_run:
    workflows: ["validate"]
    types:
      - completed

jobs:
  lock:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - run: npm run freeze

      - name: Commit release file
        run: |
          git config user.name "maximal-one-bot"
          git config user.email "bot@maximal-one.local"
          git add core-scientific/release-lock/release-*.json
          git commit -m "chore: immutable release lock"
          git push
