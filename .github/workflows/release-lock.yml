name: Immutable Release Lock

on:
  workflow_run:
    workflows: ["Validate Scientific Integrity"]
    types:
      - completed

jobs:
  release-lock:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Recompute scientific state
        run: npm run validate

      - name: Extract deterministic hash
        id: extract_hash
        run: |
          HASH=$(node -e "console.log(require('./core-scientific/publication-gate/report.json').deterministicArtifactHash)")
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          TAG="v1.0.0-${{ steps.extract_hash.outputs.hash }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag $TAG
          git push origin $TAG
