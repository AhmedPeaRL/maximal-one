name: Immutable Release Lock

on:
  workflow_run:
    workflows: ["Deterministic Scientific Mesh"]
    types:
      - completed

jobs:
  release-lock:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.20.8

      - name: Install dependencies
        run: npm install

      - name: Recompute scientific state
        run: npm run validate

      - name: Extract deterministic hash
        id: extract_hash
        run: |
          HASH=$(node -e "console.log(require('./core-scientific/publication-gate/report.json').deterministicArtifactHash)")
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="v1.0.0-${{ steps.extract_hash.outputs.hash }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="v1.0.0-${{ steps.extract_hash.outputs.hash }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag $TAG
          git push origin $TAG
          
      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ steps.extract_hash.outputs.hash }}
          name: Scientific Snapshot ${{ steps.extract_hash.outputs.hash }}
          body: |
            Deterministic scientific snapshot.
            Hash: ${{ steps.extract_hash.outputs.hash }}
            Generated automatically after integrity validation.
