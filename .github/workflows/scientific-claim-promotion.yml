name: Scientific Claim Promotion Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-promotion:
    name: Claim Promotion Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout exact repository state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 18.20.8
          cache: npm

      - name: Enforce deterministic environment
        shell: bash
        run: |
          set -euo pipefail

          echo "PYTHONHASHSEED=42" >> "$GITHUB_ENV"

          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"

          echo "MKL_DYNAMIC=FALSE" >> "$GITHUB_ENV"
          echo "OMP_DYNAMIC=FALSE" >> "$GITHUB_ENV"
          echo "VECLIB_MAXIMUM_THREADS=1" >> "$GITHUB_ENV"
          echo "BLIS_NUM_THREADS=1" >> "$GITHUB_ENV"

          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install immutable locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

          python -m pip install \
            --require-hashes \
            -r requirements-lock.txt

          python - <<'PY'
          import numpy
          import scipy
          import pandas
          import statsmodels

          expected = {
              "numpy": "1.26.4",
              "scipy": "1.11.4",
              "pandas": "2.2.2",
              "statsmodels": "0.14.1",
          }

          actual = {
              "numpy": numpy.__version__,
              "scipy": scipy.__version__,
              "pandas": pandas.__version__,
              "statsmodels": statsmodels.__version__,
          }

          print("Installed scientific stack:")
          for name, version in actual.items():
              print(f"{name}=={version}")

          for name, required in expected.items():
              if actual[name] != required:
                  raise SystemExit(
                      f"❌ {name} version mismatch: "
                      f"expected {required}, got {actual[name]}"
                  )

          print("✅ Immutable scientific environment verified.")
          PY

      - name: Verify repository commit identity
        shell: bash
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"

          test "$actual_head" = "$GITHUB_SHA"

          echo "Verified workflow commit:"
          echo "$actual_head"

      - name: Validate repository JSON integrity
        shell: bash
        run: |
          set -euo pipefail

          python analysis/json_integrity_guard.py

      - name: Regenerate canonical report from this exact checkout
        shell: bash
        run: |
          set -euo pipefail

          python -m scripts.prepare_canonical_inputs

          python -m scripts.generate_report --seed 42 --canonical

      - name: Verify report identity semantics
        shell: bash
        run: |
          set -euo pipefail
          python analysis/verify_report_identity.py

      - name: Validate canonical report internal consistency
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_canonical_report.py

      - name: Verify stochastic null identity contract
        shell: bash
        run: |
          set -euo pipefail

          python tests/test_null_identity_contract.py

      - name: Run Solar Periodicity Nuisance Audit
        shell: bash
        run: |
          set -euo pipefail

          python -m analysis.solar_periodicity_nuisance_audit

          test -s \
            artifacts/solar_periodicity_nuisance_audit.json

      - name: Verify Solar Periodicity Nuisance Audit
        shell: bash
        run: |
          set -euo pipefail

          python -m analysis.verify_solar_periodicity_nuisance_audit

      - name: Run estimator sensitivity audit
        shell: bash
        run: |
          set -euo pipefail

          python analysis/estimator_sensitivity_audit.py

          test -s \
            artifacts/estimator_sensitivity_audit.json

      - name: Upload estimator sensitivity audit
        uses: actions/upload-artifact@v4
        with:
          name: estimator-sensitivity-audit
          path: artifacts/estimator_sensitivity_audit.json
          if-no-files-found: error

      - name: Verify public scientific report is canonical
        shell: bash
        run: |
          set -euo pipefail

          python scripts/generate_public_scientific_report.py
          python scripts/generate_public_scientific_report.py --check

      - name: Verify null adequacy threshold registry
        shell: bash
        run: |
          set -euo pipefail

          python analysis/verify_null_adequacy_threshold_registry.py

      - name: Run null calibration gate
        shell: bash
        run: |
          set -euo pipefail

          python analysis/null_calibration_gate.py

          test -s \
            artifacts/null_calibration_gate.json

      - name: Upload run null calibration gate
        uses: actions/upload-artifact@v4
        with:
          name: null-calibration-gate
          path: artifacts/null_calibration_gate.json
          if-no-files-found: error

      - name: Verify replication inventory consistency
        shell: bash
        run: |
          set -euo pipefail
          python -m analysis.verify_replication_inventory

      - name: Dataset eligibility gate
        shell: bash
        run: |
          set -euo pipefail

          python analysis/dataset_eligibility_gate.py

          test -s \
            artifacts/dataset_eligibility_gate.json

      - name: Upload dataset eligibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset-eligibility-gate
          path: artifacts/dataset_eligibility_gate.json
          if-no-files-found: error

      - name: Enforce dataset eligibility contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/dataset_eligibility_gate.json")

          if not path.is_file():
              raise SystemExit(
                  "ERROR: Dataset eligibility artifact is missing."
              )

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          required = int(data["minimum_replication_domains"])
          available = int(data["eligible_replication_domain_count"])
          domains = data.get("domains", [])

          print("=== REPLICATION ELIGIBILITY DIAGNOSTICS ===")
          print(f"Eligible independent replication domains: {available}/{required}")
          print(f"Gate status: {data.get('status', 'UNKNOWN')}")

          for item in domains:
              name = item.get("name", "UNKNOWN")
              rows = item.get("series_length", item.get("rows", "UNKNOWN"))
              measurement = item.get(
                  "eligible_for_measurement",
                  item.get("measurement_valid", False),
              )
              replication = item.get(
                  "eligible_for_replication",
                  item.get("replication_eligible", False),
              )
              provenance = item.get(
                  "provenance_replication_eligible",
                  False,
              )

              reasons = []

              for key in (
                  "reason",
                  "replication_exclusion_reason",
                  "provenance_exclusion_reason",
              ):
                  value = item.get(key)
                  if isinstance(value, str) and value:
                      reasons.append(value)

              review = item.get("provenance_review", {})
              if isinstance(review, dict):
                  review_reason = review.get("reason")
                  if isinstance(review_reason, str) and review_reason:
                      reasons.append(review_reason)

              print(
                  f"- {name}: rows={rows}; "
                  f"measurement={measurement}; "
                  f"replication={replication}; "
                  f"provenance={provenance}"
              )

              for reason in dict.fromkeys(reasons):
                  print(f"    reason: {reason}")

          if available < required:
              print(
                  "BLOCKED: scientific replication eligibility "
                  "has not been established."
              )
              raise SystemExit(1)

          print("Dataset eligibility contract satisfied.")
          PY

      - name: Permutation determinism audit
        shell: bash
        run: |
          set -euo pipefail

          python analysis/permutation_determinism_audit.py

          test -s \
            artifacts/permutation_determinism_audit.json

      - name: Upload permutation determinism artifact
        uses: actions/upload-artifact@v4
        with:
          name: permutation-determinism-audit
          path: artifacts/permutation_determinism_audit.json
          if-no-files-found: error

      - name: Run independent domain replication gate
        shell: bash
        run: |
          set -euo pipefail

          python analysis/independent_domain_replication_gate.py

          test -s \
            artifacts/independent_domain_replication_gate.json

      - name: Upload run independent domain replication gate
        uses: actions/upload-artifact@v4
        with:
          name: independent-domain-replication-gate
          path: artifacts/independent_domain_replication_gate.json
          if-no-files-found: error

      - name: Generate adversarial control evidence
        shell: bash
        run: |
          set -euo pipefail

          python analysis/adversarial_control.py

          test -s \
            artifacts/adversarial_control.json

      - name: Run clean-checkout computational reproduction
        shell: bash
        run: |
          set -euo pipefail

          python analysis/true_independent_reproduction.py

          test -s \
            artifacts/external_replay_verification.json

      - name: Validate external replay evidence
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_external_replay.py

      - name: Generate final claim readiness audit
        shell: bash
        run: |
          set -euo pipefail

          python analysis/claim_readiness_audit.py

          test -s \
            artifacts/claim_readiness_audit.json

      - name: Upload final claim readiness audit
        uses: actions/upload-artifact@v4
        with:
          name: claim-readiness-audit
          path: artifacts/claim_readiness_audit.json
          if-no-files-found: error

      - name: Re-evaluate promotion prerequisites
        shell: bash
        run: |
          set -euo pipefail

          node core-scientific/evaluate_scientific_contract.cjs

      - name: Enforce scientific claim promotion
        shell: bash
        run: |
          set -euo pipefail

          node core-scientific/enforce_strict.cjs

      - name: Promotion summary
        shell: bash
        run: |
          echo
          echo "============================================"
          echo "SCIENTIFIC CLAIM PROMOTION GATE PASSED"
          echo "============================================"
          echo
          echo "Only declared machine-gated promotion"
          echo "conditions passed."
          echo
          echo "This does not establish causality,"
          echo "universality, consciousness,"
          echo "HCM validity, or market advantage."
