name: Scientific Claim Promotion Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim-promotion:
    name: Claim Promotion Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:

      - name: Checkout exact repository state
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 18.20.8
          cache: npm

      - name: Enforce deterministic environment
        shell: bash
        run: |
          set -euo pipefail

          echo "PYTHONHASHSEED=42" >> "$GITHUB_ENV"

          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"

          echo "MKL_DYNAMIC=FALSE" >> "$GITHUB_ENV"
          echo "OMP_DYNAMIC=FALSE" >> "$GITHUB_ENV"
          echo "VECLIB_MAXIMUM_THREADS=1" >> "$GITHUB_ENV"
          echo "BLIS_NUM_THREADS=1" >> "$GITHUB_ENV"

          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            --require-hashes \
            -r requirements-lock.txt

      - name: Verify repository commit identity
        shell: bash
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"

          test "$actual_head" = "$GITHUB_SHA"

          echo "Verified workflow commit:"
          echo "$actual_head"

      - name: Regenerate canonical report from this exact checkout
        shell: bash
        run: |
          set -euo pipefail

          python scripts/prepare_canonical_inputs.py

          python scripts/generate_report.py \
            --seed 42 \
            --canonical

      - name: Validate canonical report internal consistency
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_canonical_report.py

      - name: Run estimator sensitivity audit
        shell: bash
        run: |
          set -euo pipefail

          python analysis/estimator_sensitivity_audit.py

          test -s \
            artifacts/estimator_sensitivity_audit.json

      - name: Run null calibration gate
        shell: bash
        run: |
          set -euo pipefail

          python analysis/null_calibration_gate.py

          test -s \
            artifacts/null_calibration_gate.json

      - name: Run independent domain replication gate
        shell: bash
        run: |
          set -euo pipefail

          python analysis/independent_domain_replication_gate.py

          test -s \
            artifacts/independent_domain_replication_gate.json

      - name: Generate adversarial control evidence
        shell: bash
        run: |
          set -euo pipefail

          python analysis/adversarial_control.py

          test -s \
            artifacts/adversarial_control.json

      - name: Run clean-checkout computational reproduction
        shell: bash
        run: |
          set -euo pipefail

          python analysis/true_independent_reproduction.py

          test -s \
            artifacts/external_replay_verification.json

      - name: Validate external replay evidence
        shell: bash
        run: |
          set -euo pipefail

          python scripts/validate_external_replay.py

      - name: Generate final claim readiness audit
        shell: bash
        run: |
          set -euo pipefail

          python analysis/claim_readiness_audit.py

          test -s \
            artifacts/claim_readiness_audit.json

      - name: Upload final claim readiness audit
        uses: actions/upload-artifact@v4
        with:
          name: claim-readiness-audit
          path: artifacts/claim_readiness_audit.json
          if-no-files-found: error

      - name: Re-evaluate promotion prerequisites
        shell: bash
        run: |
          set -euo pipefail

          node core-scientific/evaluate_scientific_contract.cjs

      - name: Enforce scientific claim promotion
        shell: bash
        run: |
          set -euo pipefail

          node core-scientific/enforce_strict.cjs

      - name: Promotion summary
        shell: bash
        run: |
          echo
          echo "============================================"
          echo "SCIENTIFIC CLAIM PROMOTION GATE PASSED"
          echo "============================================"
          echo
          echo "Only declared machine-gated promotion"
          echo "conditions passed."
          echo
          echo "This does not establish causality,"
          echo "universality, consciousness,"
          echo "HCM validity, or market advantage."
