name: Witness Proxy

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Witness payload (JSON)"
        required: true
        type: string

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create witness issue
        uses: actions/github-script@v7
        env:
          WITNESS_PAYLOAD: ${{ inputs.payload }}
        with:
          github-token: ${{ secrets.WITNESS_TOKEN }}
          script: |
            let payload;
            let raw = process.env.WITNESS_PAYLOAD;

            try {
              payload = JSON.parse(raw);
            } catch (e) {
              payload = {
                timestamp: new Date().toISOString(),
                origin: "maximal-one",
                error: "Invalid JSON payload",
                raw: raw
              };
            }

            const body =
              "**timestamp:** " + payload.timestamp + "\n\n" +
              "**origin:** maximal-one\n\n" +
              (payload.signal
                ? "**signal:**\n```json\n" +
                  JSON.stringify(payload.signal, null, 2) +
                  "\n```"
                : "**error:** Invalid or non-JSON payload received.");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "witness",
              body: body
            });
