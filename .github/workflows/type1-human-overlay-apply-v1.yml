name: Type-I Human Overlay Apply V1 (Artifact Only)

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Reviewed CSV committed under adjudication/incoming/"
        required: true
        type: string
        default: adjudication/incoming/first-three-occurrences.csv
      previous_ledger_run_id:
        description: "Optional prior successful overlay workflow run ID"
        required: false
        type: string
        default: ""
      previous_ledger_artifact_name:
        description: "Optional prior merged-ledger artifact name"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: read

concurrency:
  group: type1-human-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-human-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CSV_PATH: ${{ inputs.csv_path }}
      TARGET_COMMIT: ad106dddd2b6c9a57c90bd5bdd9f4530fe7ac876
      INVENTORY_SHA256: beb593b7adfba333750e27a361dbb6b7daa0c58ca910cd0930e71b081a3ba805
      TARGET_LEDGER_SHA256: ad8d9350c6598b9c202512eadd56a4e97d5ff8c91799f66c5a08dffa7a8e88ce
      MAIN_COMMIT: 484b6b0a49deb175cc604cab7508c36d23882c71
    steps:
      - name: Checkout the selected review-branch implementation
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require review branch and exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$CSV_PATH" in
            adjudication/incoming/*.csv) ;;
            *) echo "BLOCKED: csv_path must be under adjudication/incoming/" >&2; exit 1 ;;
          esac
          test -f "$CSV_PATH"

      - name: Download the verified target inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: type1-v3-v4-governance-inventory-42819437836-1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42819437836
          path: artifacts/input/inventory

      - name: Download the verified exact-target snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: type1-exact-review-snapshot-42819776911-1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42819776911
          path: artifacts/input/snapshot

      - name: Verify inventory, snapshot, and population identities
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts/input/inventory && sha256sum -c SHA256SUMS.txt)
          (cd artifacts/input/snapshot && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/input")
          pop = json.loads(Path("protocol/TYPE1_AD106_POPULATION_REGISTER_V1.json").read_text())
          prov = json.loads((root / "inventory/type1_governance_inventory/provenance.json").read_text())
          inv_path = root / "inventory/type1_governance_inventory/reference_inventory.json"
          ledger_path = root / "inventory/type1_occurrence_ledger/occurrence_level_manual_ledger.json"
          target_rec = json.loads((root / "inventory/type1_occurrence_ledger/reconciliation.json").read_text())
          main_rec = json.loads((root / "inventory/type1_occurrence_ledger/main_reconciliation.json").read_text())
          cert = json.loads((root / "snapshot/three_way_identity_certificate.json").read_text())
          extraction = json.loads((root / "snapshot/self_contained/extraction_verification.json").read_text())
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = pop["target"]["commit"]
          assert prov["target_commit"] == expected
          assert prov["inventory_source_commit"] == expected
          assert prov["main_commit"] == pop["main_comparison"]["commit"]
          assert prov["inventory_sha256"] == pop["inventory"]["reference_inventory_sha256"]
          assert prov["workflow_definition_commit"] == pop["inventory"]["workflow_definition_commit"]
          assert sha(inv_path) == prov["inventory_sha256"]
          assert sha(ledger_path) == pop["inventory"]["target_ledger_sha256"]
          ledger = json.loads(ledger_path.read_text())
          assert ledger["inventory_commit"] == expected
          assert ledger["inventory_ref"] == "refs/audit/target"
          assert ledger["inventory_sha256"] == prov["inventory_sha256"]
          assert ledger["occurrence_count"] == 1800
          assert prov["workflow_run_id"] == pop["inventory"]["workflow_run_id"]
          assert target_rec["status"] == "RECONCILED" and target_rec["observed_occurrence_count"] == 1800
          assert main_rec["status"] == "RECONCILED" and main_rec["observed_occurrence_count"] == 697
          assert cert["target_commit"] == expected
          assert cert["snapshot_review_commit"] == expected
          assert cert["inventory_json_sha256"] == prov["inventory_sha256"]
          assert cert["inventory_workflow_run_id"] == pop["inventory"]["workflow_run_id"]
          assert cert["snapshot_workflow_run_id"] == pop["snapshot"]["workflow_run_id"]
          assert cert["inventory_workflow_definition_commit"] == pop["inventory"]["workflow_definition_commit"]
          assert cert["snapshot_workflow_definition_commit"] == pop["snapshot"]["workflow_definition_commit"]
          assert cert["present_file_count"] == cert["selected_file_count"] == 289
          assert cert["missing_scope_paths"] == [] and cert["missing_required_paths"] == []
          assert cert["manual_adjudication_overlay_records"] == 0
          assert extraction["verified"] is True and extraction["errors"] == []
          assert pop["authority_invariants"]["protocol_freeze"] == "NOT_FROZEN"
          print("AD106_POPULATION_IDENTITY_VERIFIED; AUTHORITY=NONE")
          PY

      - name: Download prior merged ledger when chaining a batch
        if: ${{ inputs.previous_ledger_run_id != '' && inputs.previous_ledger_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous_ledger_artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.previous_ledger_run_id }}
          path: artifacts/input/previous

      - name: Select and verify the source ledger
        shell: bash
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_ledger_run_id }}
          PREVIOUS_ARTIFACT_NAME: ${{ inputs.previous_ledger_artifact_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/work artifacts/output
          if [[ -n "$PREVIOUS_RUN_ID" || -n "$PREVIOUS_ARTIFACT_NAME" ]]; then
            test -n "$PREVIOUS_RUN_ID"
            test -n "$PREVIOUS_ARTIFACT_NAME"
            test -f artifacts/input/previous/merged_occurrence_level_manual_ledger.json
            test -f artifacts/input/previous/provenance.json
            python - <<'PY'
          import hashlib, json
          from pathlib import Path
          d = Path("artifacts/input/previous")
          ledger = d / "merged_occurrence_level_manual_ledger.json"
          prov = json.loads((d / "provenance.json").read_text())
          digest = hashlib.sha256(ledger.read_bytes()).hexdigest()
          assert prov["schema"] == "HCM_TYPE1_HUMAN_OVERLAY_ARTIFACT_PROVENANCE_V1"
          assert prov["workflow_run_id"] == __import__("os").environ["PREVIOUS_RUN_ID"]
          assert __import__("os").environ["PREVIOUS_ARTIFACT_NAME"] == f"type1-human-overlay-merged-{__import__('os').environ['PREVIOUS_RUN_ID']}"
          assert prov["target_commit"] == "ad106dddd2b6c9a57c90bd5bdd9f4530fe7ac876"
          assert prov["inventory_sha256"] == "beb593b7adfba333750e27a361dbb6b7daa0c58ca910cd0930e71b081a3ba805"
          assert prov["authority"] == "NONE"
          assert prov["merged_ledger_sha256"] == digest
          print("PRIOR_MERGED_LEDGER_IDENTITY_VERIFIED")
          PY
            cp artifacts/input/previous/merged_occurrence_level_manual_ledger.json artifacts/work/source_ledger.json
            cp artifacts/input/previous/provenance.json artifacts/work/parent_provenance.json
          else
            cp artifacts/input/inventory/type1_occurrence_ledger/occurrence_level_manual_ledger.json artifacts/work/source_ledger.json
            printf '{"parent":"BASELINE_LEDGER","authority":"NONE"}\n' > artifacts/work/parent_provenance.json
          fi
          echo "BASE_LEDGER=artifacts/work/source_ledger.json" >> "$GITHUB_ENV"

      - name: Install the pinned JSON Schema validator
        shell: bash
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Convert human CSV to a JSON overlay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/csv_to_type1_overlay_v3.py \
            --csv "$CSV_PATH" \
            --output artifacts/work/overlay.json

      - name: Validate overlay schema and exact population binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("protocol/TYPE1_OCCURRENCE_MANUAL_ADJUDICATION_OVERLAY_V3.schema.json").read_text())
          overlay = json.loads(Path("artifacts/work/overlay.json").read_text())
          errors = list(Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(overlay))
          if errors:
              raise SystemExit("Overlay schema invalid: " + "; ".join(e.message for e in errors[:5]))
          assert overlay["review_commit_sha"] == "ad106dddd2b6c9a57c90bd5bdd9f4530fe7ac876"
          assert overlay["inventory_ref"] == "refs/audit/target"
          assert overlay["inventory_sha256"] == "beb593b7adfba333750e27a361dbb6b7daa0c58ca910cd0930e71b081a3ba805"
          assert len(overlay["records"]) > 0, "No ADJUDICATED CSV rows; PENDING rows are intentionally not imported."
          print(f"OVERLAY_SCHEMA_VALID records={len(overlay['records'])}")
          PY

      - name: Merge overlay without changing untouched records
        shell: bash
        run: |
          set -euo pipefail
          python scripts/merge_type1_manual_adjudication_overlay_v3.py \
            --inventory artifacts/input/inventory/type1_governance_inventory/reference_inventory.json \
            --ledger "$BASE_LEDGER" \
            --overlay artifacts/work/overlay.json \
            --output artifacts/output/merged_occurrence_level_manual_ledger.json

      - name: Verify untouched rows, record identity, and non-authority invariants
        shell: bash
        env:
          PREVIOUS_RUN_ID: ${{ inputs.previous_ledger_run_id }}
          PREVIOUS_ARTIFACT_NAME: ${{ inputs.previous_ledger_artifact_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          base = json.loads(Path(os.environ["BASE_LEDGER"]).read_text())
          merged_path = Path("artifacts/output/merged_occurrence_level_manual_ledger.json")
          merged = json.loads(merged_path.read_text())
          overlay = json.loads(Path("artifacts/work/overlay.json").read_text())
          base_by_id = {r["occurrence_id"]: r for r in base["records"]}
          merged_by_id = {r["occurrence_id"]: r for r in merged["records"]}
          overlay_ids = {r["occurrence_id"] for r in overlay["records"]}
          assert len(base_by_id) == len(base["records"])
          assert len(merged_by_id) == len(merged["records"])
          assert set(base_by_id) == set(merged_by_id)
          assert overlay_ids <= set(base_by_id)
          untouched = set(base_by_id) - overlay_ids
          changed_untouched = [oid for oid in untouched if base_by_id[oid] != merged_by_id[oid]]
          assert not changed_untouched, f"Untouched records changed: {changed_untouched[:5]}"
          assert merged["inventory_commit"] == "ad106dddd2b6c9a57c90bd5bdd9f4530fe7ac876"
          assert merged["inventory_sha256"] == "beb593b7adfba333750e27a361dbb6b7daa0c58ca910cd0930e71b081a3ba805"
          assert merged["protocol_freeze"] == "NOT_FROZEN"
          for key in ("formal_calibration_authorized", "confirmatory_execution_authorized", "claim_support", "promotion_authority"):
              assert merged[key] is False, key
          verification = {
              "schema": "HCM_TYPE1_HUMAN_OVERLAY_VERIFICATION_V1",
              "status": "VERIFIED_ARTIFACT_ONLY_NO_AUTHORITY",
              "target_commit": merged["inventory_commit"],
              "inventory_sha256": merged["inventory_sha256"],
              "source_record_count": len(base_by_id),
              "merged_record_count": len(merged_by_id),
              "overlay_record_count": len(overlay_ids),
              "untouched_record_count": len(untouched),
              "untouched_records_identical": True,
              "record_id_set_identical": True,
              "formal_calibration_authorized": False,
              "confirmatory_execution_authorized": False,
              "claim_support": False,
              "promotion_authority": False
          }
          Path("artifacts/output/verification.json").write_text(json.dumps(verification, indent=2) + "\n")
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          parent_path = Path("artifacts/work/parent_provenance.json")
          parent = json.loads(parent_path.read_text())
          provenance = {
              "schema": "HCM_TYPE1_HUMAN_OVERLAY_ARTIFACT_PROVENANCE_V1",
              "target_commit": merged["inventory_commit"],
              "inventory_sha256": merged["inventory_sha256"],
              "baseline_source_ledger_sha256": "ad8d9350c6598b9c202512eadd56a4e97d5ff8c91799f66c5a08dffa7a8e88ce",
              "parent_ledger_sha256": sha(Path(os.environ["BASE_LEDGER"])),
              "parent_provenance_sha256": sha(parent_path),
              "parent_run_id": os.environ.get("PREVIOUS_RUN_ID") or None,
              "parent_artifact_name": os.environ.get("PREVIOUS_ARTIFACT_NAME") or None,
              "csv_sha256": sha(Path(os.environ["CSV_PATH"])),
              "overlay_sha256": sha(Path("artifacts/work/overlay.json")),
              "merged_ledger_sha256": sha(merged_path),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_job": os.environ["GITHUB_JOB"],
              "implementation_commit": os.environ["GITHUB_SHA"],
              "authority": "NONE",
              "protocol_freeze": "NOT_FROZEN",
              "formal_calibration_authorized": False,
              "confirmatory_execution_authorized": False,
              "claim_support": False,
              "promotion_authority": False
          }
          Path("artifacts/output/provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          print("UNTOUCHED_RECORDS_IDENTICAL; IDENTITY_PRESERVED; AUTHORITY=NONE")
          PY

      - name: Upload merged ledger, overlay, verification, and provenance
        uses: actions/upload-artifact@v4
        with:
          name: type1-human-overlay-merged-${{ github.run_id }}
          path: |
            artifacts/output/merged_occurrence_level_manual_ledger.json
            artifacts/output/verification.json
            artifacts/output/provenance.json
            artifacts/work/overlay.json
            artifacts/work/parent_provenance.json
          if-no-files-found: error
          retention-days: 90
