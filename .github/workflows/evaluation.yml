name: Evaluation Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Run Adaptive Threshold
        run: |
          python scripts/adaptive_threshold.py 0.923

      - name: Run Lyapunov Monitor
        run: |
          python scripts/lyapunov_monitor.py
