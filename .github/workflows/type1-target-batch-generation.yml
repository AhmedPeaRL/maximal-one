name: Type-I Target Batch Generation Validation (Current Inventory)

on:
  workflow_dispatch:
  push:
    branches:
      - review/type1-v4-remediation
    paths:
      - 'adjudication/generate_target_batches.py'
      - 'tests/test_type1_target_batch_generation.py'
      - 'protocol/TYPE1_AD106_POPULATION_REGISTER_V1.json'
      - '.github/workflows/type1-target-batch-generation.yml'

permissions:
  actions: read
  contents: read

jobs:
  validate-and-generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify review branch and checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download the current target inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: type1-v3-v4-governance-inventory-42870936071-1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42870936071
          path: artifacts/input/inventory

      - name: Verify inventory checksums and population identity
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts/input/inventory && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          pop = json.loads(Path("protocol/TYPE1_AD106_POPULATION_REGISTER_V1.json").read_text())
          root = Path("artifacts/input/inventory")
          prov = json.loads((root / "type1_governance_inventory/provenance.json").read_text())
          inv = root / "type1_governance_inventory/reference_inventory.json"
          ledger = root / "type1_occurrence_ledger/occurrence_level_manual_ledger.json"
          main_ledger = root / "type1_occurrence_ledger/main_occurrence_level_manual_ledger.json"
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert prov["workflow_run_id"] == pop["inventory"]["workflow_run_id"]
          assert prov["target_commit"] == pop["target"]["commit"]
          assert prov["main_commit"] == pop["main_comparison"]["commit"]
          assert sha(inv) == pop["inventory"]["reference_inventory_sha256"]
          assert sha(ledger) == pop["inventory"]["target_ledger_sha256"]
          assert sha(main_ledger) == pop["inventory"]["main_ledger_sha256"]
          assert prov["workflow_definition_commit"] == pop["inventory"]["workflow_definition_commit"]
          target = json.loads(ledger.read_text())
          main = json.loads(main_ledger.read_text())
          assert target["occurrence_count"] == pop["target"]["occurrence_count"] == 1800
          assert len(target["records"]) == 1800
          assert main["occurrence_count"] == pop["main_comparison"]["occurrence_count"] == 711
          assert len(main["records"]) == 711
          print("CURRENT_TARGET_INVENTORY_VERIFIED; AUTHORITY=NONE")
          PY

      - name: Compile generator and tests
        run: python -m py_compile adjudication/generate_target_batches.py tests/test_type1_target_batch_generation.py

      - name: Run batch generator tests
        run: python -m unittest -v tests.test_type1_target_batch_generation

      - name: Generate batches from the downloaded current ledger
        run: |
          set -euo pipefail
          python adjudication/generate_target_batches.py \
            --ledger artifacts/input/inventory/type1_occurrence_ledger/occurrence_level_manual_ledger.json \
            --population-register protocol/TYPE1_AD106_POPULATION_REGISTER_V1.json \
            --output artifacts/output/target_1800_batches

      - name: Verify exact batch coverage and non-authority invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("artifacts/output/target_1800_batches")
          register = json.loads((root / "BATCH_SET_REGISTER.json").read_text())
          ledger = json.loads(Path("artifacts/input/inventory/type1_occurrence_ledger/occurrence_level_manual_ledger.json").read_text())
          files = sorted(root.glob("BATCH_[0-9][0-9][0-9].json"))
          assert len(files) == 72
          assert register["status"] == "NAVIGATION_ONLY_NOT_ADJUDICATED"
          assert register["authority"] == "NONE"
          assert register["inventory_sha256"] == ledger["inventory_sha256"]
          assert register["source_ledger_sha256"] == hashlib.sha256(Path("artifacts/input/inventory/type1_occurrence_ledger/occurrence_level_manual_ledger.json").read_bytes()).hexdigest()
          observed = []
          for path in files:
              batch = json.loads(path.read_text())
              assert batch["authority"] == "NONE"
              assert batch["protocol_freeze"] == "NOT_FROZEN"
              assert batch["status"] == "NAVIGATION_ONLY_NOT_ADJUDICATED"
              assert batch["count"] == 25
              for field in ("formal_calibration_authorized", "confirmatory_execution_authorized", "claim_support", "promotion_authority"):
                  assert batch[field] is False
              entry = next(x for x in register["batches"] if x["file"] == path.name)
              assert entry["sha256"] == hashlib.sha256(path.read_bytes()).hexdigest()
              observed.extend(batch["occurrence_ids"])
          expected = [row["occurrence_id"] for row in ledger["records"]]
          assert observed == expected
          assert len(observed) == len(set(observed)) == 1800
          assert all(row["manual_classification"] == "UNKNOWN" and row["status"] == "OPEN" and row["reviewer_disposition"] == "PENDING" for row in ledger["records"])
          print("BATCH_SET_VERIFIED; 72 x 25 = 1800; all records remain OPEN/UNKNOWN/PENDING; AUTHORITY=NONE")
          PY

      - name: Upload current navigation-only batch set
        uses: actions/upload-artifact@v4
        with:
          name: type1-target-1800-batches-current-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/output/target_1800_batches/
          if-no-files-found: error
          retention-days: 90
