name: Tag Signature Verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag signature
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          git tag -v "$TAG"
