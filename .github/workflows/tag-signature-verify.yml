name: Tag Signature Verification

on:
  push:
    tags:
      - "v*"

jobs:
  verify-tag:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag signature
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          git tag -v "$TAG"
