name: Type-I V3 Manual Adjudication Governance

on:
  push:
    branches:
      - review/type1-v4-remediation
    paths:
      - "protocol/TYPE1_OCCURRENCE_MANUAL_ADJUDICATION_OVERLAY_V3.schema.json"
      - "protocol/TYPE1_MANUAL_OCCURRENCE_ADJUDICATION_PROTOCOL_V3.md"
      - "protocol/EVIDENCE_REGISTER_V3.json"
      - "scripts/merge_type1_manual_adjudication_overlay_v3.py"
      - "scripts/csv_to_type1_overlay_v3.py"
      - "tests/test_type1_manual_adjudication_overlay_v3.py"
      - "tests/test_type1_evidence_register_v3.py"
      - "protocol/TYPE1_BATCH_REGISTER_V3_B001.json"
      - ".github/workflows/type1-manual-adjudication-v3.yml"
      - ".github/workflows/type1-v3-governance-implementation-snapshot.yml"
  pull_request:
    branches:
      - review/type1-v4-remediation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0

      - name: Compile V3 implementation and tests
        run: |
          python -m py_compile \
            scripts/merge_type1_manual_adjudication_overlay_v3.py \
            scripts/csv_to_type1_overlay_v3.py \
            tests/test_type1_manual_adjudication_overlay_v3.py \
            tests/test_type1_evidence_register_v3.py

      - name: Validate JSON files
        run: |
          python -m json.tool protocol/TYPE1_OCCURRENCE_MANUAL_ADJUDICATION_OVERLAY_V3.schema.json > /dev/null
          python -m json.tool protocol/EVIDENCE_REGISTER_V3.json > /dev/null
          python -m json.tool protocol/TYPE1_BATCH_REGISTER_V3_B001.json > /dev/null

      - name: Run schema, integration, acceptance, and rejection tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_type1_*v3.py" \
            -v

      - name: Preserve non-authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          protocol = Path("protocol/TYPE1_MANUAL_OCCURRENCE_ADJUDICATION_PROTOCOL_V3.md").read_text(encoding="utf-8")
          register = json.loads(Path("protocol/EVIDENCE_REGISTER_V3.json").read_text(encoding="utf-8"))
          required = [
              "NOT_FROZEN",
              "formal_calibration_authorized = false",
              "confirmatory_execution_authorized = false",
              "claim_support = false",
              "promotion_authority = false",
          ]
          for item in required:
              if item not in protocol:
                  raise SystemExit(f"Missing protocol safeguard: {item}")
          for key in ("formal_calibration_authorized", "confirmatory_execution_authorized", "claim_support", "promotion_authority"):
              if register.get(key) is not False:
                  raise SystemExit(f"Evidence register authority invariant violated: {key}")
          if register.get("protocol_freeze") != "NOT_FROZEN":
              raise SystemExit("Evidence register protocol_freeze must remain NOT_FROZEN")
          print("V3_NON_AUTHORITY_INVARIANTS_PRESERVED")
          PY
