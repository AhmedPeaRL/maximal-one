name: Reproducible Research Gate

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install numpy scipy sympy
      - run: python tests/run_full_pipeline.py
