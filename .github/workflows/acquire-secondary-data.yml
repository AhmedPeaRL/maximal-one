name: Acquire Secondary Data Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"

      - name: Preserve raw snapshots and create parsed monthly files
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m unittest discover -s tests -p 'test_secondary_acquisition_safety.py' -v
          python analysis/acquire_secondary_domain_snapshots.py
          
      - name: Audit source hashes and monthly time integrity
        shell: bash
        run: |
          set -euo pipefail
          python analysis/audit_secondary_monthly_domains.py
          test -s artifacts/secondary_data_integrity_audit.json

      - name: Upload source snapshots, parsed files, manifest, and audit
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: secondary-source-snapshots-${{ github.run_id }}
          path: |
            real-data/source-snapshots/**
            real-data/hadcet_monthly.csv
            real-data/fred_indpro_monthly.csv
            artifacts/secondary_data_integrity_audit.json
          if-no-files-found: warn
          retention-days: 30
