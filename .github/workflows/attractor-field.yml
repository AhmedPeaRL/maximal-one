name: Attractor Field Scoring

on:
  workflow_run:
    workflows: ["Deterministic Scientific Mesh"]
    types:
      - completed

jobs:
  attractor:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts from triggering run
        uses: actions/download-artifact@v4
        with:
          path: upstream-artifacts
          run-id: ${{ github.event.workflow_run.id }}

      - name: Locate canonical report
        run: |
          REPORT=$(find upstream-artifacts -name "report.json" | head -n 1)
          if [ -z "$REPORT" ]; then
            echo "report.json not found in upstream artifacts."
            exit 1
          fi
          mkdir -p core-scientific/publication-gate
          cp "$REPORT" core-scientific/publication-gate/report.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Compute Attractor Field Score
        run: npm run attractor
