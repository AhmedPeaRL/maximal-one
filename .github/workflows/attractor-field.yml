name: Attractor Field Scoring

on:
  workflow_run:
    workflows: ["Deterministic Scientific Mesh"]
    types:
      - completed

jobs:
  attractor:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download canonical report artifact
        uses: actions/download-artifact@v4
        with:
          name: scientific-report-18
          path: core-scientific/publication-gate

      - name: Verify report existence
        run: |
          if [ ! -f core-scientific/publication-gate/report.json ]; then
            echo "Missing report.json. Upstream validation did not generate artifact."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Compute Attractor Field Score
        run: npm run attractor

      - name: Download all report artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-reports

      - name: Verify multi-runner consensus
        run: |
          FILES=$(find downloaded-reports -name report.json)
          COUNT=$(echo "$FILES" | wc -l)

          if [ "$COUNT" -lt 1 ]; then
            echo "No report artifacts found."
            exit 1
          fi

          HASHES=$(sha256sum $FILES | awk '{print $1}' | sort | uniq | wc -l)

          if [ "$HASHES" -ne 1 ]; then
            echo "Report divergence detected across runners."
            exit 1
          fi

          mkdir -p core-scientific/publication-gate
          cp $(echo "$FILES" | head -n 1) core-scientific/publication-gate/report.json
