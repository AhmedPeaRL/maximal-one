name: Confirmatory Readiness Gate

on:
  push:
    paths:
      - "core-scientific/strict_claim.json"
      - "protocol/FUTURE_NULL_FREEZE_RULE.md"
      - "analysis/verify_confirmatory_readiness.py"
      - ".github/workflows/confirmatory-readiness-gate.yml"

  pull_request:
    paths:
      - "core-scientific/strict_claim.json"
      - "protocol/FUTURE_NULL_FREEZE_RULE.md"
      - "analysis/verify_confirmatory_readiness.py"
      - ".github/workflows/confirmatory-readiness-gate.yml"

jobs:
  epistemic-lock:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set deterministic environment
        shell: bash
        run: |
          set -euo pipefail

          echo "PYTHONHASHSEED=42" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_DYNAMIC=FALSE" >> "$GITHUB_ENV"
          echo "OMP_DYNAMIC=FALSE" >> "$GITHUB_ENV"

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip pip-tools
          pip-compile \
            --output-file=requirements.txt \
            requirements.in

          pip-compile \
            --generate-hashes \
            --output-file=requirements-lock.txt \
            requirements.in

          python -m pip install \
            --require-hashes \
            --dry-run \
            -r requirements-lock.txt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify confirmatory-readiness lock
        shell: bash
        run: |
          set -euo pipefail

          python analysis/verify_confirmatory_readiness.py

      - name: Explicit epistemic status
        shell: bash
        run: |
          set -euo pipefail

          echo "Scientific claim status: UNDER INVESTIGATION"
          echo "Confirmatory promotion: BLOCKED"
          echo "Historical exploratory results: NON-CONFIRMATORY"
          echo "Future null protocol: MUST BE PROSPECTIVELY FROZEN"

      - name: Solar Periodicity Nuisance Audit
        shell: bash
        run: |
          set -euo pipefail

          python -m analysis.solar_periodicity_nuisance_audit

      - name: Verify Solar Periodicity Nuisance Audit
        shell: bash
        run: |
          set -euo pipefail

          python -m analysis.verify_solar_periodicity_nuisance_audit
