name: Confirmatory Readiness Gate

on:
  workflow_dispatch:
  push:
    paths:
      - "core-scientific/strict_claim.json"
      - "protocol/FUTURE_NULL_FREEZE_RULE.md"
      - "analysis/verify_confirmatory_readiness.py"
      - "protocol/SOLAR_PERIODICITY_NUISANCE_FREEZE.md"
      - "protocol/SOLAR_PERIODICITY_NUISANCE_RULE.md"
      - "analysis/solar_periodicity_nuisance_audit.py"
      - "analysis/verify_solar_periodicity_nuisance_audit.py"
      - ".github/workflows/confirmatory-readiness-gate.yml"

  pull_request:
    paths:
      - "core-scientific/strict_claim.json"
      - "protocol/FUTURE_NULL_FREEZE_RULE.md"
      - "analysis/verify_confirmatory_readiness.py"
      - "protocol/SOLAR_PERIODICITY_NUISANCE_FREEZE.md"
      - "protocol/SOLAR_PERIODICITY_NUISANCE_RULE.md"
      - "analysis/solar_periodicity_nuisance_audit.py"
      - "analysis/verify_solar_periodicity_nuisance_audit.py"
      - ".github/workflows/confirmatory-readiness-gate.yml"

permissions:
  contents: read
  
jobs:
  epistemic-lock:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set deterministic environment
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'PYTHONHASHSEED=42' \
            'OMP_NUM_THREADS=1' \
            'MKL_NUM_THREADS=1' \
            'OPENBLAS_NUM_THREADS=1' \
            'NUMEXPR_NUM_THREADS=1' \
            'MKL_DYNAMIC=FALSE' \
            'OMP_DYNAMIC=FALSE' \
            >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"

      - name: Install immutable locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python --version
          python -m pip --version

          python -m pip install \
            --require-hashes \
            -r requirements-lock.txt

          python - <<'PY'
          import numpy
          import scipy
          import pandas
          import statsmodels

          expected = {
              "numpy": "1.26.4",
              "scipy": "1.11.4",
              "pandas": "2.2.2",
              "statsmodels": "0.14.1",
          }

          actual = {
              "numpy": numpy.__version__,
              "scipy": scipy.__version__,
              "pandas": pandas.__version__,
              "statsmodels": statsmodels.__version__,
          }

          for name, version in actual.items():
              print(f"{name}=={version}")

          for name, required in expected.items():
              if actual[name] != required:
                  raise SystemExit(
                      f"❌ {name} version mismatch: "
                      f"expected {required}, got {actual[name]}"
                  )

          print("✅ Immutable scientific environment verified.")
          PY

      - name: Verify confirmatory-readiness lock
        shell: bash
        run: |
          set -euo pipefail

          python analysis/verify_confirmatory_readiness.py

      - name: Explicit epistemic status
        shell: bash
        run: |
          set -euo pipefail

          echo "Scientific claim status: UNDER INVESTIGATION"
          echo "Confirmatory promotion: BLOCKED"
          echo "Historical exploratory results: NON-CONFIRMATORY"
          echo "Future null protocol: MUST BE PROSPECTIVELY FROZEN"

      - name: Solar Periodicity Nuisance Audit
        shell: bash
        run: |
          set -euo pipefail

          python -m analysis.solar_periodicity_nuisance_audit

      - name: Verify Solar Periodicity Nuisance Audit
        shell: bash
        run: |
          set -euo pipefail

          python -m analysis.verify_solar_periodicity_nuisance_audit
