name: Type-I Priority Occurrence Guard and Negative-Gate Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  priority-guard-tests:
    name: Priority execution-path guard verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact review commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify review branch and exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GITHUB_SHA"
          echo "Verified review commit: $ACTUAL"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Run priority occurrence guard and negative-gate tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_type1_runtime_pilot_branch_guard \
            tests.test_type1_cross_runner_workflow_branch_guard \
            tests.test_type1_main_negative_gate \
            tests.test_type1_v4_matrix_gate \
            tests.test_type1_cli_resume_identity_rejections

      - name: Record accurate execution boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "No standalone runtime-pilot workflow was dispatched."
          echo "No cross-runner GitHub Actions workflow was dispatched."
          echo "The CLI resume-identity test creates a bounded --engineering-test checkpoint."
          echo "That test selects replicate indices 0 and 1 from a six-replicate engineering run."
          echo "The engineering test uses n=3328 and 1000 surrogates per selected replicate."
          echo "No formal Type-I calibration was invoked."
          echo "No confirmatory execution was authorized."

      - name: Upload CLI identity-test evidence
        if: always() && hashFiles('artifacts/type1_cli_resume_identity/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: type1-priority-guard-test-evidence-${{ github.run_id }}
          path: artifacts/type1_cli_resume_identity/
          if-no-files-found: warn
          retention-days: 90
