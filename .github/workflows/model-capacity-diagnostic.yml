name: Model Capacity Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"

      - name: Deterministic environment
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "PYTHONHASHSEED=90210" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-lock.txt

      - name: Verify AR order-comparison integrity
        shell: bash
        run: |
          set -euo pipefail
          python analysis/verify_ar_order_comparison.py
          
      - name: Run model-capacity diagnostic
        run: |
          python analysis/model_capacity_diagnostic.py

      - name: Verify diagnostic contract
        run: |
          set -euo pipefail

          test -s artifacts/model_capacity_diagnostic.json

          python - <<'PY'
          import json

          path = "artifacts/model_capacity_diagnostic.json"

          with open(path, encoding="utf-8") as f:
              data = json.load(f)

          if data.get("scientific_role") != "diagnostic_only":
              raise SystemExit(
                  "❌ Model-capacity diagnostic is not diagnostic-only."
              )

          if data.get("claim_support") is not False:
              raise SystemExit(
                  "❌ Model-capacity diagnostic must never support claim promotion."
              )

          if data.get("does_not_change_primary_null") is not True:
              raise SystemExit(
                  "❌ Diagnostic must not silently change the primary null."
              )

          if data.get("preregistered_confirmation") is not False:
              raise SystemExit(
                  "❌ Diagnostic is post-observation and must not be represented as preregistered."
              )

          if data.get("protocol_revision") != (
              "ar_order_comparison_holdback_v1"
          ):
              raise SystemExit(
                  "❌ Unexpected AR order-comparison protocol revision."
              )

          if data.get(
              "historical_boundary_result_invalidated_for_comparison"
          ) is not True:
              raise SystemExit(
                  "❌ Historical boundary results must be invalidated "
                  "until the fixed-hold-back repair is evaluated."
              )

          for result in data.get("results", []):
              for record in result.get("records", []):
                  if record.get("hold_back") != 20:
                      raise SystemExit(
                          "❌ AR diagnostic record does not use "
                          "the declared fixed hold-back."
                      )

          expected_cases = {
              "ar1_phi_0_7",
              "ar2_phi_0_5_0_2",
          }

          actual_cases = {
              item.get("case")
              for item in data.get("results", [])
          }

          if actual_cases != expected_cases:
              raise SystemExit(
                  f"❌ Unexpected diagnostic cases: {actual_cases}"
              )

          review = data.get(
              "model_capacity_review",
              {}
          )

          triggered = review.get(
              "review_triggered"
          )

          if triggered not in (True, False):
              raise SystemExit(
                  "❌ model_capacity_review.review_triggered "
                  "must be explicitly boolean."
              )

          threshold = review.get(
              "boundary_fraction_threshold"
          )

          if threshold != 0.50:
              raise SystemExit(
                  "❌ Unexpected boundary-fraction threshold."
              )

          reasons = review.get(
              "review_reasons",
              []
          )

          if triggered and not reasons:
              raise SystemExit(
                  "❌ Review triggered without reasons."
              )

          if not triggered and reasons:
              raise SystemExit(
                  "❌ Review not triggered but reasons are present."
              )

          print(
              "Boundary-saturation review triggered:",
              triggered
          )

          print(
              "Boundary-fraction threshold:",
              threshold
          )

          if triggered:
              print(
                  "⚠️ Fixed-hold-back repair did not remove "
                  "the declared capacity warning."
              )
          else:
              print(
                  "✅ Fixed-hold-back repair passes the "
                  "model-capacity boundary review."
              )

          print(
              "✅ Model-capacity diagnostic contract verified."
          )
          PY

      - name: Upload diagnostic
        uses: actions/upload-artifact@v6
        with:
          name: model-capacity-diagnostic
          path: artifacts/model_capacity_diagnostic.json
          if-no-files-found: error
