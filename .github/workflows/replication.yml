name: Python 3.11.15 Dependency Refresh (Review Branch)
run-name: "Python 3.11.15 dependency refresh / ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      assurance_only:
        description: "Read-only assurance mode. Keep enabled; disable only after explicit approval for dependency refresh and publishing."
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: python-dependency-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require the isolated review branch
        shell: bash
        env:
          EXPECTED_REF: refs/heads/review/type1-v4-remediation
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$EXPECTED_REF" ]]; then
            echo "This workflow is restricted to the review branch."
            exit 1
          fi

  refresh:
    if: ${{ !inputs.assurance_only }}
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout exact dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11.15"
          cache: pip
          cache-dependency-path: requirements.in

      - name: Verify branch, commit, and Python identity
        shell: bash
        env:
          EXPECTED_REF: refs/heads/review/type1-v4-remediation
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          python - <<'PY'
          import platform
          import sys

          expected = (3, 11, 15)
          actual = sys.version_info[:3]

          print("Python:", platform.python_version())
          print("Implementation:", platform.python_implementation())

          if actual != expected:
              raise SystemExit(
                  f"Expected Python {expected}, got {actual}"
              )
          PY

      - name: Compile a fresh SHA-256 hash lock
        shell: bash
        run: |
          set -euo pipefail

          test -s requirements.in

          python -m venv .compile-venv
          COMPILE_PY="$PWD/.compile-venv/bin/python"

          "$COMPILE_PY" -m pip install \
            --disable-pip-version-check \
            "pip-tools==7.6.2"

          "$COMPILE_PY" -m piptools compile \
            --rebuild \
            --upgrade \
            --generate-hashes \
            --allow-unsafe \
            --resolver=backtracking \
            --output-file=requirements-lock.txt \
            requirements.in

          test -s requirements-lock.txt
          grep -q -- '--hash=sha256:' requirements-lock.txt

      - name: Install the complete lock in a clean environment
        shell: bash
        run: |
          set -euo pipefail

          python -m venv .verify-venv
          VERIFY_PY="$PWD/.verify-venv/bin/python"

          "$VERIFY_PY" -m pip install \
            --disable-pip-version-check \
            --upgrade pip

          "$VERIFY_PY" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r requirements-lock.txt

          "$VERIFY_PY" -m pip check

          "$VERIFY_PY" - <<'PY'
          import certifi
          import cvxpy
          import httplib2
          import idna
          import jsonschema
          import matplotlib
          import mpmath
          import numpy
          import pandas
          import pyarrow
          import psutil
          import requests
          import scs
          import scipy
          import sklearn
          import statsmodels
          import sympy
          import urllib3
          from PIL import Image

          print("All required scientific and security imports passed.")
          PY

          "$VERIFY_PY" -m compileall -q analysis scripts tests

          "$VERIFY_PY" -m unittest discover -s tests -v

          mkdir -p reports
          "$VERIFY_PY" -m pip freeze --all > reports/pip-freeze.txt

      - name: Create dependency verification manifest
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(
                  Path(path).read_bytes()
              ).hexdigest()

          compiler = Path(".compile-venv/bin/python")

          version = subprocess.check_output(
              [str(compiler), "-m", "pip", "show", "pip-tools"],
              text=True
          )

          pip_tools_version = next(
              line.split(":", 1)[1].strip()
              for line in version.splitlines()
              if line.startswith("Version:")
          )

          manifest = {
              "schema": "HCM_PYTHON_LOCK_REFRESH_V1",
              "repository": "AhmedPeaRL/maximal-one",
              "base_commit": os.environ["GITHUB_SHA"],
              "branch": os.environ["GITHUB_REF"],
              "python_version": platform.python_version(),
              "pip_tools_version": pip_tools_version,
              "requirements_in_sha256": sha("requirements.in"),
              "requirements_lock_sha256": sha("requirements-lock.txt"),
              "hash_generation": "SHA256",
              "install_mode": "only-binary + require-hashes",
              "pip_check": "PASS",
              "import_smoke_test": "PASS",
              "compileall": "PASS",
              "unit_tests": "PASS"
          }

          Path("reports/requirements-refresh-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8"
          )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload verified lock and test evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: requirements-lock-${{ github.run_id }}
          path: |
            requirements-lock.txt
            reports/
          if-no-files-found: error
          retention-days: 90

  publish:
    if: ${{ !inputs.assurance_only }}
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    outputs:
      commit_sha: ${{ steps.publish.outputs.commit_sha }}

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          
      - name: Download verified lock artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: requirements-lock-${{ github.run_id }}
          path: generated

      - name: Verify generated lock artifact provenance and hashes
        shell: bash
        env:
          CURRENT_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: refs/heads/review/type1-v4-remediation
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest = json.loads(
              Path("generated/reports/requirements-refresh-manifest.json")
              .read_text(encoding="utf-8")
          )

          if manifest["base_commit"] != os.environ["CURRENT_SHA"]:
              raise SystemExit("BLOCKED: source commit mismatch")

          if manifest["branch"] != os.environ["EXPECTED_BRANCH"]:
              raise SystemExit("BLOCKED: source branch mismatch")

          if manifest["requirements_in_sha256"] != sha("requirements.in"):
              raise SystemExit("BLOCKED: requirements.in changed")

          if manifest["requirements_lock_sha256"] != sha(
              "generated/requirements-lock.txt"
          ):
              raise SystemExit("BLOCKED: lock artifact hash mismatch")

          for key in (
              "pip_check",
              "import_smoke_test",
              "compileall",
              "unit_tests",
          ):
              if manifest.get(key) != "PASS":
                  raise SystemExit(f"BLOCKED: {key} did not pass")

          print("VERIFIED_LOCK_ARTIFACT_PROVENANCE_AND_HASHES")
          PY

      - name: Publish only requirements-lock.txt to the review branch
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"

          file="generated/requirements-lock.txt"
          test -s "$file"

          api_path="repos/${REPOSITORY}/contents/requirements-lock.txt"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          branch_ref="$(gh api --method GET \
            "repos/${REPOSITORY}/git/ref/heads/${BRANCH}")"

          branch_head="$(jq -er '.object.sha' <<< "$branch_ref")"

          if [[ "$branch_head" != "$CURRENT_SHA" ]]; then
            echo "Branch HEAD changed during lock generation."
            echo "Refusing to publish against a moving target."
            exit 1
          fi

          current_sha=""

          if gh api --method GET "$api_path" \
              --field "ref=$BRANCH" \
              > "$temp_dir/current.json" \
              2> "$temp_dir/get.err"; then

            current_sha="$(jq -er '.sha' "$temp_dir/current.json")"

            jq -er '.content' "$temp_dir/current.json" \
              | tr -d '\n' \
              | base64 --decode \
              > "$temp_dir/current-lock.txt"

            if cmp -s "$file" "$temp_dir/current-lock.txt"; then
              echo "Lock is unchanged; no commit is required."
              echo "commit_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi

          else
            if grep -Eq 'HTTP 404|Not Found' "$temp_dir/get.err"; then
              current_sha=""
            else
              cat "$temp_dir/get.err" >&2
              exit 1
            fi
          fi

          base64 -w 0 "$file" > "$temp_dir/content.b64"

          if [[ -n "$current_sha" ]]; then
            jq -n \
              --arg message "Refresh Python 3.11.15 hash-locked dependencies" \
              --rawfile content "$temp_dir/content.b64" \
              --arg branch "$BRANCH" \
              --arg sha "$current_sha" \
              '{message:$message, content:$content, branch:$branch, sha:$sha}' \
              > "$temp_dir/request.json"
          else
            jq -n \
              --arg message "Create Python 3.11.15 hash-locked dependencies" \
              --rawfile content "$temp_dir/content.b64" \
              --arg branch "$BRANCH" \
              '{message:$message, content:$content, branch:$branch}' \
              > "$temp_dir/request.json"
          fi

          response="$(
            gh api --method PUT "$api_path" \
            --input "$temp_dir/request.json"
          )"

          commit_sha="$(jq -er '.commit.sha' <<< "$response")"

          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Published lock commit: $commit_sha"

  review-head:
    if: ${{ inputs.assurance_only }}
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.identity.outputs.commit_sha }}

    steps:
      - name: Checkout exact review HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify branch and exact HEAD
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/review/type1-v4-remediation"

          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"

          echo "commit_sha=$actual" >> "$GITHUB_OUTPUT"
          
  exact-assurance:
    needs: [publish, review-head]

    if: ${{ always() && (needs.publish.result == 'success' || needs.review-head.result == 'success') }}

    permissions:
      contents: read

    uses: $/.github/workflows/software-assurance-exact-commit-v1.yml

    with:
      scan_commit: ${{ inputs.assurance_only && needs.review-head.outputs.commit_sha || needs.publish.outputs.commit_sha }}
