name: Cross-Architecture Replication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sample: [1000000, 500000]
        window: [none, hann]
        norm: [raw, variance_normalized]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout workflow-definition revision
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.11.15"

    - name: Install locked dependencies
      run: python -m pip install --require-hashes -r requirements-lock.txt

    - name: Run spectral test
      env:
        SAMPLE_SIZE: ${{ matrix.sample }}
        WINDOW_TYPE: ${{ matrix.window }}
        NORMALIZATION: ${{ matrix.norm }}
      run: |
        python spectral_engine.py
