name: Cross-Architecture Replication

on:
  workflow_dispatch:

jobs:
  test-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        sample: [1000000, 500000]
        window: [none, hann]
        norm: [raw, variance_normalized]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install numpy scipy

    - name: Run spectral test
      env:
        SAMPLE_SIZE: ${{ matrix.sample }}
        WINDOW_TYPE: ${{ matrix.window }}
        NORMALIZATION: ${{ matrix.norm }}
      run: |
        python spectral_engine.py
