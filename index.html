<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MAXIMAL-ONE</title>

  <link rel="stylesheet" href="./css/field.css" />

  <style>
    body {
      background: #0b0b0b;
      color: #e0e0e0;
      font-family: monospace;
      padding: 40px;
    }

    h1 {
      font-weight: normal;
      opacity: 0.85;
    }

    #state {
      margin-top: 10px;
      opacity: 0.6;
    }

    #witness-input {
      width: 100%;
      height: 120px;
      margin-top: 30px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 10px;
      font-family: monospace;
      resize: none;
    }

    #witness-submit {
      margin-top: 10px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 6px 14px;
      cursor: pointer;
    }

    #witness-submit:hover {
      opacity: 0.7;
    }

    #event {
      margin-top: 30px;
      opacity: 0.8;
      white-space: pre-wrap;
    }

    .nav-orientation {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <a href="/orientation/" class="nav-orientation">orientation</a>

  <h1>MAXIMAL-ONE</h1>
  <div id="state">present</div>

  <div id="field-indicator" class="field-indicator">
    <span>Field Status:</span>
    <span id="field-state">present</span>
  </div>

  <div class="state">The field is active.</div>

  <textarea id="witness-input" placeholder="…" autocomplete="off"></textarea>
  <button id="witness-submit">Invoke</button>

  <div id="event"></div>

  <script type="module">
  import { resolveState } from './core/state_resolver.js';
  import { unifiedField } from './core/unified_field.js';
  import { persistWitness } from './core/witness_persistence.js';
  import { buildWitnessEnvelope } from './core/witness_integrity.js';

  const input = document.getElementById("witness-input");
  const submit = document.getElementById("witness-submit");
  const state = document.getElementById("state");
  const eventBox = document.getElementById("event");

  async function refreshState() {
    try {
      const res = await fetch('./data/latest_state.json', { cache: "no-store" });
      if (!res.ok) return;

      const d = await res.json();

      document.getElementById("field-state").innerText = d.field || "unknown";
      state.innerText = d.layer || "unknown";

    } catch {}
  }

  // refresh every 3 seconds
  setInterval(refreshState, 3000);

  refreshState();

  submit.addEventListener("click", async () => {
    const value = input.value.trim();
    if (!value) return;

    state.innerText = "processing";
    eventBox.innerText = "";

    try {
      const result = await unifiedField(value);

      const envelope = buildWitnessEnvelope(result);

      eventBox.innerText = JSON.stringify(envelope, null, 2);

      import { dispatchIntent } from './core/intent_dispatcher.js';

      const dispatchResult = await dispatchIntent(envelope);
      console.log(dispatchResult);

      // optional: send to backend if exists
      await fetch("/api/witness", {
        method: "POST",
        headers: {
        "Content-Type": "application/json"
        },
        body: JSON.stringify(envelope)
      });

      persistWitness(envelope);

    } catch (err) {
      eventBox.innerText = "ERROR: " + err.message;
    }

    state.innerText = "present";
  });
</script>

</body>
</html>
