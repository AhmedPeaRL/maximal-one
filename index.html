<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MAXIMAL-ONE</title>

  <link rel="stylesheet" href="./css/field.css" />

  <style>
    body {
      background: #0b0b0b;
      color: #e0e0e0;
      font-family: monospace;
      padding: 40px;
    }

    h1 {
      font-weight: normal;
      opacity: 0.85;
    }

    #state {
      margin-top: 10px;
      opacity: 0.6;
    }

    #witness-input {
      width: 100%;
      height: 120px;
      margin-top: 30px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 10px;
      font-family: monospace;
      resize: none;
    }

    #witness-submit {
      margin-top: 10px;
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #333;
      padding: 6px 14px;
      cursor: pointer;
    }

    #witness-submit:hover {
      opacity: 0.7;
    }

    #event {
      margin-top: 30px;
      opacity: 0.8;
      white-space: pre-wrap;
    }

    .nav-orientation {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <a href="/orientation/" class="nav-orientation">orientation</a>

  <h1>MAXIMAL-ONE</h1>
  <div id="state">present</div>

  <div id="field-indicator" class="field-indicator">
    <span>Field Status:</span>
    <span id="field-state">present</span>
  </div>

  <div class="state">System operational under reproducible conditions.</div>

  <textarea id="witness-input" placeholder="…" autocomplete="off"></textarea>
  <button id="witness-submit">Invoke</button>
  
  <button id="reproduce">Force External Reproduction</button>
  <button id="public-reproduce">Public Reproduce</button>
  <textarea id="challenge-input" placeholder="challenge the system..."></textarea>
  <button id="challenge-submit">Challenge</button>

  <div id="event"></div>
  <div id="external-challenges" style="margin-top:30px; opacity:0.75;">
    Loading external challenges...
  </div>
  <div id="scientific-claim" style="margin-top:30px; opacity:0.75;">
    Loading claim...
  </div>
  <div id="scientific-report" style="margin-top:30px; opacity:0.75;"></div>

  <div id="market-signal" style="margin-top:30px; opacity:0.8;">
    Loading extracted signal...
  </div>

  <div id="pressure-log" style="margin-top:30px; opacity:0.8;">
    Loading pressure export...
  </div>

  <div id="prediction-anchor" style="margin-top:30px; opacity:0.8;"></div>
  <div id="irreducible-truth" style="margin-top:30px; opacity:0.9;"></div>
  <div id="time-anchor" style="margin-top:30px; opacity:0.7;"></div>

  <script type="module">
  import { bindIrreducibleReality } from './core/irreducible_anchor.js';
  import { resolveState } from './core/state_resolver.js';
  import { unifiedField } from './core/unified_field.js';
  import { persistWitness } from './core/witness_persistence.js';
  import { buildWitnessEnvelope } from './core/witness_integrity.js';
  import { loadLiveWitness } from './core/live_witness_panel.js';
  import { bindPresence } from './core/presence_binding.js';
  import { sendWitnessToSystem } from './core/live_causal_bridge.js';

  const input = document.getElementById("witness-input");
  const submit = document.getElementById("witness-submit");
  const state = document.getElementById("state");
  const eventBox = document.getElementById("event");
    
  async function refreshState() {
    try {
      const res = await fetch('./data/live_field_state.json');
      const d = await res.json();
      
      document.getElementById("field-state").innerText =
        d.global_state;

      state.innerText =
        d.node_consensus ? "coherent" : "drifting";

    } catch {}
  }

  import { loadRealitySnapshot } from './core/reality_bridge.js';

  async function refreshWitnessPanel() {
    const panel = document.getElementById("witness-panel");

    if (!panel) return;

    try {
      const d = await bindPresence();

      if (d.error) {
        panel.innerText = "Signal failure";
        return;
      }

      panel.innerText =
        `α: ${d.alpha ?? "—"} | σ: ${d.sigma ?? "—"}\n` +
        `DECISION: ${d.decision}\n` +
        `LAYER: ${d.layer} | FIELD: ${d.field}\n` +
        `t: ${new Date(d.timestamp).toLocaleTimeString()}`;

    } catch {
      panel.innerText = "No signal";
    }
  }

  async function loadScientificClaim() {
    try {
      const res = await fetch('./core-scientific/minimal_claim.json');
      const claim = await res.json();

      const el = document.getElementById("scientific-claim");

      el.innerText =
        "SCIENTIFIC CLAIM (TESTED, NOT ASSUMED):\n" + claim.statement + "\n\n" +
        "\n\nOUTPUT:\n" +
        "alpha (α), sigma (σ), decision" +
        "NULL:\n" + claim.null_hypothesis + "\n\n" +
        "CRITERIA:\n" +
        "p < " + claim.test_protocol.criteria.p_value_threshold +
        " | effect > " + claim.test_protocol.criteria.effect_size_min;

    } catch {
      document.getElementById("scientific-claim").innerText = "No claim loaded.";
    }
  }

  async function syncReality() {
    try {
      const res = await fetch("/maximal-one/api/reality-sync");
      const d = await res.json();

      if (!d.ok) return;

      const eventBox = document.getElementById("event");

      eventBox.innerText =
        "REALITY SYNC:\n" +
        JSON.stringify(d.state, null, 2);

    } catch {}
  }

  async function loadTruth() {
    try {
      const res = await fetch('./public/live_truth.json');
      const t = await res.json();

      const el = document.getElementById("event");

      el.innerText =
        "EXTERNAL TRUTH SURFACE:\n";
          const collisionRes = await fetch('./artifacts/external_collision.json');
          const collision = await collisionRes.json();

        el.innerText +=
          "\n\nCOLLISION RESULT:\n" +
          JSON.stringify(collision, null, 2);

    } catch {
      console.log("No truth surface");
    }
  }

  async function loadScientificReport() {
    try {
      const res = await fetch('./public/scientific_report.md');
      const text = await res.text();
      
      document.getElementById("scientific-report").innerText = text;
    } catch {
      document.getElementById("scientific-report").innerText = "No report loaded.";
    }
  }

  async function loadCausalFeedback() {
    try {
      const res = await fetch('./data/causal_feedback.json');
      const f = await res.json();
  
      const panel = document.getElementById("witness-panel");

      panel.innerText +=
        "\n\nFEEDBACK:\n" +
        `action: ${f.action}\n` +
        `confidence: ${f.confidence}\n` +
        `drift: ${f.drift}`;

    } catch {}
  }

  async function verifyTruth() {
    try {
      const res = await fetch("/maximal-one/api/verify-truth");
      const v = await res.json();

      const panel = document.getElementById("witness-panel");

      panel.innerText +=
        "\n\nVERIFICATION:\n" +
        `integrity: ${v.integrity}\n` +
        `decision: ${v.decision}\n` +
        `confidence: ${v.confidence}`;

    } catch {}
  }

  async function loadExtractedSignal() {
    try {
      const res = await fetch('./public/extracted_signal.json');
      const s = await res.json();
      
      document.getElementById("market-signal").innerText =
        "EXTRACTED SIGNAL:\n" +
        JSON.stringify(s, null, 2);

    } catch {
      document.getElementById("market-signal").innerText = "No signal extracted.";
    }
  }

  async function loadTimeAnchor() {
    try {
      const res = await fetch('./public/external_time_anchor.json');
      const t = await res.json();

      document.getElementById("time-anchor").innerText =
        "EXTERNAL TIME ANCHOR:\n" +
        JSON.stringify(t, null, 2);
    } catch {
      document.getElementById("time-anchor").innerText = "No anchor.";
    }
  }

  async function loadChallenges() {
    try {
      const res = await fetch('./data/external_challenges.json');
      const c = await res.json();
      
      document.getElementById("external-challenges").innerText =
        "EXTERNAL CHALLENGES:\n" +
        JSON.stringify(c, null, 2);

    } catch {
      document.getElementById("external-challenges").innerText =
        "No challenges yet.";
    }
  }

  async function loadPressure() {
    try {
      const res = await fetch('./data');
      document.getElementById("pressure-log").innerText =
        "Pressure export active (check repo data folder)";
    } catch {
      document.getElementById("pressure-log").innerText =
        "No pressure signal.";
    }
  }

  async function loadPredictionAnchor() {
    try {
      const res = await fetch('./public/prediction_anchor.json');
      const p = await res.json();

      const el = document.getElementById("prediction-anchor");

      el.innerText =
        "IRREVERSIBLE PREDICTION:\n" +
        JSON.stringify(p, null, 2);

    } catch {
      document.getElementById("prediction-anchor").innerText =
      "No prediction anchored.";
    }
  }

  async function loadIrreducibleTruth() {
    try {
      const res = await fetch('./public/irreducible_truth.json');
      const t = await res.json();

      document.getElementById("irreducible-truth").innerText =
        "IRREDUCIBLE TRUTH:\n" +
        JSON.stringify(t, null, 2);

    } catch {
      document.getElementById("irreducible-truth").innerText =
        "No irreducible truth yet.";
    }
  }
    
  import { liveStream } from './core/live_stream.js';
  import { applyCausalFeedback } from './core/causal_feedback.js';

  liveStream(async (d) => {
    refreshState();
    refreshWitnessPanel();
    loadScientificClaim();
    syncReality();
    loadScientificReport();
    loadCausalFeedback();
    verifyTruth();
    loadExtractedSignal();
    loadTimeAnchor();
    loadChallenges();
    loadPressure();
    loadPredictionAnchor();
    loadIrreducibleTruth();

    try {
      const res = await fetch('./public/live_truth.json');
      const truth = await res.json();

      applyCausalFeedback(truth);
    } catch {}

    loadTruth();
    
    document.getElementById("field-state").innerText = d.global_state;
    state.innerText = d.node_consensus ? "coherent" : "drifting";
  });

  submit.addEventListener("click", async () => {
    const value = input.value.trim();
    if (!value) return;

    state.innerText = "bridging";

    try {
      // 1. local computation
      const reality = await bindIrreducibleReality();

      const result = await unifiedField({
        input: value,
        reality_anchor: reality
      });

      const envelope = buildWitnessEnvelope({
        ...result,
        reality_anchor: reality
      });

      // FIX: عرض النتيجة الفعلية مش متغير مش موجود
      eventBox.innerText =
        "LOCAL RESULT:\n" +
        JSON.stringify(envelope, null, 2);

      // 2. send to real system
      const bridge = await fetch("/maximal-one/api/dispatch", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ input: value })
      });

      const bridgeResult = await bridge.json();

      if (bridgeResult.ok) {
        state.innerText = "propagated → field updated";
      } else {
        state.innerText = "partial";
      }

    } catch (e) {
      state.innerText = "error";
      eventBox.innerText = e.message;
    }

    setTimeout(() => {
      state.innerText = "present";
    }, 2000);
  });

  const reproduceBtn = document.getElementById("reproduce");
  
  reproduceBtn.addEventListener("click", async () => {
    try {
      const res = await fetch("/maximal-one/api/reproduce", {
        method: "POST"
      });

      const r = await res.json();

      if (r.ok) {
        document.getElementById("event").innerText =
          "External reproduction triggered.";
      } else {
        document.getElementById("event").innerText =
          "Reproduction failed.";
      }
    } catch {
      
      document.getElementById("event").innerText =
        "Error triggering reproduction.";
    }
  });

  const challengeInput = document.getElementById("challenge-input");
  const challengeBtn = document.getElementById("challenge-submit");

  challengeBtn.addEventListener("click", async () => {
    const value = challengeInput.value.trim();
    if (!value) return;

    try {
      const res = await fetch("/maximal-one/api/challenge", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ challenge: value })
      });

      const r = await res.json();

      if (r.ok) {
        document.getElementById("event").innerText =
          "Challenge submitted:\n" + r.challenge_id;
      } else {
        document.getElementById("event").innerText =
          "Challenge rejected.";
      }

    } catch {
      document.getElementById("event").innerText =
        "Challenge error.";
    }
  });

  const pubBtn = document.getElementById("public-reproduce");

  pubBtn.addEventListener("click", async () => {
    const input = document.getElementById("witness-input").value;

    const res = await fetch("/maximal-one/api/public-reproduce", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ input })
    });

    const r = await res.json();

    document.getElementById("event").innerText =
      "PUBLIC REPRODUCTION:\n" +
      JSON.stringify(r, null, 2);
  });
</script>
  
  <div id="witness-panel" style="margin-top:20px; opacity:0.7;">
    Loading scientific signal...
  </div>

</body>
</html>
